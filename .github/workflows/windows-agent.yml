name: GLAFIRA Windows Agent

on:
  pull_request:
    paths:
      - "windows-agent/**"
      - ".github/workflows/windows-agent.yml"
      - "contracts/**"
  push:
    branches: [main]
    paths:
      - "windows-agent/**"
      - ".github/workflows/windows-agent.yml"
      - "contracts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows Agent compile
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Setup Python for report verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Restore
        run: dotnet restore windows-agent/GLAFIRA.Agent.Worker/GLAFIRA.Agent.Worker.csproj
      - name: Run Agent tests and write TRX report
        run: dotnet test windows-agent/GLAFIRA.Agent.Worker.Tests/GLAFIRA.Agent.Worker.Tests.csproj --configuration Release --logger "trx;LogFileName=agent-tests.trx" --results-directory windows-agent/GLAFIRA.Agent.Worker.Tests/TestResults
      - name: Verify executed Agent test report
        if: success()
        run: python .github/scripts/verify-trx-report.py windows-agent/GLAFIRA.Agent.Worker.Tests/TestResults
      - name: Upload Agent test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-agent-test-results-${{ github.run_id }}
          path: windows-agent/GLAFIRA.Agent.Worker.Tests/TestResults/*.trx
          if-no-files-found: error
          retention-days: 7
      - name: Build service
        run: dotnet build windows-agent/GLAFIRA.Agent.Worker/GLAFIRA.Agent.Worker.csproj --configuration Release
