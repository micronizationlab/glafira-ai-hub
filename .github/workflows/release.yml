name: GLAFIRA Signed Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed Android update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require stable signing secrets
        env:
          KEYSTORE: ${{ secrets.GLAFIRA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GLAFIRA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GLAFIRA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GLAFIRA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || (echo "Missing GLAFIRA_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing GLAFIRA_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing GLAFIRA_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing GLAFIRA_KEY_PASSWORD" && exit 1)

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          script: gradle connectedDebugAndroidTest

      - name: Decode owner-controlled signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GLAFIRA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/glafira-release.jks"
          chmod 600 "$RUNNER_TEMP/glafira-release.jks"

      - name: Build release APK
        env:
          GLAFIRA_KEYSTORE_PATH: ${{ runner.temp }}/glafira-release.jks
          GLAFIRA_KEYSTORE_PASSWORD: ${{ secrets.GLAFIRA_KEYSTORE_PASSWORD }}
          GLAFIRA_KEY_ALIAS: ${{ secrets.GLAFIRA_KEY_ALIAS }}
          GLAFIRA_KEY_PASSWORD: ${{ secrets.GLAFIRA_KEY_PASSWORD }}
        run: |
          VERSION_CODE="$(git rev-list --count HEAD)"
          gradle assembleRelease -PglafiraVersionCode="$VERSION_CODE" -PglafiraVersionName="$GITHUB_REF_NAME"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/glafira-$VERSION_CODE.apk"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "release/glafira-$VERSION_CODE.apk" \
            --title "GLAFIRA AI HUB $GITHUB_REF_NAME" \
            --generate-notes
