name: GLAFIRA iOS Package

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

# Do not add a concurrency group with cancel-in-progress for validation.
# GitHub keeps only one pending run per concurrency group and may replace
# an older pending run with a newer one. Each iOS validation is important:
# let GitHub queue every run rather than silently cancelling earlier checks.

permissions:
  contents: read

jobs:
  swift-package:
    name: Build and test GlafiraBridgeKit
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Run Swift package tests
        working-directory: ios/GlafiraBridgeKit
        run: swift test
