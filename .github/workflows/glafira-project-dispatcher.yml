name: GLAFIRA Project Dispatcher

on:
  push:
    branches:
      - glafira/project-dispatcher-v1
  workflow_run:
    workflows:
      - GLAFIRA CI — change-aware platform validation
      - GLAFIRA Windows Agent
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: glafira-project-dispatcher
  # Serialize global status reconciliation; do not cancel an active scan because another PR changed.
  cancel-in-progress: false

jobs:
  project-status:
    name: Reconcile all active GLAFIRA workstreams
    runs-on: ubuntu-latest
    steps:
      - name: Prepare and test exact-head renderer
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/render-dispatcher-status.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          prs_file="$1"
          runs_file="$2"
          prs="$(cat "$prs_file")"
          runs="$(cat "$runs_file")"
          if ! jq -e 'type == "array"' >/dev/null 2>&1 <<< "$prs"; then
            echo "pull request input must be a JSON array" >&2
            exit 2
          fi
          while IFS= read -r pr; do
            number="$(jq -r '.number' <<< "$pr")"
            title="$(jq -r '.title // ""' <<< "$pr" | tr '|' '/')"
            branch="$(jq -r '.headRefName // ""' <<< "$pr")"
            sha="$(jq -r '.headRefOid // ""' <<< "$pr")"
            draft="$(jq -r '.isDraft // false' <<< "$pr")"
            url="$(jq -r '.url // ""' <<< "$pr")"
            checks="$(jq -c '.statusCheckRollup // []' <<< "$pr")"
            if [[ "$(jq 'length' <<< "$checks")" -gt 0 ]]; then
              ci="$(jq -r 'map("\(.name // .context // "check"): \(.status // .state // "unknown")/\(.conclusion // "pending") ([check](\(.detailsUrl // .targetUrl // "")))") | join("<br>")' <<< "$checks")"
            elif ! jq -e 'type == "array"' >/dev/null 2>&1 <<< "$runs"; then
              ci="UNKNOWN / ACTIONS API UNAVAILABLE"
            else
              matching="$(jq -c --arg sha "$sha" '[.[] | select(.headSha == $sha) | select(((.name // "") | startswith("METADATA_ONLY:")) | not)] | sort_by(.createdAt // "") | reverse | group_by(.workflowName // .name // "unknown") | map(.[0])' <<< "$runs")"
              if [[ "$(jq 'length' <<< "$matching")" -eq 0 ]]; then
                ci="NO MATCHING RUN FOR EXACT HEAD"
              else
                ci="$(jq -r 'map((.workflowName // .name // "workflow") + ": " + (if .status == "queued" then "QUEUED" elif .status == "in_progress" then "IN_PROGRESS" elif .status == "completed" then ("COMPLETED/" + (.conclusion // "UNKNOWN")) else "UNKNOWN/" + (.status // "missing") end) + " ([run](\(.url // "")))") | join("<br>")' <<< "$matching")"
              fi
            fi
            short_sha="${sha:0:12}"
            echo "| [#$number]($url) $title | $branch | <code>$short_sha</code> | $ci | $draft |"
          done < <(jq -c '.[]' <<< "$prs")
          SCRIPT

          cat > "$RUNNER_TEMP/fetch-open-prs.sh" <<'FETCH'
          #!/usr/bin/env bash
          set -euo pipefail
          repo="$1"
          if prs="$(gh pr list --repo "$repo" --state open --limit 100 --json number,title,headRefName,headRefOid,isDraft,url,statusCheckRollup 2>/dev/null)"; then
            jq -e 'type == "array"' >/dev/null <<< "$prs"
            printf '%s\n' "$prs"
            exit 0
          fi
          # Recover the PR inventory with REST if GraphQL fails; API failure never means pass.
          rest_prs="$(gh api "repos/$repo/pulls?state=open&per_page=100")"
          jq -e 'type == "array"' >/dev/null <<< "$rest_prs"
          jq '[.[] | {
            number: .number,
            title: .title,
            headRefName: .head.ref,
            headRefOid: .head.sha,
            isDraft: .draft,
            url: .html_url,
            statusCheckRollup: []
          }]' <<< "$rest_prs"
          FETCH
          cat > "$RUNNER_TEMP/test-renderer.sh" <<'TEST'
          #!/usr/bin/env bash
          set -euo pipefail
          renderer="$RUNNER_TEMP/render-dispatcher-status.sh"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/prs.json" <<'JSON'
          [
            {"number":553,"title":"current exact head","headRefName":"docs/reconcile","headRefOid":"sha-current","isDraft":false,"url":"https://example.test/pr/553","statusCheckRollup":[]},
            {"number":554,"title":"stale only","headRefName":"feature/stale","headRefOid":"sha-new","isDraft":true,"url":"https://example.test/pr/554","statusCheckRollup":[]},
            {"number":555,"title":"rollup preferred","headRefName":"feature/rollup","headRefOid":"sha-rollup","isDraft":false,"url":"https://example.test/pr/555","statusCheckRollup":[{"name":"required","status":"COMPLETED","conclusion":"SUCCESS","detailsUrl":"https://example.test/check"}]},
            {"number":556,"title":"queued exact head","headRefName":"feature/queued","headRefOid":"sha-queued","isDraft":false,"url":"https://example.test/pr/556","statusCheckRollup":[]},
            {"number":557,"title":"skipped exact head","headRefName":"feature/skipped","headRefOid":"sha-skipped","isDraft":false,"url":"https://example.test/pr/557","statusCheckRollup":[]},
            {"number":558,"title":"in progress exact head","headRefName":"feature/in-progress","headRefOid":"sha-progress","isDraft":false,"url":"https://example.test/pr/558","statusCheckRollup":[]},
            {"number":559,"title":"cancelled exact head","headRefName":"feature/cancelled","headRefOid":"sha-cancelled","isDraft":false,"url":"https://example.test/pr/559","statusCheckRollup":[]},
            {"number":560,"title":"failed exact head","headRefName":"feature/failed","headRefOid":"sha-failed","isDraft":false,"url":"https://example.test/pr/560","statusCheckRollup":[]},
            {"number":562,"title":"metadata run must not hide validation","headRefName":"feature/metadata","headRefOid":"sha-meta","isDraft":false,"url":"https://example.test/pr/562","statusCheckRollup":[]}
          ]
          JSON
          cat > "$tmp/runs.json" <<'JSON'
          [
            {"headSha":"sha-current","workflowName":"Android CI","name":"Android CI","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:00:00Z","url":"https://example.test/run/1"},
            {"headSha":"sha-current","workflowName":"Dispatcher","name":"Dispatcher","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:01:00Z","url":"https://example.test/run/2"},
            {"headSha":"sha-current","workflowName":"Android CI","name":"Android CI","status":"completed","conclusion":"failure","createdAt":"2026-11-24T11:00:00Z","url":"https://example.test/run/old"},
            {"headSha":"sha-other","workflowName":"Android CI","name":"Android CI","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:02:00Z","url":"https://example.test/run/stale"},
            {"headSha":"sha-queued","workflowName":"Desktop CI","name":"Desktop CI","status":"queued","conclusion":null,"createdAt":"2026-11-24T12:03:00Z","url":"https://example.test/run/queued"},
            {"headSha":"sha-skipped","workflowName":"iOS CI","name":"iOS CI","status":"completed","conclusion":"skipped","createdAt":"2026-11-24T12:04:00Z","url":"https://example.test/run/skipped"},
            {"headSha":"sha-progress","workflowName":"Desktop CI","name":"Desktop CI","status":"in_progress","conclusion":null,"createdAt":"2026-11-24T12:05:00Z","url":"https://example.test/run/progress"},
            {"headSha":"sha-cancelled","workflowName":"Windows CI","name":"Windows CI","status":"completed","conclusion":"cancelled","createdAt":"2026-11-24T12:06:00Z","url":"https://example.test/run/cancelled"},
            {"headSha":"sha-failed","workflowName":"Agent CI","name":"Agent CI","status":"completed","conclusion":"failure","createdAt":"2026-11-24T12:07:00Z","url":"https://example.test/run/failed"},
            {"headSha":"sha-meta","workflowName":"GLAFIRA Java Format Check","name":"VALIDATION: Java format","status":"completed","conclusion":"failure","createdAt":"2026-11-24T12:07:00Z","url":"https://example.test/run/format-failed"},
            {"headSha":"sha-meta","workflowName":"GLAFIRA Java Format Check","name":"METADATA_ONLY: PR metadata edit","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:08:00Z","url":"https://example.test/run/metadata-skipped"}
          ]
          JSON
          output="$(bash "$renderer" "$tmp/prs.json" "$tmp/runs.json")"
          grep -q 'Android CI: COMPLETED/success' <<< "$output"
          grep -q 'Dispatcher: COMPLETED/success' <<< "$output"
          grep -q 'GLAFIRA Java Format Check: COMPLETED/failure' <<< "$output"
          ! grep -q 'METADATA_ONLY' <<< "$output"
          grep -q 'NO MATCHING RUN FOR EXACT HEAD' <<< "$output"
          grep -q 'required: COMPLETED/SUCCESS' <<< "$output"
          grep -q 'Desktop CI: QUEUED' <<< "$output"
          grep -q 'iOS CI: COMPLETED/skipped' <<< "$output"
          grep -q 'Desktop CI: IN_PROGRESS' <<< "$output"
          grep -q 'Windows CI: COMPLETED/cancelled' <<< "$output"
          grep -q 'Agent CI: COMPLETED/failure' <<< "$output"
          # Simulate GraphQL failure and confirm the PR inventory falls back to REST.
          mkdir -p "$tmp/fake-bin"
          cat > "$tmp/fake-bin/gh" <<'GH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$1" == "pr" ]]; then
            echo "GraphQL unavailable" >&2
            exit 1
          fi
          if [[ "$1" == "api" ]]; then
            cat <<'JSON'
          [{"number":561,"title":"REST fallback","draft":true,"html_url":"https://example.test/pr/561","head":{"ref":"rest/fallback","sha":"sha-rest"}}]
          JSON
            exit 0
          fi
          exit 2
          GH
          chmod +x "$tmp/fake-bin/gh"
          rest_output="$(PATH="$tmp/fake-bin:$PATH" bash "$RUNNER_TEMP/fetch-open-prs.sh" micronizationlab/glafira-ai-hub)"
          jq -e 'length == 1 and .[0].headRefOid == "sha-rest" and .[0].statusCheckRollup == []' <<< "$rest_output" >/dev/null
          cat > "$tmp/fake-bin/gh" <<'GH'
          #!/usr/bin/env bash
          echo "all PR inventory APIs unavailable" >&2
          exit 1
          GH
          chmod +x "$tmp/fake-bin/gh"
          if PATH="$tmp/fake-bin:$PATH" bash "$RUNNER_TEMP/fetch-open-prs.sh" micronizationlab/glafira-ai-hub >/dev/null 2>&1; then
            echo "expected PR inventory fallback to fail closed" >&2
            exit 1
          fi
          unknown_output="$(bash "$renderer" "$tmp/prs.json" <(printf 'null'))"
          grep -q 'UNKNOWN / ACTIONS API UNAVAILABLE' <<< "$unknown_output"
          empty_output="$(bash "$renderer" <(printf '[]') "$tmp/runs.json")"
          [[ -z "$empty_output" ]]
          echo "dispatcher status renderer fixtures: PASS"
          TEST
          bash "$RUNNER_TEMP/test-renderer.sh"
      - name: Build cross-workstream status report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if ! prs="$(bash "$RUNNER_TEMP/fetch-open-prs.sh" "$GH_REPO")"; then
            {
              echo "# GLAFIRA Project Dispatcher"
              echo ""
              echo "ERROR: GraphQL and REST open-PR inventory are unavailable; no status is reported as passing."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf '%s\n' "$prs" > "$RUNNER_TEMP/glafira-open-prs.json"
          # One batched Actions API query is the fallback when GraphQL statusCheckRollup is empty.
          if runs="$(gh run list --repo "$GH_REPO" --limit 1000 --json headSha,name,workflowName,status,conclusion,url,createdAt 2>/dev/null)"; then
            printf '%s\n' "$runs" > "$RUNNER_TEMP/glafira-workflow-runs.json"
          else
            printf 'null\n' > "$RUNNER_TEMP/glafira-workflow-runs.json"
          fi
          count="$(jq 'length' <<< "$prs")"
          if [[ "$count" -eq 0 ]]; then
            {
              echo "# GLAFIRA Project Dispatcher"
              echo ""
              echo "No open pull requests."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "# GLAFIRA Project Dispatcher"
            echo ""
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "| PR | Branch | Head SHA | Latest matching CI | Draft |"
            echo "|---:|---|---|---|:---:|"
            bash "$RUNNER_TEMP/render-dispatcher-status.sh" "$RUNNER_TEMP/glafira-open-prs.json" "$RUNNER_TEMP/glafira-workflow-runs.json"
            echo ""
            echo "Policy: match workflow runs only to the exact current PR head SHA. Older-head runs are not acceptance evidence. Skipped, cancelled, queued, partial or unknown states are not passes."
          } >> "$GITHUB_STEP_SUMMARY"
