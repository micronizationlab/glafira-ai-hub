name: GLAFIRA Project Dispatcher

on:
  push:
    branches:
      - glafira/project-dispatcher-v1
  workflow_run:
    workflows:
      - GLAFIRA CI — change-aware platform validation
      - GLAFIRA Windows Agent
      - GLAFIRA Java Format Check
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  # Never let a later event replace a pending PR test or workflow-completion reconciliation.
  group: ${{ github.event_name == 'pull_request' && format('glafira-project-dispatcher-pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_run' && format('glafira-project-dispatcher-workflow-run-{0}', github.event.workflow_run.id) || format('glafira-project-dispatcher-run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  project-status:
    name: Reconcile all active GLAFIRA workstreams
    runs-on: ubuntu-latest
    steps:
      - name: Prepare and test exact-head renderer
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/render-dispatcher-status.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          prs_file="$1"
          runs_file="$2"
          prs="$(cat "$prs_file")"
          runs="$(cat "$runs_file")"
          if ! jq -e 'type == "array"' >/dev/null 2>&1 <<< "$prs"; then
            echo "pull request input must be a JSON array" >&2
            exit 2
          fi
          while IFS= read -r pr; do
            number="$(jq -r '.number' <<< "$pr")"
            # PR titles and branch names are contributor-controlled: strip Markdown syntax.
            title="$(jq -r '.title // "" | gsub("https?://[^ )]+"; "") | gsub("[|]"; "/") | gsub("[^[:alnum:] _.,:;!?-]"; " ")' <<< "$pr")"
            branch="$(jq -r '.headRefName // "" | gsub("[^[:alnum:] _.,:/-]"; " ")' <<< "$pr")"
            sha="$(jq -r '.headRefOid // ""' <<< "$pr")"
            base_sha="$(jq -r '.baseRefOid // ""' <<< "$pr")"
            draft="$(jq -r '.isDraft // false' <<< "$pr")"
            url="$(jq -r '.url // ""' <<< "$pr")"
            checks="$(jq -c '[.statusCheckRollup[]? | select(((.name // .context // "") | contains("PR metadata edit")) | not)]' <<< "$pr")"
            if [[ "$(jq 'length' <<< "$checks")" -gt 0 ]]; then
              ci="HEAD-ONLY / BASE NOT VERIFIED: $(jq -r 'map("\(.name // .context // "check"): \(.status // .state // "unknown")/\(.conclusion // "pending") ([check](\(.detailsUrl // .targetUrl // "")))") | join("<br>")' <<< "$checks")"
            elif ! jq -e 'type == "array"' >/dev/null 2>&1 <<< "$runs"; then
              ci="UNKNOWN / ACTIONS API UNAVAILABLE"
            else
              matching="$(jq -c --arg sha "$sha" --arg base "$base_sha" --argjson number "$number" '
                [.[] |
                  select(.headSha == $sha) |
                  select($base != "" and any((.pullRequests // [])[]?; .number == $number and (.base.sha // "") != "" and .base.sha == $base)) |
                  select((.workflowName // .name // "") != "GLAFIRA Java Format Check" or ((.displayTitle // "") | startswith("METADATA_ONLY -") | not))
                ] | sort_by(.createdAt // "") | reverse | group_by(.workflowName // .name // "unknown") | map(.[0])
              ' <<< "$runs")"
              if [[ "$(jq 'length' <<< "$matching")" -eq 0 ]]; then
                ci="NO MATCHING RUN FOR EXACT PR/HEAD/BASE"
              else
                ci="$(jq -r 'map((.workflowName // .name // "workflow") + ": " + (if .status == "queued" then "QUEUED" elif .status == "in_progress" then "IN_PROGRESS" elif .status == "completed" then ("COMPLETED/" + (.conclusion // "UNKNOWN")) else "UNKNOWN/" + (.status // "missing") end) + " ([run](\(.url // "")))") | join("<br>")' <<< "$matching")"
              fi
            fi
            short_sha="$(cut -c1-12 <<< "$sha")"
            echo "| [#$number]($url) $title | <code>$branch</code> | <code>$short_sha</code> | $ci | $draft |"
          done < <(jq -c '.[]' <<< "$prs")
          SCRIPT

          cat > "$RUNNER_TEMP/fetch-open-prs.sh" <<'FETCH'
          #!/usr/bin/env bash
          set -euo pipefail
          repo="$1"
          query='query($endCursor: String) {
            repository(owner: "micronizationlab", name: "glafira-ai-hub") {
              pullRequests(first: 100, after: $endCursor, states: OPEN) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  number title headRefName headRefOid baseRefOid isDraft url
                  statusCheckRollup { contexts(first: 100) { nodes {
                    __typename
                    ... on CheckRun { name status conclusion detailsUrl }
                    ... on StatusContext { context state targetUrl }
                  } } }
                }
              }
            }
          }'
          graphql_error="$RUNNER_TEMP/glafira-open-prs-graphql-error.log"
          validation_error="$RUNNER_TEMP/glafira-open-prs-graphql-validation-error.log"
          if pages="$(gh api graphql --paginate -f query="$query" 2>"$graphql_error")"; then
            if jq -s -e 'all(.[]; .data.repository.pullRequests.nodes != null)' >/dev/null 2>"$validation_error" <<< "$pages"; then
              jq -s '[
                .[].data.repository.pullRequests.nodes[] |
                {
                  number, title, headRefName, headRefOid, baseRefOid, isDraft, url,
                  statusCheckRollup: [
                    .statusCheckRollup.contexts.nodes[]? |
                    {
                      name: (.name // .context // "check"),
                      status: (.status // .state // "unknown"),
                      conclusion: (.conclusion // null),
                      detailsUrl: (.detailsUrl // .targetUrl // "")
                    }
                  ]
                }
              ]' <<< "$pages"
              exit 0
            else
              jq_status=$?
              graphql_detail="$(tail -n 3 "$validation_error" 2>/dev/null | tr '\n' ' ' | sed -E 's/(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_-]{20,}|Bearer [^ ]+)/[REDACTED]/g; s/[[:space:]]+$//')"
              printf 'UNKNOWN: GraphQL response validation failed (jq exit %s); REST offset fallback is disabled. %s\n' \
                "$jq_status" "${graphql_detail:-jq rejected the GraphQL response without stderr.}" >&2
              exit 1
            fi
          else
            gh_status=$?
            graphql_detail="$(tail -n 3 "$graphql_error" 2>/dev/null | tr '\n' ' ' | sed -E 's/(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_-]{20,}|Bearer [^ ]+)/[REDACTED]/g; s/[[:space:]]+$//')"
            printf 'UNKNOWN: GraphQL cursor-based open-PR request failed (gh exit %s); REST offset fallback is disabled. %s\n' \
              "$gh_status" "${graphql_detail:-No GraphQL stderr was captured.}" >&2
            exit 1
          fi
          FETCH
          cat > "$RUNNER_TEMP/fetch-workflow-runs.sh" <<'RUNS'
          #!/usr/bin/env bash
          set -euo pipefail
          repo="$1"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          : > "$tmp"
          # Bound each reconciliation to the newest 1,000 Actions runs.
          for page in $(seq 1 10); do
            response="$(gh api "repos/$repo/actions/runs?per_page=100&page=$page&sort=created&direction=desc")"
            count="$(jq '.workflow_runs | length' <<< "$response")"
            jq -c '.workflow_runs[]? | {
              headSha: .head_sha,
              workflowName: .name,
              displayTitle: .display_title,
              status,
              conclusion,
              createdAt: .created_at,
              url: .html_url,
              pullRequests: [(.pull_requests // [])[]? | {number, base: {sha: (.base.sha // "")}}]
            }' <<< "$response" >> "$tmp"
            if [[ "$count" -lt 100 ]]; then break; fi
          done
          jq -s '.' "$tmp"
          RUNS
          cat > "$RUNNER_TEMP/compare-pr-inventory.sh" <<'COMPARE'
          #!/usr/bin/env bash
          set -euo pipefail
          previous_file="$1"
          latest_file="$2"
          [[ "$previous_file" != "-" && -f "$previous_file" && -r "$previous_file" ]] || { echo "ERROR: previous PR snapshot must be a readable regular file." >&2; exit 2; }
          [[ "$latest_file" != "-" && -f "$latest_file" && -r "$latest_file" ]] || { echo "ERROR: latest PR snapshot must be a readable regular file." >&2; exit 2; }
          # Keep inventories in files: a full JSON snapshot must never be passed in argv.

          if GLAFIRA_FIXTURE_FORCE_PROBE_FAILURE=1 bash "$RUNNER_TEMP/test-renderer.sh" > "$RUNNER_TEMP/dispatcher-forced-failure.out" 2> "$RUNNER_TEMP/dispatcher-forced-failure.err"; then
            echo "forced renderer failure unexpectedly passed" >&2; exit 1
          else
            forced_failure_status=$?
          fi
          [[ "$forced_failure_status" -eq 37 ]]
          grep -Fq "Probe injected top-level failure returned exit 37" "$RUNNER_TEMP/dispatcher-forced-failure.err"
          grep -Fq 'Dispatcher fixture failed (exit 37): "$forced_probe_command"' "$RUNNER_TEMP/dispatcher-forced-failure.err"
          echo "dispatcher ERR trap preserves originating probe name and exit 37: PASS"
          echo "dispatcher exact-match, newest-run, metadata, Markdown, pagination, null-association and history-cap fixtures: PASS"
          TEST
          bash "$RUNNER_TEMP/test-renderer.sh"
      - name: Build cross-workstream status report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/glafira-open-prs.json" || { bash "$RUNNER_TEMP/write-dispatcher-error-summary.sh" "$GITHUB_STEP_SUMMARY" "Cannot open local PR snapshot '$RUNNER_TEMP/glafira-open-prs.json'."; exit 1; }
          if ! bash "$RUNNER_TEMP/fetch-open-prs.sh" "$GH_REPO" > "$RUNNER_TEMP/glafira-open-prs.json"; then
            bash "$RUNNER_TEMP/write-dispatcher-error-summary.sh" "$GITHUB_STEP_SUMMARY" "GraphQL cursor-based open-PR inventory is unavailable; no status is reported as passing."
            exit 1
          fi
          if ! jq -e 'type == "array"' "$RUNNER_TEMP/glafira-open-prs.json" >/dev/null; then
            bash "$RUNNER_TEMP/write-dispatcher-error-summary.sh" "$GITHUB_STEP_SUMMARY" "Open-PR snapshot is malformed or is not a JSON array."
            exit 1
          fi
          # Always reconcile before declaring the inventory empty; a new PR may have opened after the first snapshot.
          if reconciliation_result="$(bash "$RUNNER_TEMP/reconcile-pr-inventory.sh" "$RUNNER_TEMP/glafira-open-prs.json" "$RUNNER_TEMP/glafira-open-prs.latest.json" "$RUNNER_TEMP/fetch-open-prs.sh" "$RUNNER_TEMP/compare-pr-inventory.sh" "$GH_REPO")"; then
            case "$reconciliation_result" in
              UNCHANGED)
                echo "PR inventory unchanged during reconciliation; exact PR/head/base identity re-confirmed." >> "$GITHUB_STEP_SUMMARY"
                ;;
              CHANGED)
                echo "PR inventory changed during reconciliation; rendering the latest snapshot. Exact run matching remains mandatory." >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                echo "ERROR: unexpected reconciliation result '$reconciliation_result'." >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
            esac
          else
            bash "$RUNNER_TEMP/write-dispatcher-error-summary.sh" "$GITHUB_STEP_SUMMARY" "Second PR inventory fetch or exact PR/head/base comparison failed."
            exit 1
          fi
          latest_count="$(jq 'length' "$RUNNER_TEMP/glafira-open-prs.latest.json")"
          if [[ "$latest_count" -eq 0 ]]; then
            {
              echo "# GLAFIRA Project Dispatcher"
              echo ""
              echo "No open pull requests."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          runs='[]'
          if jq -e 'any(.[]; ([.statusCheckRollup[]? | select(((.name // .context // "") | contains("PR metadata edit")) | not)] | length) == 0)' "$RUNNER_TEMP/glafira-open-prs.latest.json" >/dev/null; then
            if ! runs="$(bash "$RUNNER_TEMP/fetch-workflow-runs.sh" "$GH_REPO")"; then
              bash "$RUNNER_TEMP/write-dispatcher-error-summary.sh" "$GITHUB_STEP_SUMMARY" "Actions run inventory fetch failed; no PR status is reported as passing."
              exit 1
            fi
          fi
          : > "$RUNNER_TEMP/glafira-workflow-runs.json" || { bash "$RUNNER_TEMP/write-dispatcher-error-summary.sh" "$GITHUB_STEP_SUMMARY" "Cannot open local Actions snapshot."; exit 1; }
          printf '%s\n' "$runs" > "$RUNNER_TEMP/glafira-workflow-runs.json"
          {
            echo "# GLAFIRA Project Dispatcher"
            echo ""
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "| PR | Branch | Head SHA | Latest matching CI | Draft |"
            echo "|---:|---|---|---|:---:|"
            bash "$RUNNER_TEMP/render-dispatcher-status.sh" "$RUNNER_TEMP/glafira-open-prs.latest.json" "$RUNNER_TEMP/glafira-workflow-runs.json"
            echo ""
            echo "Policy: GraphQL cursor pagination is authoritative; REST offset fallback is disabled. Fallback Actions runs require exact PR number, head SHA, and non-empty current base SHA. Skipped, cancelled, queued, partial or unknown states are not acceptance passes."
          } >> "$GITHUB_STEP_SUMMARY"
