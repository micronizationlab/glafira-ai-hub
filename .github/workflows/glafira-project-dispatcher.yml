          GH_INITIAL_FAIL
          chmod +x "$tmp/fake-bin/gh"
          if GH_REPO="micronizationlab/glafira-ai-hub" GITHUB_STEP_SUMMARY="$tmp/report-initial-failure.md" GLAFIRA_GH_BIN="$tmp/fake-bin/gh" env -u 'BASH_FUNC_gh%%' PATH="$tmp/fake-bin:$PATH" bash "$RUNNER_TEMP/build-dispatcher-status-report.sh" 2>"$tmp/report-initial-failure.err"; then
            echo "production report accepted an unavailable initial inventory" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          grep -Fq "Initial GraphQL cursor-based open-PR inventory is unavailable" "$tmp/report-initial-failure.md"
          grep -Fq "Current identity is UNKNOWN" "$tmp/report-initial-failure.md"
          if grep -Fq "| PR |" "$tmp/report-initial-failure.md"; then
            echo "PR status table appeared after initial inventory failure" >&2; exit 1
          fi

          # Exercise the actual reconciliation failure path: first inventory succeeds,
          # the second inventory request fails before a report table can be emitted.
          cat > "$tmp/fake-bin/gh" <<'GH_SECOND_FAIL'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$1" == "api" && "$2" == "graphql" && "$3" == "--paginate" ]]; then
            count="$(cat "$SCAN_COUNTER")"
            count=$((count + 1))
            printf '%s\n' "$count" > "$SCAN_COUNTER"
            if [[ "$count" -gt 1 ]]; then
              echo "injected second inventory failure" >&2
              exit 32
            fi
            cat <<'JSON'
          {"data":{"repository":{"pullRequests":{"totalCount":1,"pageInfo":{"hasNextPage":false,"endCursor":null},"nodes":[{"number":1,"title":"one","headRefName":"a","headRefOid":"head-one","baseRefOid":"base-one","isDraft":false,"url":"https://example.test/1","statusCheckRollup":{"contexts":{"nodes":[]}}}]}}}}
          JSON
            exit 0
          elif [[ "$1" == "api" && "$2" == "graphql" && "$3" == "-f" ]]; then
            printf '%s\n' '{"data":{"repository":{"pullRequests":{"totalCount":1,"nodes":[{"number":1}]}}}}'
            exit 0
          fi
          exit 99
          GH_SECOND_FAIL
          chmod +x "$tmp/fake-bin/gh"
          printf '0\n' > "$tmp/report-second-scan-count"
          if GH_REPO="micronizationlab/glafira-ai-hub" SCAN_COUNTER="$tmp/report-second-scan-count" GITHUB_STEP_SUMMARY="$tmp/report-second-failure.md" GLAFIRA_GH_BIN="$tmp/fake-bin/gh" env -u 'BASH_FUNC_gh%%' PATH="$tmp/fake-bin:$PATH" bash "$RUNNER_TEMP/build-dispatcher-status-report.sh" 2>"$tmp/report-second-failure.err"; then
            echo "production report accepted a failed second inventory fetch" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          grep -Fq "Second PR inventory fetch or exact PR/head/base comparison failed" "$tmp/report-second-failure.md"
          grep -Fq "Current identity is UNKNOWN" "$tmp/report-second-failure.md"
          grep -Fq "injected second inventory failure" "$tmp/report-second-failure.err"
          if grep -Fq "| PR |" "$tmp/report-second-failure.md"; then
            echo "PR status table appeared after reconciliation failure" >&2; exit 1
          fi

          # A successful Actions-history lookup for head-one must not be attached to
          # a PR whose head/base changed before the final post-history inventory read.
          cat > "$tmp/fake-bin/gh" <<'GH_STALE'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$1" == "api" && "$2" == "graphql" && "$3" == "--paginate" ]]; then
            count="$(cat "$SCAN_COUNTER")"
            count=$((count + 1))
            printf '%s\n' "$count" > "$SCAN_COUNTER"
            if [[ "$count" -lt 3 ]]; then head="head-one"; base="base-one"; else head="new-head-000000"; base="new-base-000000"; fi
            printf '%s\n' "{\"data\":{\"repository\":{\"pullRequests\":{\"totalCount\":1,\"pageInfo\":{\"hasNextPage\":false,\"endCursor\":null},\"nodes\":[{\"number\":1,\"title\":\"snapshot-race\",\"headRefName\":\"main\",\"headRefOid\":\"$head\",\"baseRefOid\":\"$base\",\"isDraft\":false,\"url\":\"https://example.test/1\",\"statusCheckRollup\":{\"contexts\":{\"nodes\":[]}}}]}}}}"
            exit 0
          elif [[ "$1" == "api" && "$2" == "graphql" && "$3" == "-f" ]]; then
            printf '%s\n' '{"data":{"repository":{"pullRequests":{"totalCount":1,"nodes":[{"number":1}]}}}}'
            exit 0
          elif [[ "$1" == "api" && "$2" == repos/*/actions/runs* ]]; then
            printf '%s\n' '{"workflow_runs":[{"head_sha":"head-one","name":"Android CI","display_title":"old-head-success","status":"completed","conclusion":"success","created_at":"2026-11-28T12:00:00Z","html_url":"https://example.test/run/old","pull_requests":[{"number":1,"base":{"sha":"base-one"}}]}]}'
            exit 0
          fi
          exit 99
          GH_STALE
          chmod +x "$tmp/fake-bin/gh"
          printf '0\n' > "$tmp/report-stale-scan-count"
          if ! GH_REPO="micronizationlab/glafira-ai-hub" SCAN_COUNTER="$tmp/report-stale-scan-count" GITHUB_STEP_SUMMARY="$tmp/report-stale-snapshot.md" GLAFIRA_GH_BIN="$tmp/fake-bin/gh" env -u 'BASH_FUNC_gh%%' PATH="$tmp/fake-bin:$PATH" bash "$RUNNER_TEMP/build-dispatcher-status-report.sh"; then
            echo "production report failed on a changed final PR identity" >&2; exit 1
          fi
          grep -Fq "new-head-000" "$tmp/report-stale-snapshot.md"
          grep -Fq "NO MATCHING RUN FOR EXACT PR/HEAD/BASE" "$tmp/report-stale-snapshot.md"
          if grep -Fq "old-head-success" "$tmp/report-stale-snapshot.md"; then
            echo "stale Actions run was attached to the new PR head" >&2; exit 1
          fi

          echo "dispatcher fail-closed integration: production initial-fetch and reconciliation failures return UNKNOWN with no table; post-history refresh prevents stale-head success: PASS"
          echo "dispatcher exact-match, newest-run, metadata, Markdown, pagination, null-association and history-cap fixtures: PASS"
          TEST
          bash "$RUNNER_TEMP/test-renderer.sh"
      - name: Build cross-workstream status report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/build-dispatcher-status-report.sh"
