name: GLAFIRA Project Dispatcher

on:
  push:
    branches:
      - glafira/project-dispatcher-v1
  workflow_run:
    workflows:
      - GLAFIRA CI — change-aware platform validation
      - GLAFIRA Windows Agent
      - GLAFIRA Java Format Check
      - Security Scan
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed, converted_to_draft, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  # Never let a later event replace a pending PR test or workflow-completion reconciliation.
  group: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && format('glafira-project-dispatcher-metadata-{0}', github.run_id) || github.event_name == 'pull_request' && format('glafira-project-dispatcher-pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_run' && format('glafira-project-dispatcher-workflow-run-{0}', github.event.workflow_run.id) || format('glafira-project-dispatcher-run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  project-status:
    name: Reconcile all active GLAFIRA workstreams
    # Ignore scheduled upstream scans and only formatter metadata-only completions.
    if: >-
      ${{
        (
          github.event_name != 'workflow_run' &&
          (github.event.action != 'edited' || github.event.changes.base != null)
        ) ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event != 'schedule' &&
          !(
            github.event.workflow_run.name == 'GLAFIRA Java Format Check' &&
            startsWith(github.event.workflow_run.display_title || '', 'METADATA_ONLY -')
          )
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dispatcher policy sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare and test exact-head renderer
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/render-dispatcher-status.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          prs_file="$1"
          runs_file="$2"
          prs="$(cat "$prs_file")"
          runs="$(cat "$runs_file")"
          if ! jq -e 'type == "array"' >/dev/null 2>&1 <<< "$prs"; then
            echo "pull request input must be a JSON array" >&2
            exit 2
          fi
          while IFS= read -r pr; do
            number="$(jq -r '.number' <<< "$pr")"
            # PR titles and branch names are contributor-controlled: strip Markdown syntax.
            title="$(jq -r '.title // "" | gsub("https?://[^ )]+"; "") | gsub("[|]"; "/") | gsub("[^[:alnum:] _.,:;!?-]"; " ")' <<< "$pr")"
            branch="$(jq -r '.headRefName // "" | gsub("[^[:alnum:] _.,:/-]"; " ")' <<< "$pr")"
            sha="$(jq -r '.headRefOid // ""' <<< "$pr")"
            base_sha="$(jq -r '.baseRefOid // ""' <<< "$pr")"
            draft="$(jq -r '.isDraft // false' <<< "$pr")"
            url="$(jq -r '.url // ""' <<< "$pr")"
            checks="$(jq -c '[.statusCheckRollup[]? | select(((.name // .context // "") | contains("PR metadata edit")) | not)]' <<< "$pr")"
            if [[ "$(jq 'length' <<< "$checks")" -gt 0 ]]; then
              ci="HEAD-ONLY / BASE NOT VERIFIED: $(jq -r 'map("\(.name // .context // "check"): \(.status // .state // "unknown")/\(.conclusion // "pending") ([check](\(.detailsUrl // .targetUrl // "")))") | join("<br>")' <<< "$checks")"
            elif ! jq -e 'type == "array"' >/dev/null 2>&1 <<< "$runs"; then
              ci="UNKNOWN / ACTIONS API UNAVAILABLE"
            else
              matching="$(jq -c --arg sha "$sha" --arg base "$base_sha" --argjson number "$number" '
                [.[] |
                  select(.headSha == $sha) |
                  select($base != "" and any((.pullRequests // [])[]?; .number == $number and (.base.sha // "") != "" and .base.sha == $base)) |
                  select((.workflowName // .name // "") != "GLAFIRA Java Format Check" or ((.displayTitle // "") | startswith("METADATA_ONLY -") | not))
                ] | sort_by(.createdAt // "") | reverse | group_by(.workflowName // .name // "unknown") | map(.[0])
              ' <<< "$runs")"
              if [[ "$(jq 'length' <<< "$matching")" -eq 0 ]]; then
                ci="NO MATCHING RUN FOR EXACT PR/HEAD/BASE"
              else
                ci="$(jq -r 'map((.workflowName // .name // "workflow") + ": " + (if .status == "queued" then "QUEUED" elif .status == "in_progress" then "IN_PROGRESS" elif .status == "completed" then ("COMPLETED/" + (.conclusion // "UNKNOWN")) else "UNKNOWN/" + (.status // "missing") end) + " ([run](\(.url // "")))") | join("<br>")' <<< "$matching")"
              fi
            fi
            short_sha="$(cut -c1-12 <<< "$sha")"
            echo "| [#$number]($url) $title | <code>$branch</code> | <code>$short_sha</code> | $ci | $draft |"
          done < <(jq -c '.[]' <<< "$prs")
          SCRIPT

          cat > "$RUNNER_TEMP/fetch-open-prs.sh" <<'FETCH'
          #!/usr/bin/env bash
          set -euo pipefail
          repo="$1"
          gh_retry() {
            local attempt=1 delay=2 status=0 output
            while (( attempt <= 3 )); do
              if output="$("$@")"; then
                printf '%s\n' "$output"
                return 0
              else
                status=$?
              fi
              if (( attempt == 3 )); then return "$status"; fi
              sleep "$delay"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
            return 1
          }
          query='query($endCursor: String) {
            repository(owner: "micronizationlab", name: "glafira-ai-hub") {
              pullRequests(first: 100, after: $endCursor, states: OPEN) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  number title headRefName headRefOid baseRefOid isDraft url
                  statusCheckRollup { contexts(first: 100) { nodes {
                    __typename
                    ... on CheckRun { name status conclusion detailsUrl }
                    ... on StatusContext { context state targetUrl }
                  } } }
                }
              }
            }
          }'
          if pages="$(gh_retry gh api graphql --paginate -f query="$query" 2>/dev/null)" && jq -s -e 'length > 0 and all(.[]; (.data.repository.pullRequests.nodes | type) == "array")' >/dev/null <<< "$pages"; then
            jq -s '[
              .[].data.repository.pullRequests.nodes[] |
              {
                number, title, headRefName, headRefOid, baseRefOid, isDraft, url,
                statusCheckRollup: [
                  .statusCheckRollup.contexts.nodes[]? |
                  {
                    name: (.name // .context // "check"),
                    status: (.status // .state // "unknown"),
                    conclusion: (.conclusion // null),
                    detailsUrl: (.detailsUrl // .targetUrl // "")
                  }
                ]
              }
            ]' <<< "$pages"
            exit 0
          fi
          # REST fallback retains exact head/base identity and paginates all open PRs.
          rest_pages="$(gh_retry gh api --paginate "repos/$repo/pulls?state=open&per_page=100")"
          jq -s '[
            add[] |
            {
              number, title,
              headRefName: .head.ref,
              headRefOid: .head.sha,
              baseRefOid: .base.sha,
              isDraft: .draft,
              url: .html_url,
              statusCheckRollup: []
            }
          ]' <<< "$rest_pages"
          FETCH
          cat > "$RUNNER_TEMP/fetch-workflow-runs.sh" <<'RUNS'
          #!/usr/bin/env bash
          set -euo pipefail
          repo="$1"
          gh_retry() {
            local attempt=1 delay=2 status=0 output
            while (( attempt <= 3 )); do
              if output="$("$@")"; then
                printf '%s\n' "$output"
                return 0
              else
                status=$?
              fi
              if (( attempt == 3 )); then return "$status"; fi
              sleep "$delay"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
            return 1
          }
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          : > "$tmp"
          # Bound each reconciliation to the newest 1,000 Actions runs.
          for page in $(seq 1 10); do
            response="$(gh_retry gh api "repos/$repo/actions/runs?per_page=100&page=$page&sort=created&direction=desc")"
            count="$(jq '.workflow_runs | length' <<< "$response")"
            jq -c '.workflow_runs[]? | {
              headSha: .head_sha,
              workflowName: .name,
              displayTitle: .display_title,
              status,
              conclusion,
              createdAt: .created_at,
              url: .html_url,
              pullRequests: [(.pull_requests // [])[]? | {number, base: {sha: (.base.sha // "")}}]
            }' <<< "$response" >> "$tmp"
            if [[ "$count" -lt 100 ]]; then break; fi
          done
          jq -s '.' "$tmp"
          RUNS
          cat > "$RUNNER_TEMP/compare-pr-inventory.sh" <<'COMPARE'
          #!/usr/bin/env bash
          set -euo pipefail
          previous_file="$1"
          latest_file="$2"
          # Keep large inventories in files; --argjson would exceed the OS argv limit.
          set +e
          jq -e -s --slurpfile latest "$latest_file" '
            if length != 1 or (.[0] | type) != "array" or ($latest | length) != 1 or ($latest[0] | type) != "array" then
              error("each inventory file must contain exactly one JSON array")
            else
              .[0] as $previous
              | $latest[0] as $current
              | if (
                  ([$previous[].number] | unique | length) != ($previous | length)
                  or ([$current[].number] | unique | length) != ($current | length)
                  or any($previous[]; (.number | type) != "number" or (.headRefOid | type) != "string" or .headRefOid == "" or (.baseRefOid | type) != "string" or .baseRefOid == "")
                  or any($current[]; (.number | type) != "number" or (.headRefOid | type) != "string" or .headRefOid == "" or (.baseRefOid | type) != "string" or .baseRefOid == "")
                ) then
                  error("inventory contains duplicate PR numbers or incomplete PR identity")
                else
                  ($current | reduce .[] as $pr ({}; .[($pr.number | tostring)] = $pr)) as $latest_by_number
                  | ($previous | length) == ($current | length)
                    and all($previous[]; . as $old |
                      ($latest_by_number[($old.number | tostring)] // null) as $new |
                      $new != null
                      and $new.headRefOid == $old.headRefOid
                      and $new.baseRefOid == $old.baseRefOid
                    )
                end
            end
          ' "$previous_file" >/dev/null
          status=$?
          set -e
          case "$status" in
            0) exit 0 ;; # inventories match
            1) exit 1 ;; # valid inventory delta
            *) echo "ERROR: PR inventory comparison failed (jq exit $status)." >&2; exit 2 ;;
          esac
          COMPARE
          cat > "$RUNNER_TEMP/reconcile-pr-inventory.sh" <<'RECONCILE'
          #!/usr/bin/env bash
          set -euo pipefail
          repo="$1"
          previous_file="$2"
          latest_file="$3"
          fetch_script="$4"
          compare_script="$5"
          if ! latest_prs="$(bash "$fetch_script" "$repo")"; then
            echo "ERROR: current PR inventory fetch failed." >&2
            exit 2
          fi
          printf '%s\n' "$latest_prs" > "$latest_file"
          if bash "$compare_script" "$previous_file" "$latest_file"; then
            echo "UNCHANGED"
          else
            status=$?
            if [[ "$status" -eq 1 ]]; then
              echo "CHANGED"
            else
              echo "ERROR: inventory comparison failed (exit $status)." >&2
              exit 2
            fi
          fi
          RECONCILE
          cat > "$RUNNER_TEMP/test-renderer.sh" <<'TEST'
          #!/usr/bin/env bash
          set -euo pipefail
          renderer="$RUNNER_TEMP/render-dispatcher-status.sh"
          fetch_prs="$RUNNER_TEMP/fetch-open-prs.sh"
          fetch_runs="$RUNNER_TEMP/fetch-workflow-runs.sh"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/prs.json" <<'JSON'
          [
            {"number":553,"title":"current [link](https://evil.test) | title","headRefName":"docs/reconcile","headRefOid":"sha-current","baseRefOid":"base-current","isDraft":false,"url":"https://example.test/pr/553","statusCheckRollup":[]},
            {"number":554,"title":"stale only","headRefName":"feature/stale","headRefOid":"sha-new","baseRefOid":"base-new","isDraft":true,"url":"https://example.test/pr/554","statusCheckRollup":[]},
            {"number":555,"title":"rollup preferred","headRefName":"feature/rollup","headRefOid":"sha-rollup","baseRefOid":"base-rollup","isDraft":false,"url":"https://example.test/pr/555","statusCheckRollup":[{"name":"required","status":"COMPLETED","conclusion":"SUCCESS","detailsUrl":"https://example.test/check"}]},
            {"number":556,"title":"queued exact head","headRefName":"feature/queued","headRefOid":"sha-queued","baseRefOid":"base-queued","isDraft":false,"url":"https://example.test/pr/556","statusCheckRollup":[]},
            {"number":557,"title":"skipped exact head","headRefName":"feature/skipped","headRefOid":"sha-skipped","baseRefOid":"base-skipped","isDraft":false,"url":"https://example.test/pr/557","statusCheckRollup":[]},
            {"number":558,"title":"in progress exact head","headRefName":"feature/in-progress","headRefOid":"sha-progress","baseRefOid":"base-progress","isDraft":false,"url":"https://example.test/pr/558","statusCheckRollup":[]},
            {"number":559,"title":"cancelled exact head","headRefName":"feature/cancelled","headRefOid":"sha-cancelled","baseRefOid":"base-cancelled","isDraft":false,"url":"https://example.test/pr/559","statusCheckRollup":[]},
            {"number":560,"title":"failed exact head","headRefName":"feature/failed","headRefOid":"sha-failed","baseRefOid":"base-failed","isDraft":false,"url":"https://example.test/pr/560","statusCheckRollup":[]},
            {"number":562,"title":"metadata run must not hide validation","headRefName":"feature/metadata","headRefOid":"sha-meta","baseRefOid":"base-meta-562","isDraft":false,"url":"https://example.test/pr/562","statusCheckRollup":[]},
            {"number":563,"title":"same head different base","headRefName":"feature/other-base","headRefOid":"sha-meta","baseRefOid":"base-meta-563","isDraft":false,"url":"https://example.test/pr/563","statusCheckRollup":[]},
            {"number":564,"title":"same head and base different PR","headRefName":"feature/other-pr","headRefOid":"sha-meta","baseRefOid":"base-meta-562","isDraft":false,"url":"https://example.test/pr/564","statusCheckRollup":[]},
            {"number":565,"title":"metadata-looking commit title","headRefName":"feature/title","headRefOid":"sha-title","baseRefOid":"base-title","isDraft":false,"url":"https://example.test/pr/565","statusCheckRollup":[]},
            {"number":566,"title":"metadata rollup falls back","headRefName":"feature/metadata-rollup","headRefOid":"sha-meta-rollup","baseRefOid":"base-meta-rollup","isDraft":false,"url":"https://example.test/pr/566","statusCheckRollup":[{"name":"PR metadata edit — formatter not run","status":"COMPLETED","conclusion":"SKIPPED","detailsUrl":"https://example.test/metadata"}]}
          ]
          JSON
          cat > "$tmp/runs.json" <<'JSON'
          [
            {"headSha":"sha-current","workflowName":"Android CI","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:00:00Z","url":"https://example.test/run/android-new","pullRequests":[{"number":553,"base":{"sha":"base-current"}}]},
            {"headSha":"sha-current","workflowName":"Android CI","status":"completed","conclusion":"failure","createdAt":"2026-11-24T11:00:00Z","url":"https://example.test/run/android-old","pullRequests":[{"number":553,"base":{"sha":"base-current"}}]},
            {"headSha":"sha-current","workflowName":"Android CI","status":"completed","conclusion":"success","createdAt":"2026-11-24T13:00:00Z","url":"https://example.test/run/wrong-base","pullRequests":[{"number":553,"base":{"sha":"other-base"}}]},
            {"headSha":"sha-current","workflowName":"Android CI","status":"completed","conclusion":"failure","createdAt":"2026-11-24T14:00:00Z","url":"https://example.test/run/wrong-pr","pullRequests":[{"number":564,"base":{"sha":"base-current"}}]},
            {"headSha":"sha-other","workflowName":"Android CI","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:02:00Z","url":"https://example.test/run/stale","pullRequests":[{"number":553,"base":{"sha":"base-current"}}]},
            {"headSha":"sha-queued","workflowName":"Desktop CI","status":"queued","conclusion":null,"createdAt":"2026-11-24T12:03:00Z","url":"https://example.test/run/queued","pullRequests":[{"number":556,"base":{"sha":"base-queued"}}]},
            {"headSha":"sha-skipped","workflowName":"iOS CI","status":"completed","conclusion":"skipped","createdAt":"2026-11-24T12:04:00Z","url":"https://example.test/run/skipped","pullRequests":[{"number":557,"base":{"sha":"base-skipped"}}]},
            {"headSha":"sha-progress","workflowName":"Desktop CI","status":"in_progress","conclusion":null,"createdAt":"2026-11-24T12:05:00Z","url":"https://example.test/run/progress","pullRequests":[{"number":558,"base":{"sha":"base-progress"}}]},
            {"headSha":"sha-cancelled","workflowName":"Windows CI","status":"completed","conclusion":"cancelled","createdAt":"2026-11-24T12:06:00Z","url":"https://example.test/run/cancelled","pullRequests":[{"number":559,"base":{"sha":"base-cancelled"}}]},
            {"headSha":"sha-failed","workflowName":"Agent CI","status":"completed","conclusion":"failure","createdAt":"2026-11-24T12:07:00Z","url":"https://example.test/run/failed","pullRequests":[{"number":560,"base":{"sha":"base-failed"}}]},
            {"headSha":"sha-meta","workflowName":"GLAFIRA Java Format Check","displayTitle":"VALIDATION - Java format","status":"completed","conclusion":"failure","createdAt":"2026-11-24T12:07:00Z","url":"https://example.test/run/format-failed","pullRequests":[{"number":562,"base":{"sha":"base-meta-562"}}]},
            {"headSha":"sha-meta","workflowName":"GLAFIRA Java Format Check","displayTitle":"METADATA_ONLY - PR metadata edit","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:08:00Z","url":"https://example.test/run/metadata-skipped","pullRequests":[{"number":562,"base":{"sha":"base-meta-562"}}]},
            {"headSha":"sha-meta","workflowName":"Security Scan","displayTitle":"METADATA_ONLY - commit subject","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:09:00Z","url":"https://example.test/run/security-valid","pullRequests":[{"number":562,"base":{"sha":"base-meta-562"}}]},
            {"headSha":"sha-title","workflowName":"Security Scan","displayTitle":"METADATA_ONLY - ordinary commit title","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:10:00Z","url":"https://example.test/run/title-valid","pullRequests":[{"number":565,"base":{"sha":"base-title"}}]},
            {"headSha":"sha-meta-rollup","workflowName":"GLAFIRA Java Format Check","displayTitle":"VALIDATION - Java format","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:11:00Z","url":"https://example.test/run/format-rollup-fallback","pullRequests":[{"number":566,"base":{"sha":"base-meta-rollup"}}]},
            {"headSha":"sha-unassociated","workflowName":"No PR association","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:12:00Z","url":"https://example.test/run/no-pr","pullRequests":[]}
          ]
          JSON
          output="$(bash "$renderer" "$tmp/prs.json" "$tmp/runs.json")"
          row553="$(grep -F '| [#553]' <<< "$output")"
          [[ "$row553" == *'Android CI: COMPLETED/success ([run](https://example.test/run/android-new))'* && "$row553" != *'android-old'* && "$row553" != *'wrong-base'* ]]
          grep -q 'NO MATCHING RUN FOR EXACT PR/HEAD/BASE' <<< "$(grep -F '| [#554]' <<< "$output")"
          grep -q 'HEAD-ONLY / BASE NOT VERIFIED: required: COMPLETED/SUCCESS' <<< "$(grep -F '| [#555]' <<< "$output")"
          grep -q 'Desktop CI: QUEUED' <<< "$(grep -F '| [#556]' <<< "$output")"
          grep -q 'iOS CI: COMPLETED/skipped' <<< "$(grep -F '| [#557]' <<< "$output")"
          grep -q 'Desktop CI: IN_PROGRESS' <<< "$(grep -F '| [#558]' <<< "$output")"
          grep -q 'Windows CI: COMPLETED/cancelled' <<< "$(grep -F '| [#559]' <<< "$output")"
          grep -q 'Agent CI: COMPLETED/failure' <<< "$(grep -F '| [#560]' <<< "$output")"
          row562="$(grep -F '| [#562]' <<< "$output")"
          grep -q 'GLAFIRA Java Format Check: COMPLETED/failure' <<< "$row562"
          grep -q 'Security Scan: COMPLETED/success' <<< "$row562"
          ! grep -q 'metadata-skipped' <<< "$row562"
          grep -q 'NO MATCHING RUN FOR EXACT PR/HEAD/BASE' <<< "$(grep -F '| [#563]' <<< "$output")"
          grep -q 'NO MATCHING RUN FOR EXACT PR/HEAD/BASE' <<< "$(grep -F '| [#564]' <<< "$output")"
          row565="$(grep -F '| [#565]' <<< "$output")"
          grep -q 'Security Scan: COMPLETED/success' <<< "$row565"
          grep -q 'GLAFIRA Java Format Check: COMPLETED/success' <<< "$(grep -F '| [#566]' <<< "$output")"
          ! grep -q 'evil.test' <<< "$output"
          ! grep -q '\[link\]' <<< "$output"

          mkdir -p "$tmp/fake-bin"
          # GraphQL pagination preserves base SHA and check-rollup data.
          cat > "$tmp/fake-bin/gh" <<'GH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$1" == "api" && "$2" == "graphql" ]]; then
            cat <<'JSON'
          {"data":{"repository":{"pullRequests":{"nodes":[{"number":1,"title":"one","headRefName":"a","headRefOid":"h1","baseRefOid":"b1","isDraft":false,"url":"https://example.test/1","statusCheckRollup":{"contexts":{"nodes":[{"__typename":"CheckRun","name":"Android CI","status":"COMPLETED","conclusion":"SUCCESS","detailsUrl":"https://example.test/check"}]}}}]}}}}
          {"data":{"repository":{"pullRequests":{"nodes":[{"number":2,"title":"two","headRefName":"b","headRefOid":"h2","baseRefOid":"b2","isDraft":true,"url":"https://example.test/2","statusCheckRollup":{"contexts":{"nodes":[]}}}]}}}}
          JSON
            exit 0
          fi
          exit 2
          GH
          chmod +x "$tmp/fake-bin/gh"
          gql_prs="$(PATH="$tmp/fake-bin:$PATH" bash "$fetch_prs" micronizationlab/glafira-ai-hub)"
          jq -e 'length == 2 and .[0].baseRefOid == "b1" and .[0].statusCheckRollup[0].name == "Android CI" and .[1].number == 2' <<< "$gql_prs" >/dev/null

          # A transient GraphQL failure is retried before falling back to REST.
          cat > "$tmp/fake-bin/gh" <<'GH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$1" == "api" && "$2" == "graphql" ]]; then
            if [[ ! -f "$FAKE_GH_FAIL_ONCE" ]]; then touch "$FAKE_GH_FAIL_ONCE"; exit 1; fi
            printf '%s\n' '{"data":{"repository":{"pullRequests":{"nodes":[{"number":3,"title":"retry","headRefName":"r","headRefOid":"hr","baseRefOid":"br","isDraft":false,"url":"https://example.test/3","statusCheckRollup":{"contexts":{"nodes":[]}}}]}}}}'
            exit 0
          fi
          exit 2
          GH
          chmod +x "$tmp/fake-bin/gh"
          retried_prs="$(PATH="$tmp/fake-bin:$PATH" FAKE_GH_FAIL_ONCE="$tmp/gh-fail-once" bash "$fetch_prs" micronizationlab/glafira-ai-hub)"
          jq -e 'length == 1 and .[0].number == 3' <<< "$retried_prs" >/dev/null
          [[ -f "$tmp/gh-fail-once" ]]

          # REST fallback also paginates the open PR inventory.
          cat > "$tmp/fake-bin/gh" <<'GH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$1" == "api" && "$2" == "graphql" ]]; then exit 1; fi
          if [[ "$1" == "api" && "$2" == "--paginate" ]]; then
            printf '%s\n' '[{"number":1,"title":"one","head":{"ref":"a","sha":"h1"},"base":{"sha":"b1"},"draft":false,"html_url":"https://example.test/1"}]'
            printf '%s\n' '[{"number":2,"title":"two","head":{"ref":"b","sha":"h2"},"base":{"sha":"b2"},"draft":true,"html_url":"https://example.test/2"}]'
            exit 0
          fi
          exit 2
          GH
          chmod +x "$tmp/fake-bin/gh"
          rest_prs="$(PATH="$tmp/fake-bin:$PATH" bash "$fetch_prs" micronizationlab/glafira-ai-hub)"
          jq -e 'length == 2 and .[1].baseRefOid == "b2" and .[1].statusCheckRollup == []' <<< "$rest_prs" >/dev/null

          # Actions run inventory retries a transient API error.
          cat > "$tmp/fake-bin/gh" <<'GH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$1" == "api" && "$2" == repos/*/actions/runs* ]]; then
            if [[ ! -f "$FAKE_GH_FAIL_ONCE" ]]; then touch "$FAKE_GH_FAIL_ONCE"; exit 1; fi
            printf '%s\n' '{"workflow_runs":[]}'
            exit 0
          fi
          exit 2
          GH
          chmod +x "$tmp/fake-bin/gh"
          retried_runs="$(PATH="$tmp/fake-bin:$PATH" FAKE_GH_FAIL_ONCE="$tmp/runs-fail-once" bash "$fetch_runs" micronizationlab/glafira-ai-hub)"
          jq -e 'length == 0' <<< "$retried_runs" >/dev/null
          [[ -f "$tmp/runs-fail-once" ]]

          # The run inventory is capped at ten pages. Exercise the exact production
          # jq projection against both an associated run and a null pull_requests run.
          grep -Fq 'for page in $(seq 1 10)' "$fetch_runs"
          grep -Fq 'pullRequests: [(.pull_requests // [])[]?' "$fetch_runs"
          cat > "$tmp/raw-workflow-runs.json" <<'JSON'
          {"workflow_runs":[
            {"head_sha":"head-one","name":"CI","display_title":"METADATA_ONLY - sample title","status":"completed","conclusion":"success","created_at":"2026-11-24T12:00:00Z","html_url":"https://example.test/run/one","pull_requests":[{"number":999,"base":{"sha":"base-999"}}]},
            {"head_sha":"head-two","name":"CI","display_title":"ordinary title","status":"completed","conclusion":"success","created_at":"2026-11-24T12:00:00Z","html_url":"https://example.test/run/two","pull_requests":null}
          ]}
          JSON
          projected="$(jq -c '.workflow_runs[]? | {
            headSha: .head_sha,
            workflowName: .name,
            displayTitle: .display_title,
            status,
            conclusion,
            createdAt: .created_at,
            url: .html_url,
            pullRequests: [(.pull_requests // [])[]? | {number, base: {sha: (.base.sha // "")}}]
          }' "$tmp/raw-workflow-runs.json")"
          projected_array="$(jq -s '.' <<< "$projected")"
          jq -e 'length == 2 and .[0].pullRequests[0].number == 999 and .[0].pullRequests[0].base.sha == "base-999" and .[0].displayTitle == "METADATA_ONLY - sample title" and .[1].pullRequests == []' <<< "$projected_array" >/dev/null
          echo "dispatcher exact-match, newest-run, metadata, Markdown, pagination, null-association and history-cap fixtures: PASS"
          TEST
          bash "$RUNNER_TEMP/test-renderer.sh"
          # Exercise inventory comparison with a payload larger than the OS argv limit.
          jq -n '[range(0; 5000) | {number: ., headRefOid: "head", baseRefOid: "base"}]' > "$RUNNER_TEMP/large-pr-inventory.json"
          cp "$RUNNER_TEMP/large-pr-inventory.json" "$RUNNER_TEMP/large-pr-inventory-latest.json"
          bash "$RUNNER_TEMP/compare-pr-inventory.sh" "$RUNNER_TEMP/large-pr-inventory.json" "$RUNNER_TEMP/large-pr-inventory-latest.json"
          jq '.[4999].headRefOid = "changed"' "$RUNNER_TEMP/large-pr-inventory.json" > "$RUNNER_TEMP/large-pr-inventory-delta.json"
          if bash "$RUNNER_TEMP/compare-pr-inventory.sh" "$RUNNER_TEMP/large-pr-inventory.json" "$RUNNER_TEMP/large-pr-inventory-delta.json"; then
            echo "inventory delta was incorrectly reported as identical" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          jq '. + [{number: 5001, headRefOid: "new", baseRefOid: "base"}]' "$RUNNER_TEMP/large-pr-inventory.json" > "$RUNNER_TEMP/large-pr-inventory-added.json"
          if bash "$RUNNER_TEMP/compare-pr-inventory.sh" "$RUNNER_TEMP/large-pr-inventory.json" "$RUNNER_TEMP/large-pr-inventory-added.json"; then
            echo "new PR was incorrectly ignored as an inventory change" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          jq '.[0:4999]' "$RUNNER_TEMP/large-pr-inventory.json" > "$RUNNER_TEMP/large-pr-inventory-removed.json"
          if bash "$RUNNER_TEMP/compare-pr-inventory.sh" "$RUNNER_TEMP/large-pr-inventory.json" "$RUNNER_TEMP/large-pr-inventory-removed.json"; then
            echo "removed PR was incorrectly ignored as an inventory change" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          jq '.[0].baseRefOid = ""' "$RUNNER_TEMP/large-pr-inventory.json" > "$RUNNER_TEMP/large-pr-inventory-empty-base.json"
          if bash "$RUNNER_TEMP/compare-pr-inventory.sh" "$RUNNER_TEMP/large-pr-inventory.json" "$RUNNER_TEMP/large-pr-inventory-empty-base.json"; then
            echo "empty base SHA was incorrectly accepted as an exact identity" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          jq '.[4999].baseRefOid = "changed-base"' "$RUNNER_TEMP/large-pr-inventory.json" > "$RUNNER_TEMP/large-pr-inventory-base-delta.json"
          if bash "$RUNNER_TEMP/compare-pr-inventory.sh" "$RUNNER_TEMP/large-pr-inventory.json" "$RUNNER_TEMP/large-pr-inventory-base-delta.json"; then
            echo "changed base SHA was incorrectly ignored" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          printf '{invalid json' > "$RUNNER_TEMP/invalid-pr-inventory.json"
          if bash "$RUNNER_TEMP/compare-pr-inventory.sh" "$RUNNER_TEMP/large-pr-inventory.json" "$RUNNER_TEMP/invalid-pr-inventory.json"; then
            echo "invalid JSON was incorrectly accepted" >&2; exit 1
          else
            [[ "$?" -eq 2 ]]
          fi
          mkdir -p "$RUNNER_TEMP/failing-jq-bin"
          cat > "$RUNNER_TEMP/failing-jq-bin/jq" <<'JQ'
          #!/usr/bin/env bash
          exit 42
          JQ
          chmod +x "$RUNNER_TEMP/failing-jq-bin/jq"
          if PATH="$RUNNER_TEMP/failing-jq-bin:$PATH" bash "$RUNNER_TEMP/compare-pr-inventory.sh" "$RUNNER_TEMP/large-pr-inventory.json" "$RUNNER_TEMP/large-pr-inventory-latest.json"; then
            echo "jq invocation failure was incorrectly accepted" >&2; exit 1
          else
            [[ "$?" -eq 2 ]]
          fi
          # Exercise the same fetch+compare path used by the production report step.
          cat > "$RUNNER_TEMP/fetch-mocked-prs.sh" <<'FETCH'
          #!/usr/bin/env bash
          set -euo pipefail
          jq '.[4999].headRefOid = "changed"' "$FAKE_INVENTORY_SOURCE"
          FETCH
          chmod +x "$RUNNER_TEMP/fetch-mocked-prs.sh"
          report_status="$(FAKE_INVENTORY_SOURCE="$RUNNER_TEMP/large-pr-inventory.json" bash "$RUNNER_TEMP/reconcile-pr-inventory.sh" test/repo "$RUNNER_TEMP/large-pr-inventory.json" "$RUNNER_TEMP/report-latest-prs.json" "$RUNNER_TEMP/fetch-mocked-prs.sh" "$RUNNER_TEMP/compare-pr-inventory.sh")"
          [[ "$report_status" == "CHANGED" ]]
          jq -e '.[4999].headRefOid == "changed"' "$RUNNER_TEMP/report-latest-prs.json" >/dev/null
          cat > "$RUNNER_TEMP/fetch-invalid-prs.sh" <<'FETCH'
          #!/usr/bin/env bash
          printf '{invalid json'
          FETCH
          chmod +x "$RUNNER_TEMP/fetch-invalid-prs.sh"
          if bash "$RUNNER_TEMP/reconcile-pr-inventory.sh" test/repo "$RUNNER_TEMP/large-pr-inventory.json" "$RUNNER_TEMP/report-invalid-prs.json" "$RUNNER_TEMP/fetch-invalid-prs.sh" "$RUNNER_TEMP/compare-pr-inventory.sh"; then
            echo "production reconciliation accepted invalid JSON" >&2; exit 1
          else
            [[ "$?" -eq 2 ]]
          fi
          cat > "$RUNNER_TEMP/fetch-failing-prs.sh" <<'FETCH'
          #!/usr/bin/env bash
          exit 42
          FETCH
          chmod +x "$RUNNER_TEMP/fetch-failing-prs.sh"
          if bash "$RUNNER_TEMP/reconcile-pr-inventory.sh" test/repo "$RUNNER_TEMP/large-pr-inventory.json" "$RUNNER_TEMP/report-failed-fetch.json" "$RUNNER_TEMP/fetch-failing-prs.sh" "$RUNNER_TEMP/compare-pr-inventory.sh"; then
            echo "production reconciliation accepted a failed fetch" >&2; exit 1
          else
            [[ "$?" -eq 2 ]]
          fi
      - name: Verify actual dispatcher and CodeRabbit policy
        shell: bash
        run: |
          set -euo pipefail
          ruby - <<'RUBY'
          require "yaml"
          workflow = YAML.load_file(".github/workflows/glafira-project-dispatcher.yml")
          events = workflow["on"] || workflow[true]
          abort "dispatcher must not restore periodic schedule" if events.is_a?(Hash) && events.key?("schedule")
          pull_request_types = events.fetch("pull_request").fetch("types")
          required_pr_types = %w[opened synchronize reopened ready_for_review closed converted_to_draft edited]
          abort "dispatcher PR lifecycle triggers are incomplete" unless (required_pr_types - pull_request_types).empty?
          workflow_run = events.fetch("workflow_run")
          required_workflows = ["GLAFIRA CI — change-aware platform validation", "GLAFIRA Windows Agent", "GLAFIRA Java Format Check", "Security Scan"]
          abort "dispatcher workflow completion subscriptions are incomplete" unless (required_workflows - workflow_run.fetch("workflows")).empty?
          guard = workflow.dig("jobs", "project-status", "if").to_s
          abort "job guard must scope metadata-only skip to Java formatter" unless guard.include?("workflow_run.name == 'GLAFIRA Java Format Check'") && guard.include?("workflow_run.event != 'schedule'") && guard.include?("METADATA_ONLY -")
          abort "job guard must skip title/body edits but preserve base retargets" unless guard.include?("github.event.changes.base != null")
          concurrency_group = workflow.dig("concurrency", "group").to_s
          abort "metadata-only edits need a unique concurrency group" unless concurrency_group.include?("metadata-") && concurrency_group.include?("github.run_id")
          config = YAML.load_file(".coderabbit.yaml")
          auto_review = config.dig("reviews", "auto_review") || {}
          chat = config["chat"] || {}
          abort "initial CodeRabbit PR review must remain enabled" unless auto_review["enabled"] == true
          abort "incremental CodeRabbit reviews must remain disabled" unless auto_review["auto_incremental_review"] == false
          abort "CodeRabbit auto replies must remain disabled" unless chat["auto_reply"] == false
          puts "actual workflow triggers, job guard, no-schedule policy and CodeRabbit YAML: PASS"
          RUBY
          should_reconcile() {
            local event_name="$1" action="$2" base_changed="$3" upstream_event="$4" workflow_name="$5" display_title="$6"
            if [[ "$event_name" == "pull_request" && "$action" == "edited" && "$base_changed" != "true" ]]; then return 1; fi
            if [[ "$event_name" == "workflow_run" ]]; then
              [[ "$upstream_event" != "schedule" ]] || return 1
              if [[ "$workflow_name" == "GLAFIRA Java Format Check" && "$display_title" == "METADATA_ONLY -"* ]]; then return 1; fi
            fi
            return 0
          }
          if should_reconcile "workflow_run" "completed" "false" "schedule" "GLAFIRA CI — change-aware platform validation" "daily run"; then
            echo "scheduled workflow_run must be ignored" >&2; exit 1
          fi
          if should_reconcile "workflow_run" "completed" "false" "pull_request" "GLAFIRA Java Format Check" "METADATA_ONLY - PR metadata edit"; then
            echo "formatter metadata-only workflow_run must be ignored" >&2; exit 1
          fi
          if should_reconcile "pull_request" "edited" "false" "" "" ""; then
            echo "title/body-only PR edit must not start reconciliation" >&2; exit 1
          fi
          should_reconcile "pull_request" "edited" "true" "" "" ""
          should_reconcile "pull_request" "synchronize" "false" "" "" ""
          should_reconcile "workflow_run" "completed" "false" "pull_request" "GLAFIRA CI — change-aware platform validation" "METADATA_ONLY - title collision"
          should_reconcile "workflow_run" "completed" "false" "pull_request" "Security Scan" "ordinary title"
          echo "event-driven dispatcher policy fixtures: PASS"
      - name: Build cross-workstream status report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if ! prs="$(bash "$RUNNER_TEMP/fetch-open-prs.sh" "$GH_REPO")"; then
            {
              echo "# GLAFIRA Project Dispatcher"
              echo ""
              echo "ERROR: GraphQL and REST open-PR inventory are unavailable; no status is reported as passing."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          count="$(jq 'length' <<< "$prs")"
          if [[ "$count" -eq 0 ]]; then
            {
              echo "# GLAFIRA Project Dispatcher"
              echo ""
              echo "No open pull requests."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s\n' "$prs" > "$RUNNER_TEMP/glafira-open-prs.json"
          runs='[]'
          if jq -e 'any(.[]; ([.statusCheckRollup[]? | select(((.name // .context // "") | contains("PR metadata edit")) | not)] | length) == 0)' >/dev/null <<< "$prs"; then
            if runs="$(bash "$RUNNER_TEMP/fetch-workflow-runs.sh" "$GH_REPO")"; then
              :
            else
              echo "ERROR: Actions run inventory unavailable; fallback CI evidence is UNKNOWN." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
          printf '%s\n' "$runs" > "$RUNNER_TEMP/glafira-workflow-runs.json"
          # Re-read PR refs through the same tested fetch+compare path used by fixtures.
          if reconciliation_status="$(bash "$RUNNER_TEMP/reconcile-pr-inventory.sh" "$GH_REPO" "$RUNNER_TEMP/glafira-open-prs.json" "$RUNNER_TEMP/glafira-open-prs.latest-check.json" "$RUNNER_TEMP/fetch-open-prs.sh" "$RUNNER_TEMP/compare-pr-inventory.sh")"; then
            if [[ "$reconciliation_status" == "CHANGED" ]]; then
              echo "PR inventory changed during reconciliation; report uses the latest refs and exact matching." >> "$GITHUB_STEP_SUMMARY"
            fi
            prs="$(cat "$RUNNER_TEMP/glafira-open-prs.latest-check.json")"
          else
            echo "ERROR: PR inventory could not be re-verified; dispatcher status is UNKNOWN." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf '%s\n' "$prs" > "$RUNNER_TEMP/glafira-open-prs.latest.json"
          {
            echo "# GLAFIRA Project Dispatcher"
            echo ""
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "| PR | Branch | Head SHA | Latest matching CI | Draft |"
            echo "|---:|---|---|---|:---:|"
            bash "$RUNNER_TEMP/render-dispatcher-status.sh" "$RUNNER_TEMP/glafira-open-prs.latest.json" "$RUNNER_TEMP/glafira-workflow-runs.json"
            echo ""
            echo "Policy: fallback Actions runs require exact PR number, head SHA, and non-empty current base SHA. Formatter metadata-only runs are excluded only for the Java formatter workflow. Rollup checks are head-associated and labelled base-unverified. Workflow history is capped at 1,000 recent runs and fetched only when fallback is needed. No matching evidence is UNKNOWN/not a pass; skipped, cancelled, queued, partial or unknown states are not acceptance passes."
          } >> "$GITHUB_STEP_SUMMARY"
