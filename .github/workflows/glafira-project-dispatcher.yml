name: GLAFIRA Project Dispatcher

on:
  push:
    branches:
      - glafira/project-dispatcher-v1
  workflow_run:
    workflows:
      - GLAFIRA CI — change-aware platform validation
      - GLAFIRA Windows Agent
      - GLAFIRA Java Format Check
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  # Never let a later event replace a pending PR test or workflow-completion reconciliation.
  group: ${{ github.event_name == 'pull_request' && format('glafira-project-dispatcher-pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_run' && format('glafira-project-dispatcher-workflow-run-{0}', github.event.workflow_run.id) || format('glafira-project-dispatcher-run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  project-status:
    name: Reconcile all active GLAFIRA workstreams
    runs-on: ubuntu-latest
    steps:
      - name: Prepare and test exact-head renderer
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/render-dispatcher-status.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          prs_file="$1"
          runs_file="$2"
          prs="$(cat "$prs_file")"
          runs="$(cat "$runs_file")"
          if ! jq -e 'type == "array"' >/dev/null 2>&1 <<< "$prs"; then
            echo "pull request input must be a JSON array" >&2
            exit 2
          fi
          while IFS= read -r pr; do
            number="$(jq -r '.number' <<< "$pr")"
            # PR titles and branch names are contributor-controlled: strip Markdown syntax.
            title="$(jq -r '.title // "" | gsub("https?://[^ )]+"; "") | gsub("[|]"; "/") | gsub("[^[:alnum:] _.,:;!?-]"; " ")' <<< "$pr")"
            branch="$(jq -r '.headRefName // "" | gsub("[^[:alnum:] _.,:/-]"; " ")' <<< "$pr")"
            sha="$(jq -r '.headRefOid // ""' <<< "$pr")"
            base_sha="$(jq -r '.baseRefOid // ""' <<< "$pr")"
            draft="$(jq -r '.isDraft // false' <<< "$pr")"
            url="$(jq -r '.url // ""' <<< "$pr")"
            checks="$(jq -c '[.statusCheckRollup[]? | select(((.name // .context // "") | contains("PR metadata edit")) | not)]' <<< "$pr")"
            if [[ "$(jq 'length' <<< "$checks")" -gt 0 ]]; then
              ci="HEAD-ONLY / BASE NOT VERIFIED: $(jq -r 'map("\(.name // .context // "check"): \(.status // .state // "unknown")/\(.conclusion // "pending") ([check](\(.detailsUrl // .targetUrl // "")))") | join("<br>")' <<< "$checks")"
            elif ! jq -e 'type == "array"' >/dev/null 2>&1 <<< "$runs"; then
              ci="UNKNOWN / ACTIONS API UNAVAILABLE"
            else
              matching="$(jq -c --arg sha "$sha" --arg base "$base_sha" --argjson number "$number" '
                [.[] |
                  select(.headSha == $sha) |
                  select($base != "" and any((.pullRequests // [])[]?; .number == $number and (.base.sha // "") != "" and .base.sha == $base)) |
                  select((.workflowName // .name // "") != "GLAFIRA Java Format Check" or ((.displayTitle // "") | startswith("METADATA_ONLY -") | not))
                ] | sort_by(.createdAt // "") | reverse | group_by(.workflowName // .name // "unknown") | map(.[0])
              ' <<< "$runs")"
              if [[ "$(jq 'length' <<< "$matching")" -eq 0 ]]; then
                ci="NO MATCHING RUN FOR EXACT PR/HEAD/BASE"
              else
                ci="$(jq -r 'map((.workflowName // .name // "workflow") + ": " + (if .status == "queued" then "QUEUED" elif .status == "in_progress" then "IN_PROGRESS" elif .status == "completed" then ("COMPLETED/" + (.conclusion // "UNKNOWN")) else "UNKNOWN/" + (.status // "missing") end) + " ([run](\(.url // "")))") | join("<br>")' <<< "$matching")"
              fi
            fi
            short_sha="$(cut -c1-12 <<< "$sha")"
            echo "| [#$number]($url) $title | <code>$branch</code> | <code>$short_sha</code> | $ci | $draft |"
          done < <(jq -c '.[]' <<< "$prs")
          SCRIPT

          cat > "$RUNNER_TEMP/fetch-open-prs.sh" <<'FETCH'
          #!/usr/bin/env bash
          set -euo pipefail
          repo="$1"
          query='query($endCursor: String) {
            repository(owner: "micronizationlab", name: "glafira-ai-hub") {
              pullRequests(first: 100, after: $endCursor, states: OPEN) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  number state title headRefName headRefOid baseRefOid isDraft url
                  statusCheckRollup { contexts(first: 100) { nodes {
                    __typename
                    ... on CheckRun { name status conclusion detailsUrl }
                    ... on StatusContext { context state targetUrl }
                  } } }
                }
              }
            }
          }'
          graphql_error="$RUNNER_TEMP/glafira-open-prs-graphql-error.log"
          validation_error="$RUNNER_TEMP/glafira-open-prs-graphql-validation-error.log"
          aggregation_error="$RUNNER_TEMP/glafira-open-prs-graphql-aggregation-error.log"
          pages_file=""
          aggregated_file=""
          seen_cursors_file=""
          cleanup_fetch_files() {
            [[ -z "$pages_file" ]] || rm -f "$pages_file"
            [[ -z "$aggregated_file" ]] || rm -f "$aggregated_file"
            [[ -z "$seen_cursors_file" ]] || rm -f "$seen_cursors_file"
            rm -f "$graphql_error" "$validation_error" "$aggregation_error"
          }
          pages_file="$(mktemp "$RUNNER_TEMP/glafira-open-prs-pages.XXXXXX")" || {
            echo "UNKNOWN: cannot allocate GraphQL page snapshot." >&2
            exit 1
          }
          trap cleanup_fetch_files EXIT
          aggregated_file="$(mktemp "$RUNNER_TEMP/glafira-open-prs-aggregated.XXXXXX")" || {
            echo "UNKNOWN: cannot allocate GraphQL aggregation snapshot." >&2
            exit 1
          }

          redacted_detail() {
            local error_file="$1"
            local detail=""
            if [[ -r "$error_file" ]]; then
              detail="$(tail -n 3 "$error_file" 2>/dev/null || true)"
            fi
            printf '%s' "$detail" | tr '\n' ' ' | sed -E 's/(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_-]{20,}|[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+[-A-Za-z0-9._~+\/=_]+)/[REDACTED]/g; s/[[:space:]]+$//' || true
          }

          fetch_graphql_pages() {
            seen_cursors_file="$(mktemp "$RUNNER_TEMP/glafira-open-prs-cursors.XXXXXX")" || {
              echo "UNKNOWN: cannot allocate GraphQL cursor ledger." >&2
              return 1
            }
            local cursor=""
            local next_cursor=""
            local has_next=""
            local page_response=""
            local page_count=0
            while [[ "$page_count" -lt 100 ]]; do
              page_count=$((page_count + 1))
              if [[ -z "$cursor" ]]; then
                if ! page_response="$(gh api graphql -f query="$query" 2>>"$graphql_error")"; then
                  return 1
                fi
              else
                if ! page_response="$(gh api graphql -f query="$query" -F endCursor="$cursor" 2>>"$graphql_error")"; then
                  return 1
                fi
              fi
              printf '%s\n' "$page_response" >> "$pages_file"
              if ! jq -s -e '
                length == 1
                and (.[0].errors // []) == []
                and (.[0].data.repository.pullRequests.nodes | type) == "array"
                and (.[0].data.repository.pullRequests.pageInfo | type) == "object"
                and (.[0].data.repository.pullRequests.pageInfo.hasNextPage | type) == "boolean"
                and (
                  if .[0].data.repository.pullRequests.pageInfo.hasNextPage then
                    (.[0].data.repository.pullRequests.pageInfo.endCursor | type) == "string"
                    and (.[0].data.repository.pullRequests.pageInfo.endCursor | length) > 0
                  else true end
                )
                and all(.[0].data.repository.pullRequests.nodes[];
                  has("statusCheckRollup")
                  and (
                    .statusCheckRollup == null
                    or (
                      (.statusCheckRollup.contexts | type) == "object"
                      and (.statusCheckRollup.contexts.nodes | type) == "array"
                    )
                  )
                )
              ' <<< "$page_response" >/dev/null 2>"$validation_error"; then
                return 1
              fi
              has_next="$(jq -r '.data.repository.pullRequests.pageInfo.hasNextPage' <<< "$page_response")"
              next_cursor="$(jq -r '.data.repository.pullRequests.pageInfo.endCursor // empty' <<< "$page_response")"
              if [[ -n "$next_cursor" ]]; then
                if grep -Fqx -- "$next_cursor" "$seen_cursors_file"; then
                  echo "UNKNOWN: GraphQL pagination repeated a previously seen cursor; inventory is incomplete." >&2
                  return 1
                fi
                printf '%s\n' "$next_cursor" >> "$seen_cursors_file"
              fi
              if [[ "$has_next" == "false" ]]; then
                return 0
              fi
              if [[ -z "$next_cursor" ]]; then
                echo "UNKNOWN: GraphQL pagination requested another page without a usable cursor." >&2
                return 1
              fi
              cursor="$next_cursor"
            done
            echo "UNKNOWN: GraphQL pagination exceeded the bounded 100-page limit." >&2
            return 1
          }

          if fetch_graphql_pages; then
            if jq -s -e '
              length > 0
              and all(.[];
                (.errors // []) == []
                and (.data.repository.pullRequests.nodes | type) == "array"
                and (.data.repository.pullRequests.pageInfo | type) == "object"
                and (.data.repository.pullRequests.pageInfo.hasNextPage | type) == "boolean"
                and (
                  if .data.repository.pullRequests.pageInfo.hasNextPage then
                    (.data.repository.pullRequests.pageInfo.endCursor | type) == "string"
                    and (.data.repository.pullRequests.pageInfo.endCursor | length) > 0
                  else true end
                )
                and all(.data.repository.pullRequests.nodes[];
                  type == "object"
                  and .state == "OPEN"
                  and (.number | type) == "number"
                  and .number > 0
                  and .number == (.number | floor)
                  and (.headRefOid | type) == "string" and .headRefOid != ""
                  and (.baseRefOid | type) == "string" and .baseRefOid != ""
                  and has("statusCheckRollup")
                  and (
                    .statusCheckRollup == null
                    or (
                      (.statusCheckRollup.contexts | type) == "object"
                      and (.statusCheckRollup.contexts.nodes | type) == "array"
                    )
                  )
                )
              )
              and all(.[0:-1][];
                .data.repository.pullRequests.pageInfo.hasNextPage == true
                and (.data.repository.pullRequests.nodes | length) > 0
              )
              and .[-1].data.repository.pullRequests.pageInfo.hasNextPage == false
              and (
                ([.[].data.repository.pullRequests.nodes[].number] | length) ==
                ([.[].data.repository.pullRequests.nodes[].number] | unique | length)
              )
            ' "$pages_file" >/dev/null 2>"$validation_error"; then
              if jq -s '[
                .[].data.repository.pullRequests.nodes[] |
                {
                  number, title, headRefName, headRefOid, baseRefOid, isDraft, url,
                  statusCheckRollup: [
                    .statusCheckRollup.contexts.nodes[]? |
                    {
                      name: (.name // .context // "check"),
                      status: (.status // .state // "unknown"),
                      conclusion: (.conclusion // null),
                      detailsUrl: (.detailsUrl // .targetUrl // "")
                    }
                  ]
                }
              ]' "$pages_file" >"$aggregated_file" 2>"$aggregation_error"; then
                cat "$aggregated_file"
                exit 0
              else
                aggregation_status=$?
                aggregation_detail="$(redacted_detail "$aggregation_error")"
                printf 'UNKNOWN: GraphQL response aggregation failed (jq exit %s); REST offset fallback is disabled. %s\n' \
                  "$aggregation_status" "${aggregation_detail:-jq aggregation failed without stderr.}" >&2
                exit 1
              fi
            else
              jq_status=$?
              graphql_detail="$(redacted_detail "$validation_error")"
              printf 'UNKNOWN: GraphQL response validation failed (jq exit %s); REST offset fallback is disabled. %s\n' \
                "$jq_status" "${graphql_detail:-jq rejected the GraphQL response without stderr.}" >&2
              exit 1
            fi
          else
            gh_status=$?
            graphql_detail="$(redacted_detail "$graphql_error")"
            printf 'UNKNOWN: GraphQL cursor-based open-PR request failed (gh exit %s); REST offset fallback is disabled. %s\n' \
              "$gh_status" "${graphql_detail:-No GraphQL stderr was captured.}" >&2
            exit 1
          fi
          FETCH
          cat > "$RUNNER_TEMP/fetch-workflow-runs.sh" <<'RUNS'
          #!/usr/bin/env bash
          set -euo pipefail
          repo="$1"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          : > "$tmp"
          # Bound each reconciliation to the newest 1,000 Actions runs.
          for page in $(seq 1 10); do
            response="$(gh api "repos/$repo/actions/runs?per_page=100&page=$page&sort=created&direction=desc")"
            count="$(jq '.workflow_runs | length' <<< "$response")"
            jq -c '.workflow_runs[]? | {
              headSha: .head_sha,
              workflowName: .name,
              displayTitle: .display_title,
              status,
              conclusion,
              createdAt: .created_at,
              url: .html_url,
              pullRequests: [(.pull_requests // [])[]? | {number, base: {sha: (.base.sha // "")}}]
            }' <<< "$response" >> "$tmp"
            if [[ "$count" -lt 100 ]]; then break; fi
          done
          jq -s '.' "$tmp"
          RUNS
          cat > "$RUNNER_TEMP/compare-pr-inventory.sh" <<'COMPARE'
          #!/usr/bin/env bash
          set -euo pipefail
          previous_file="$1"
          latest_file="$2"
          [[ "$previous_file" != "-" && -f "$previous_file" && -r "$previous_file" ]] || { echo "ERROR: previous PR snapshot must be a readable regular file." >&2; exit 2; }
          [[ "$latest_file" != "-" && -f "$latest_file" && -r "$latest_file" ]] || { echo "ERROR: latest PR snapshot must be a readable regular file." >&2; exit 2; }
          # Keep inventories in files: a full JSON snapshot must never be passed in argv.
          set +e
          comparison_result="$(jq -r -s --slurpfile latest "$latest_file" '
            if length != 1 or (.[0] | type) != "array" or ($latest | length) != 1 or ($latest[0] | type) != "array" then
              error("each PR inventory must contain exactly one JSON array")
            else
              .[0] as $previous
              | $latest[0] as $current
              | if (
                  ([$previous[].number] | unique | length) != ($previous | length)
                  or ([$current[].number] | unique | length) != ($current | length)
                  or any($previous[]; (.number | type) != "number" or .number < 1 or .number != (.number | floor) or (.headRefOid | type) != "string" or .headRefOid == "" or (.baseRefOid | type) != "string" or .baseRefOid == "")
                  or any($current[]; (.number | type) != "number" or .number < 1 or .number != (.number | floor) or (.headRefOid | type) != "string" or .headRefOid == "" or (.baseRefOid | type) != "string" or .baseRefOid == "")
                ) then
                  error("PR inventory contains duplicate numbers or incomplete identity")
                else
                  ($current | reduce .[] as $pr ({}; .[($pr.number | tostring)] = $pr)) as $latest_by_number
                  | ($previous | length) == ($current | length)
                    and all($previous[]; . as $old |
                      ($latest_by_number[($old.number | tostring)] // null) as $new |
                      $new != null
                      and $new.headRefOid == $old.headRefOid
                      and $new.baseRefOid == $old.baseRefOid
                    )
                end
            end
          ' "$previous_file")"
          jq_status=$?
          set -e
          if [[ "$jq_status" -ne 0 ]]; then
            echo "ERROR: PR inventory comparison failed (jq exit $jq_status)." >&2
            exit 2
          fi
          case "$comparison_result" in
            true) exit 0 ;; # inventories match
            false) exit 1 ;; # valid inventory delta
            *) echo "ERROR: PR inventory comparison returned unexpected output." >&2; exit 2 ;;
          esac
          COMPARE
          cat > "$RUNNER_TEMP/reconcile-pr-inventory.sh" <<'RECONCILE'
          #!/usr/bin/env bash
          set -euo pipefail
          previous_file="$1"
          latest_file="$2"
          fetch_script="$3"
          comparator="$4"
          repo="$5"
          [[ -f "$comparator" && -r "$comparator" ]] && bash -n "$comparator" || { echo "UNKNOWN: comparator is missing, unreadable or invalid." >&2; exit 1; }
          : > "$latest_file" || { echo "UNKNOWN: cannot open second PR snapshot '$latest_file'." >&2; exit 1; }
          if ! bash "$fetch_script" "$repo" > "$latest_file"; then
            echo "UNKNOWN: second PR inventory fetch failed." >&2
            exit 1
          fi
          set +e
          bash "$comparator" "$previous_file" "$latest_file"
          comparison_status=$?
          set -e
          case "$comparison_status" in
            0) echo "UNCHANGED" ;;
            1) echo "CHANGED" ;;
            *) echo "UNKNOWN: PR inventory comparison failed (exit $comparison_status)." >&2; exit 1 ;;
          esac
          RECONCILE
          cat > "$RUNNER_TEMP/write-dispatcher-error-summary.sh" <<'ERROR_SUMMARY'
          #!/usr/bin/env bash
          set -euo pipefail
          summary="$1"
          message="$2"
          {
            echo "## ERROR: Dispatcher reconciliation incomplete"
            echo ""
            echo "$message"
            echo "Current identity is UNKNOWN; this run is not a successful reconciliation."
          } >> "$summary"
          exit 1
          ERROR_SUMMARY
          chmod +x "$RUNNER_TEMP/write-dispatcher-error-summary.sh"
          cat > "$RUNNER_TEMP/test-renderer.sh" <<'TEST'
          #!/usr/bin/env bash
          set -euo pipefail
          trap 'status=$?; printf "Dispatcher fixture failed (exit %s): %s\n" "$status" "$BASH_COMMAND" >&2' ERR
          if [[ "${GLAFIRA_FIXTURE_FORCE_ERR_TRAP:-0}" == "1" ]]; then
            bash -c 'exit 37'
          fi

          run_probe() {
            local probe_name="$1"
            local probe_script="$2"
            local probe_status=0
            if bash -e -E -O inherit_errexit -o pipefail -c "$probe_script"; then
              return 0
            else
              probe_status=$?
            fi
            printf 'Probe %s (%s) returned exit %s\n' "$probe_name" "$probe_script" "$probe_status" >&2
            return "$probe_status"
          }

          assert_probe_log_contains() {
            local log_file="$1"
            local expected="$2"
            if ! grep -Fq "$expected" "$log_file"; then
              cat "$log_file" >&2 || true
              printf 'Probe diagnostic did not contain expected text: %s\n' "$expected" >&2
              return 1
            fi
          }
          renderer="$RUNNER_TEMP/render-dispatcher-status.sh"
          fetch_prs="$RUNNER_TEMP/fetch-open-prs.sh"
          fetch_runs="$RUNNER_TEMP/fetch-workflow-runs.sh"
          tmp="$(mktemp -d)" || { echo "Cannot allocate Dispatcher fixture workspace." >&2; exit 1; }
          trap 'rm -rf "$tmp"' EXIT

          force_probe_failure() {
            run_probe "injected top-level failure" 'exit 37'
          }
          no_probe_failure() { return 0; }
          if run_probe "function with internal failure" 'probe() { false; true; }; probe' 2>"$tmp/dispatcher-function-probe.err"; then
            echo "run_probe accepted a function that failed before a later success" >&2; exit 1
          else
            probe_status=$?
            if [[ "$probe_status" -ne 1 ]]; then
              echo "function probe returned unexpected exit $probe_status" >&2; exit 1
            fi
          fi
          assert_probe_log_contains "$tmp/dispatcher-function-probe.err" "Probe function with internal failure"
          assert_probe_log_contains "$tmp/dispatcher-function-probe.err" "returned exit 1"
          if run_probe "pipeline failure with successful final stage" 'false | true; echo should-not-run' 2>"$tmp/dispatcher-pipeline-probe.err"; then
            echo "run_probe accepted a failed pipeline because its final command succeeded" >&2; exit 1
          else
            probe_status=$?
            if [[ "$probe_status" -ne 1 ]]; then
              echo "pipeline probe returned unexpected exit $probe_status" >&2; exit 1
            fi
          fi
          assert_probe_log_contains "$tmp/dispatcher-pipeline-probe.err" "Probe pipeline failure with successful final stage"
          assert_probe_log_contains "$tmp/dispatcher-pipeline-probe.err" "returned exit 1"
          if run_probe "command substitution failure" 'value="$(false; printf hidden)"; printf "%s" "$value"' 2>"$tmp/dispatcher-command-substitution-probe.err"; then
            echo "run_probe accepted a failed command substitution followed by a successful command" >&2; exit 1
          else
            probe_status=$?
            if [[ "$probe_status" -ne 1 ]]; then
              echo "command substitution probe returned unexpected exit $probe_status" >&2; exit 1
            fi
          fi
          assert_probe_log_contains "$tmp/dispatcher-command-substitution-probe.err" "Probe command substitution failure"
          assert_probe_log_contains "$tmp/dispatcher-command-substitution-probe.err" "returned exit 1"
          if [[ "${GLAFIRA_FIXTURE_FORCE_PROBE_FAILURE:-0}" == "1" ]]; then
            forced_probe_command=force_probe_failure
          else
            forced_probe_command=no_probe_failure
          fi
          if "$forced_probe_command"; then
            :
          else
            forced_probe_status=$?
            exit "$forced_probe_status"
          fi
          cat > "$tmp/prs.json" <<'JSON'
          [
            {"number":553,"title":"current [link](https://evil.test) | title","headRefName":"docs/reconcile","headRefOid":"sha-current","baseRefOid":"base-current","isDraft":false,"url":"https://example.test/pr/553","statusCheckRollup":[]},
            {"number":554,"title":"stale only","headRefName":"feature/stale","headRefOid":"sha-new","baseRefOid":"base-new","isDraft":true,"url":"https://example.test/pr/554","statusCheckRollup":[]},
            {"number":555,"title":"rollup preferred","headRefName":"feature/rollup","headRefOid":"sha-rollup","baseRefOid":"base-rollup","isDraft":false,"url":"https://example.test/pr/555","statusCheckRollup":[{"name":"required","status":"COMPLETED","conclusion":"SUCCESS","detailsUrl":"https://example.test/check"}]},
            {"number":556,"title":"queued exact head","headRefName":"feature/queued","headRefOid":"sha-queued","baseRefOid":"base-queued","isDraft":false,"url":"https://example.test/pr/556","statusCheckRollup":[]},
            {"number":557,"title":"skipped exact head","headRefName":"feature/skipped","headRefOid":"sha-skipped","baseRefOid":"base-skipped","isDraft":false,"url":"https://example.test/pr/557","statusCheckRollup":[]},
            {"number":558,"title":"in progress exact head","headRefName":"feature/in-progress","headRefOid":"sha-progress","baseRefOid":"base-progress","isDraft":false,"url":"https://example.test/pr/558","statusCheckRollup":[]},
            {"number":559,"title":"cancelled exact head","headRefName":"feature/cancelled","headRefOid":"sha-cancelled","baseRefOid":"base-cancelled","isDraft":false,"url":"https://example.test/pr/559","statusCheckRollup":[]},
            {"number":560,"title":"failed exact head","headRefName":"feature/failed","headRefOid":"sha-failed","baseRefOid":"base-failed","isDraft":false,"url":"https://example.test/pr/560","statusCheckRollup":[]},
            {"number":562,"title":"metadata run must not hide validation","headRefName":"feature/metadata","headRefOid":"sha-meta","baseRefOid":"base-meta-562","isDraft":false,"url":"https://example.test/pr/562","statusCheckRollup":[]},
            {"number":563,"title":"same head different base","headRefName":"feature/other-base","headRefOid":"sha-meta","baseRefOid":"base-meta-563","isDraft":false,"url":"https://example.test/pr/563","statusCheckRollup":[]},
            {"number":564,"title":"same head and base different PR","headRefName":"feature/other-pr","headRefOid":"sha-meta","baseRefOid":"base-meta-562","isDraft":false,"url":"https://example.test/pr/564","statusCheckRollup":[]},
            {"number":565,"title":"metadata-looking commit title","headRefName":"feature/title","headRefOid":"sha-title","baseRefOid":"base-title","isDraft":false,"url":"https://example.test/pr/565","statusCheckRollup":[]},
            {"number":566,"title":"metadata rollup falls back","headRefName":"feature/metadata-rollup","headRefOid":"sha-meta-rollup","baseRefOid":"base-meta-rollup","isDraft":false,"url":"https://example.test/pr/566","statusCheckRollup":[{"name":"PR metadata edit — formatter not run","status":"COMPLETED","conclusion":"SKIPPED","detailsUrl":"https://example.test/metadata"}]}
          ]
          JSON
          cat > "$tmp/runs.json" <<'JSON'
          [
            {"headSha":"sha-current","workflowName":"Android CI","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:00:00Z","url":"https://example.test/run/android-new","pullRequests":[{"number":553,"base":{"sha":"base-current"}}]},
            {"headSha":"sha-current","workflowName":"Android CI","status":"completed","conclusion":"failure","createdAt":"2026-11-24T11:00:00Z","url":"https://example.test/run/android-old","pullRequests":[{"number":553,"base":{"sha":"base-current"}}]},
