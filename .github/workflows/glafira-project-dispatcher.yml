name: GLAFIRA Project Dispatcher

on:
  push:
    branches:
      - glafira/project-dispatcher-v1
  workflow_run:
    workflows:
      - GLAFIRA CI — change-aware platform validation
      - GLAFIRA Windows Agent
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: glafira-project-dispatcher
  # Serialize global status reconciliation; do not cancel an active scan because another PR changed.
  cancel-in-progress: false

jobs:
  project-status:
    name: Reconcile all active GLAFIRA workstreams
    runs-on: ubuntu-latest
    steps:
      - name: Build cross-workstream status report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          {
          echo "# GLAFIRA Project Dispatcher"
          echo ""
          echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "| PR | Workstream | Branch | Head SHA | Latest matching CI | Draft |"
          echo "|---:|---|---|---|---|:---:|"

          prs="$(gh pr list --repo "$GH_REPO" --state open --limit 100 --json number,title,headRefName,headRefOid,isDraft,url)"
          count="$(jq 'length' <<< "$prs")"
          if [[ "$count" -eq 0 ]]; then
            echo "No open pull requests."
            exit 0
          fi

          # Fetch one bounded repository-wide snapshot instead of one API request per PR.
          # The previous per-branch loop exhausted the GitHub App installation rate limit.
          runs_available=true
          if ! runs="$(gh run list --repo "$GH_REPO" --limit 500 --json databaseId,status,conclusion,headSha,headBranch,workflowName,url,createdAt)"; then
            runs='[]'
            runs_available=false
            echo "::warning::Workflow-run snapshot unavailable (API rate limit or network); PR rows will say unavailable."
          fi

          while IFS= read -r pr; do
            number="$(jq -r '.number' <<< "$pr")"
            title="$(jq -r '.title' <<< "$pr" | tr '|' '/')"
            branch="$(jq -r '.headRefName' <<< "$pr")"
            sha="$(jq -r '.headRefOid' <<< "$pr")"
            draft="$(jq -r '.isDraft' <<< "$pr")"
            url="$(jq -r '.url' <<< "$pr")"

            if [[ "$runs_available" != true ]]; then
              ci="RUN STATUS UNAVAILABLE (API rate limit/network)"
            else
              matching="$(jq --arg sha "$sha" --arg branch "$branch" '[.[] | select(.headSha == $sha and .headBranch == $branch)] | sort_by(.workflowName, .createdAt) | group_by(.workflowName) | map(sort_by(.createdAt) | last)' <<< "$runs")"
              if [[ "$(jq 'length' <<< "$matching")" -eq 0 ]]; then
                ci="NO RUN FOR CURRENT SHA IN LAST 500 RUNS"
              else
                ci="$(jq -r '[.[] | "\(.workflowName): \(.status)/\(.conclusion // "pending") ([run](\(.url)))"] | join("<br>")' <<< "$matching")"
              fi
            fi
            short_sha="${sha:0:12}"
            echo "| [#$number]($url) $title | $branch | <code>$short_sha</code> | $ci | $draft |"
          done < <(jq -c '.[]' <<< "$prs")

          echo ""
          echo "Policy: evaluate every open PR on its exact current head SHA; a successful run for an older SHA is not acceptance for the current branch."
          } >> "$GITHUB_STEP_SUMMARY"
