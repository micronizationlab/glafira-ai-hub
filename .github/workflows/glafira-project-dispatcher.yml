          printf '%s\n' '[{"number":1,"headRefOid":"head"}]' > "$tmp/missing-identity-prs.json"
          if bash "$comparator" "$tmp/missing-identity-prs.json" "$tmp/large-prs.json"; then
            echo "incomplete PR identity was incorrectly accepted" >&2; exit 1
          else
            [[ "$?" -eq 2 ]]
          fi
          if bash "$comparator" - "$tmp/large-prs.json"; then
            echo "stdin marker was incorrectly accepted as a snapshot path" >&2; exit 1
          else
            [[ "$?" -eq 2 ]]
          fi
          jq '. + [{number: 5001, headRefOid: "head-new", baseRefOid: "base"}]' "$tmp/large-prs.json" > "$tmp/large-prs-added.json"
          if bash "$comparator" "$tmp/large-prs.json" "$tmp/large-prs-added.json"; then
            echo "added PR was incorrectly ignored" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          jq '.[0:4999]' "$tmp/large-prs.json" > "$tmp/large-prs-removed.json"
          if bash "$comparator" "$tmp/large-prs.json" "$tmp/large-prs-removed.json"; then
            echo "removed PR was incorrectly ignored" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi

          # jq execution/parse failures are not inventory deltas and must be surfaced.
          mkdir -p "$tmp/failing-jq"
          cat > "$tmp/failing-jq/jq" <<'JQ'
          #!/usr/bin/env bash
          exit 42
          JQ
          chmod +x "$tmp/failing-jq/jq"
          if PATH="$tmp/failing-jq:$PATH" bash "$comparator" "$tmp/large-prs.json" "$tmp/large-prs-same.json"; then
            echo "jq invocation failure was incorrectly accepted" >&2; exit 1
          else
            [[ "$?" -eq 2 ]]
          fi
          # A jq process exiting 1 is also a process failure, not a valid delta.
          mkdir -p "$tmp/failing-jq-exit-one"
          cat > "$tmp/failing-jq-exit-one/jq" <<'JQ_ONE'
          #!/usr/bin/env bash
          exit 1
          JQ_ONE
          chmod +x "$tmp/failing-jq-exit-one/jq"
          if PATH="$tmp/failing-jq-exit-one:$PATH" bash "$comparator" "$tmp/large-prs.json" "$tmp/large-prs-same.json"; then
            echo "jq exit 1 was incorrectly treated as a valid inventory comparison" >&2; exit 1
          else
            [[ "$?" -eq 2 ]]
          fi
          echo "dispatcher inventory comparison: 5,000 PRs, head/base/add/remove deltas and jq exit 1/42 injection: PASS"

          # Exercise the same fetch+compare wrapper used by the production step.
          reconcile="$RUNNER_TEMP/reconcile-pr-inventory.sh"
          cat > "$tmp/fetch-same-prs.sh" <<'FETCH_SAME'
          #!/usr/bin/env bash
          echo invoked >> "$FETCH_CALL_LOG"
          cat "$1"
          FETCH_SAME
          cat > "$tmp/fetch-failed-prs.sh" <<'FETCH_FAIL'
          #!/usr/bin/env bash
          exit 23
          FETCH_FAIL
          chmod +x "$tmp/fetch-same-prs.sh" "$tmp/fetch-failed-prs.sh"
          reconcile_result="$(FETCH_CALL_LOG="$tmp/comparator-fetch-calls.log" bash "$reconcile" "$tmp/large-prs.json" "$tmp/reconcile-latest.json" "$tmp/fetch-same-prs.sh" "$comparator" "$tmp/large-prs.json")"
          [[ "$reconcile_result" == "UNCHANGED" ]]
          changed_result="$(FETCH_CALL_LOG="$tmp/comparator-fetch-calls.log" bash "$reconcile" "$tmp/large-prs.json" "$tmp/reconcile-changed.json" "$tmp/fetch-same-prs.sh" "$comparator" "$tmp/large-prs-head-delta.json")"
          [[ "$changed_result" == "CHANGED" ]]
          if bash "$reconcile" "$tmp/large-prs.json" "$tmp/reconcile-fetch-failed.json" "$tmp/fetch-failed-prs.sh" "$comparator" "$tmp/large-prs.json" 2>"$tmp/second-fetch-error.log"; then
            echo "second PR inventory fetch failure was incorrectly accepted" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          grep -Fq "second PR inventory fetch failed" "$tmp/second-fetch-error.log"
          if FETCH_CALL_LOG="$tmp/comparator-fetch-calls.log" bash "$reconcile" "$tmp/large-prs.json" "$tmp/missing-comparator-latest.json" "$tmp/fetch-same-prs.sh" "$tmp/missing-comparator.sh" "$tmp/large-prs.json" 2>"$tmp/missing-comparator.err"; then
            echo "missing comparator was incorrectly accepted" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          grep -Fq "comparator is missing, unreadable or invalid" "$tmp/missing-comparator.err"
          [[ ! -e "$tmp/missing-comparator-latest.json" ]]
          [[ "$(wc -l < "$tmp/comparator-fetch-calls.log")" -eq 2 ]]
          printf 'not a valid bash script (\n' > "$tmp/invalid-comparator.sh"
          if FETCH_CALL_LOG="$tmp/comparator-fetch-calls.log" bash "$reconcile" "$tmp/large-prs.json" "$tmp/invalid-comparator-latest.json" "$tmp/fetch-same-prs.sh" "$tmp/invalid-comparator.sh" "$tmp/large-prs.json" 2>"$tmp/invalid-comparator.err"; then
            echo "invalid comparator was incorrectly accepted" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          grep -Fq "comparator is missing, unreadable or invalid" "$tmp/invalid-comparator.err"
          [[ ! -e "$tmp/invalid-comparator-latest.json" ]]
          [[ "$(wc -l < "$tmp/comparator-fetch-calls.log")" -eq 2 ]]
          if PATH="$tmp/failing-jq:$PATH" bash "$reconcile" "$tmp/large-prs.json" "$tmp/reconcile-jq-failed.json" "$tmp/fetch-same-prs.sh" "$comparator" "$tmp/large-prs.json"; then
            echo "injected jq failure was incorrectly accepted by production reconciliation wrapper" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          if bash "$reconcile" "$tmp/large-prs.json" "$tmp" "$tmp/fetch-same-prs.sh" "$comparator" "$tmp/large-prs.json" 2>"$tmp/local-open-error.log"; then
            echo "unwritable local snapshot path was incorrectly accepted" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          grep -Fq "cannot open second PR snapshot" "$tmp/local-open-error.log"
          if bash "$RUNNER_TEMP/write-dispatcher-error-summary.sh" "$tmp/report-failure-summary.md" "injected second-fetch failure"; then
            echo "production report failure-summary helper returned success" >&2; exit 1
          fi
          grep -Fq "injected second-fetch failure" "$tmp/report-failure-summary.md"
          grep -Fq "Current identity is UNKNOWN" "$tmp/report-failure-summary.md"
          if grep -Fq "| PR |" "$tmp/report-failure-summary.md"; then
            echo "normal PR table appeared in failure summary" >&2; exit 1
          fi
          echo "dispatcher fail-closed integration: second-fetch, comparator, local-open, jq and report-summary failures return non-zero: PASS"
          echo "dispatcher exact-match, newest-run, metadata, Markdown, pagination, null-association and history-cap fixtures: PASS"
          TEST
          bash "$RUNNER_TEMP/test-renderer.sh"
          if GLAFIRA_FIXTURE_FORCE_ERR_TRAP=1 bash "$RUNNER_TEMP/test-renderer.sh" >"$RUNNER_TEMP/dispatcher-forced-err.out" 2>"$RUNNER_TEMP/dispatcher-forced-err.log"; then
            echo "forced ERR-trap fixture unexpectedly succeeded" >&2; exit 1
          else
            [[ "$?" -eq 37 ]]
          fi
          grep -Fq "Dispatcher fixture failed (exit 37)" "$RUNNER_TEMP/dispatcher-forced-err.log"
          if GLAFIRA_FIXTURE_FORCE_PROBE_FAILURE=1 bash "$RUNNER_TEMP/test-renderer.sh" >"$RUNNER_TEMP/dispatcher-forced-probe.out" 2>"$RUNNER_TEMP/dispatcher-forced-probe.log"; then
            echo "forced probe-failure fixture unexpectedly succeeded" >&2; exit 1
          else
            [[ "$?" -eq 37 ]]
          fi
          grep -Fq "Probe injected top-level failure" "$RUNNER_TEMP/dispatcher-forced-probe.log"
          echo "Dispatcher ERR trap and injected exit-37 probe failure are exercised by CI: PASS"
      - name: Build cross-workstream status report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/glafira-open-prs.json" || { bash "$RUNNER_TEMP/write-dispatcher-error-summary.sh" "$GITHUB_STEP_SUMMARY" "Cannot open local PR snapshot '$RUNNER_TEMP/glafira-open-prs.json'."; exit 1; }
          if ! bash "$RUNNER_TEMP/fetch-open-prs.sh" "$GH_REPO" > "$RUNNER_TEMP/glafira-open-prs.json"; then
            bash "$RUNNER_TEMP/write-dispatcher-error-summary.sh" "$GITHUB_STEP_SUMMARY" "GraphQL cursor-based open-PR inventory is unavailable; no status is reported as passing."
            exit 1
          fi
          if ! jq -e 'type == "array"' "$RUNNER_TEMP/glafira-open-prs.json" >/dev/null; then
            bash "$RUNNER_TEMP/write-dispatcher-error-summary.sh" "$GITHUB_STEP_SUMMARY" "Open-PR snapshot is malformed or is not a JSON array."
            exit 1
          fi
          # Always reconcile before declaring the inventory empty; a new PR may have opened after the first snapshot.
          if reconciliation_result="$(bash "$RUNNER_TEMP/reconcile-pr-inventory.sh" "$RUNNER_TEMP/glafira-open-prs.json" "$RUNNER_TEMP/glafira-open-prs.latest.json" "$RUNNER_TEMP/fetch-open-prs.sh" "$RUNNER_TEMP/compare-pr-inventory.sh" "$GH_REPO")"; then
            case "$reconciliation_result" in
              UNCHANGED)
                echo "PR inventory unchanged during reconciliation; exact PR/head/base identity re-confirmed." >> "$GITHUB_STEP_SUMMARY"
                ;;
              CHANGED)
                echo "PR inventory changed during reconciliation; rendering the latest snapshot. Exact run matching remains mandatory." >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                echo "ERROR: unexpected reconciliation result '$reconciliation_result'." >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
            esac
          else
            bash "$RUNNER_TEMP/write-dispatcher-error-summary.sh" "$GITHUB_STEP_SUMMARY" "Second PR inventory fetch or exact PR/head/base comparison failed."
            exit 1
          fi
          if ! latest_count="$(jq -er 'if type == "array" then length else error("latest PR snapshot must be an array") end' "$RUNNER_TEMP/glafira-open-prs.latest.json" 2>"$RUNNER_TEMP/glafira-latest-count-error.log")"; then
            bash "$RUNNER_TEMP/write-dispatcher-error-summary.sh" "$GITHUB_STEP_SUMMARY" "Final PR inventory count failed; current identity is UNKNOWN."
            exit 1
          fi
          if [[ "$latest_count" -eq 0 ]]; then
            {
              echo "# GLAFIRA Project Dispatcher"
              echo ""
              echo "No open pull requests."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          runs='[]'
          if jq -e 'any(.[]; ([.statusCheckRollup[]? | select(((.name // .context // "") | contains("PR metadata edit")) | not)] | length) == 0)' "$RUNNER_TEMP/glafira-open-prs.latest.json" >/dev/null; then
            if ! runs="$(bash "$RUNNER_TEMP/fetch-workflow-runs.sh" "$GH_REPO")"; then
              bash "$RUNNER_TEMP/write-dispatcher-error-summary.sh" "$GITHUB_STEP_SUMMARY" "Actions run inventory fetch failed; no PR status is reported as passing."
              exit 1
            fi
          fi
          : > "$RUNNER_TEMP/glafira-workflow-runs.json" || { bash "$RUNNER_TEMP/write-dispatcher-error-summary.sh" "$GITHUB_STEP_SUMMARY" "Cannot open local Actions snapshot."; exit 1; }
          printf '%s\n' "$runs" > "$RUNNER_TEMP/glafira-workflow-runs.json"
          rendered_table="$RUNNER_TEMP/glafira-rendered-dispatcher-table.md"
          if ! bash "$RUNNER_TEMP/render-dispatcher-status.sh" "$RUNNER_TEMP/glafira-open-prs.latest.json" "$RUNNER_TEMP/glafira-workflow-runs.json" > "$rendered_table"; then
            bash "$RUNNER_TEMP/write-dispatcher-error-summary.sh" "$GITHUB_STEP_SUMMARY" "PR status rendering failed; no partial inventory table is published."
            exit 1
          fi
          {
            echo "# GLAFIRA Project Dispatcher"
            echo ""
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "| PR | Branch | Head SHA | Latest matching CI | Draft |"
            echo "|---:|---|---|---|:---:|"
            cat "$rendered_table"
            echo ""
            echo "Policy: GraphQL cursor pagination is authoritative; REST offset fallback is disabled. Fallback Actions runs require exact PR number, head SHA, and non-empty current base SHA. Skipped, cancelled, queued, partial or unknown states are not acceptance passes."
          } >> "$GITHUB_STEP_SUMMARY"
