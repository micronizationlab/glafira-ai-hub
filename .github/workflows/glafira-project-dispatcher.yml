name: GLAFIRA Project Dispatcher

on:
  push:
    branches:
      - glafira/project-dispatcher-v1
  workflow_run:
    workflows:
      - GLAFIRA CI — change-aware platform validation
      - GLAFIRA Windows Agent
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: glafira-project-dispatcher
  # Serialize global status reconciliation; do not cancel an active scan because another PR changed.
  cancel-in-progress: false

jobs:
  project-status:
    name: Reconcile all active GLAFIRA workstreams
    runs-on: ubuntu-latest
    steps:
      - name: Build cross-workstream status report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/tests/test-render-dispatcher-pr-status.sh
          {
          echo "# GLAFIRA Project Dispatcher"
          echo ""
          echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "| PR | Workstream | Branch | Head SHA | Latest matching CI | Draft |"
          echo "|---:|---|---|---|---|:---:|"

          prs="$(gh pr list --repo "$GH_REPO" --state open --limit 100 --json number,title,headRefName,headRefOid,isDraft,url,statusCheckRollup)"
          printf '%s\n' "$prs" > "$RUNNER_TEMP/glafira-open-prs.json"

          # One batched Actions API query is the fallback when GraphQL statusCheckRollup is empty.
          # A failed/rate-limited query is represented as null and rendered UNKNOWN, never as success.
          if runs="$(gh run list --repo "$GH_REPO" --limit 1000 --json headSha,name,workflowName,status,conclusion,url,createdAt 2>/dev/null)"; then
            printf '%s\n' "$runs" > "$RUNNER_TEMP/glafira-workflow-runs.json"
          else
            printf 'null\n' > "$RUNNER_TEMP/glafira-workflow-runs.json"
          fi

          count="$(jq 'length' <<< "$prs")"
          if [[ "$count" -eq 0 ]]; then
            echo "No open pull requests."
            exit 0
          fi

          bash scripts/ci/render-dispatcher-pr-status.sh \
            "$RUNNER_TEMP/glafira-open-prs.json" \
            "$RUNNER_TEMP/glafira-workflow-runs.json" >> "$GITHUB_STEP_SUMMARY"


          echo ""
          echo "Policy: evaluate every open PR on its exact current head SHA; a successful run for an older SHA is not acceptance for the current branch."
          } >> "$GITHUB_STEP_SUMMARY"
