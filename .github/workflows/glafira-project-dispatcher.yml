name: GLAFIRA Project Dispatcher

on:
  push:
    branches:
      - glafira/project-dispatcher-v1
  workflow_run:
    workflows:
      - GLAFIRA CI — change-aware platform validation
      - GLAFIRA Windows Agent
      - GLAFIRA Java Format Check
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  # Never let a later event replace a pending PR test or workflow-completion reconciliation.
  group: ${{ github.event_name == 'pull_request' && format('glafira-project-dispatcher-pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_run' && format('glafira-project-dispatcher-workflow-run-{0}', github.event.workflow_run.id) || format('glafira-project-dispatcher-run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  project-status:
    name: Reconcile all active GLAFIRA workstreams
    runs-on: ubuntu-latest
    steps:
      - name: Prepare and test exact-head renderer
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/render-dispatcher-status.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          prs_file="$1"
          runs_file="$2"
          prs="$(cat "$prs_file")"
          runs="$(cat "$runs_file")"
          if ! jq -e 'type == "array"' >/dev/null 2>&1 <<< "$prs"; then
            echo "pull request input must be a JSON array" >&2
            exit 2
          fi
          while IFS= read -r pr; do
            number="$(jq -r '.number' <<< "$pr")"
            # PR titles and branch names are contributor-controlled: strip Markdown syntax.
            title="$(jq -r '.title // "" | gsub("https?://[^ )]+"; "") | gsub("[|]"; "/") | gsub("[^[:alnum:] _.,:;!?-]"; " ")' <<< "$pr")"
            branch="$(jq -r '.headRefName // "" | gsub("[^[:alnum:] _.,:/-]"; " ")' <<< "$pr")"
            sha="$(jq -r '.headRefOid // ""' <<< "$pr")"
            base_sha="$(jq -r '.baseRefOid // ""' <<< "$pr")"
            draft="$(jq -r '.isDraft // false' <<< "$pr")"
            url="$(jq -r '.url // ""' <<< "$pr")"
            checks="$(jq -c '[.statusCheckRollup[]? | select(((.name // .context // "") | contains("PR metadata edit")) | not)]' <<< "$pr")"
            if [[ "$(jq 'length' <<< "$checks")" -gt 0 ]]; then
              ci="HEAD-ONLY / BASE NOT VERIFIED: $(jq -r 'map("\(.name // .context // "check"): \(.status // .state // "unknown")/\(.conclusion // "pending") ([check](\(.detailsUrl // .targetUrl // "")))") | join("<br>")' <<< "$checks")"
            elif ! jq -e 'type == "array"' >/dev/null 2>&1 <<< "$runs"; then
              ci="UNKNOWN / ACTIONS API UNAVAILABLE"
            else
              matching="$(jq -c --arg sha "$sha" --arg base "$base_sha" --argjson number "$number" '
                [.[] |
                  select(.headSha == $sha) |
                  select($base != "" and any((.pullRequests // [])[]?; .number == $number and (.base.sha // "") != "" and .base.sha == $base)) |
                  select((.workflowName // .name // "") != "GLAFIRA Java Format Check" or ((.displayTitle // "") | startswith("METADATA_ONLY -") | not))
                ] | sort_by(.createdAt // "") | reverse | group_by(.workflowName // .name // "unknown") | map(.[0])
              ' <<< "$runs")"
              if [[ "$(jq 'length' <<< "$matching")" -eq 0 ]]; then
                ci="NO MATCHING RUN FOR EXACT PR/HEAD/BASE"
              else
                ci="$(jq -r 'map((.workflowName // .name // "workflow") + ": " + (if .status == "queued" then "QUEUED" elif .status == "in_progress" then "IN_PROGRESS" elif .status == "completed" then ("COMPLETED/" + (.conclusion // "UNKNOWN")) else "UNKNOWN/" + (.status // "missing") end) + " ([run](\(.url // "")))") | join("<br>")' <<< "$matching")"
              fi
            fi
            short_sha="$(cut -c1-12 <<< "$sha")"
            echo "| [#$number]($url) $title | <code>$branch</code> | <code>$short_sha</code> | $ci | $draft |"
          done < <(jq -c '.[]' <<< "$prs")
          SCRIPT

          cat > "$RUNNER_TEMP/fetch-open-prs.sh" <<'FETCH'
          #!/usr/bin/env bash
          set -euo pipefail
          repo="$1"
          query='query($endCursor: String) {
            repository(owner: "micronizationlab", name: "glafira-ai-hub") {
              pullRequests(first: 100, after: $endCursor, states: [OPEN], orderBy: {field: CREATED_AT, direction: ASC}) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  number state title headRefName headRefOid baseRefOid isDraft url
                }
              }
            }
          }'
          valid_graphql_pages() {
            jq -s -e '
              length > 0
              and all(.[]; (.errors // [] | length) == 0
                and (.data.repository.pullRequests | type) == "object"
                and (.data.repository.pullRequests.nodes | type) == "array"
                and (.data.repository.pullRequests.pageInfo.hasNextPage | type) == "boolean"
                and all(.data.repository.pullRequests.nodes[];
                  type == "object"
                  and .state == "OPEN"
                  and (.number | type) == "number" and .number > 0 and .number == (.number | floor)
                  and (.headRefOid | type) == "string" and .headRefOid != ""
                  and (.baseRefOid | type) == "string" and .baseRefOid != ""
                )
                and ((.data.repository.pullRequests.pageInfo.hasNextPage == false)
                  or ((.data.repository.pullRequests.nodes | length) > 0
                    and (.data.repository.pullRequests.pageInfo.endCursor | type) == "string"
                    and .data.repository.pullRequests.pageInfo.endCursor != "")))
              and all(.[0:-1][]; .data.repository.pullRequests.pageInfo.hasNextPage == true)
              and (.[-1].data.repository.pullRequests.pageInfo.hasNextPage == false)
              and (
                [.[0:-1][].data.repository.pullRequests.pageInfo.endCursor] as $cursors
                | ($cursors | length) == ($cursors | unique | length)
              )
              and (
                [.[].data.repository.pullRequests.nodes[].number] as $numbers
                | ($numbers | length) == ($numbers | unique | length)
              )
            ' >/dev/null
          }
          if pages="$(gh api graphql --paginate -f query="$query" 2>/dev/null)" && valid_graphql_pages <<< "$pages"; then
            jq -s '[
              .[].data.repository.pullRequests.nodes[] |
              {
                number, title, headRefName, headRefOid, baseRefOid, isDraft, url,
                statusCheckRollup: []
              }
            ]' <<< "$pages"
            exit 0
          fi
          # Fail closed on malformed REST pages; never turn bad records into an empty report.
          # state=open keeps pagination bounded by active PRs rather than repository history.
          rest_pages="$(gh api --paginate "repos/$repo/pulls?state=open&sort=created&direction=asc&per_page=100")"
          jq -s -e '
            length > 0
            and all(.[];
              type == "array"
              and all(.[];
                type == "object"
                and .state == "open"
                and (.number | type) == "number" and .number > 0 and .number == (.number | floor)
                and (.head.sha | type) == "string" and .head.sha != ""
                and (.base.sha | type) == "string" and .base.sha != ""
              )
            )
          ' >/dev/null <<< "$rest_pages" || {
            echo "ERROR: REST open-PR inventory contains malformed pages or records." >&2
            exit 2
          }
          jq -s '[
            add[] |
            {
              number, title,
              headRefName: .head.ref,
              headRefOid: .head.sha,
              baseRefOid: .base.sha,
              isDraft: .draft,
              url: .html_url,
              statusCheckRollup: []
            }
          ]' <<< "$rest_pages"
          FETCH
          cat > "$RUNNER_TEMP/fetch-workflow-runs.sh" <<'RUNS'
          #!/usr/bin/env bash
          set -euo pipefail
          repo="$1"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          : > "$tmp"
          # Bound each reconciliation to the newest 1,000 Actions runs.
          for page in $(seq 1 10); do
            response="$(gh api "repos/$repo/actions/runs?per_page=100&page=$page&sort=created&direction=desc")"
            count="$(jq '.workflow_runs | length' <<< "$response")"
            jq -c '.workflow_runs[]? | {
              headSha: .head_sha,
              workflowName: .name,
              displayTitle: .display_title,
              status,
              conclusion,
              createdAt: .created_at,
              url: .html_url,
              pullRequests: [(.pull_requests // [])[]? | {number, base: {sha: (.base.sha // "")}}]
            }' <<< "$response" >> "$tmp"
            if [[ "$count" -lt 100 ]]; then break; fi
          done
          jq -s '.' "$tmp"
          RUNS
          cat > "$RUNNER_TEMP/compare-pr-inventory.sh" <<'COMPARE'
          #!/usr/bin/env bash
          set -euo pipefail
          previous_file="$1"
          latest_file="$2"
          # Diagnose local snapshot failures before invoking jq.
          if [[ ! -f "$previous_file" || ! -r "$previous_file" ]]; then
            echo "ERROR: previous PR inventory snapshot is missing or unreadable: $previous_file" >&2
            exit 2
          fi
          if [[ ! -f "$latest_file" || ! -r "$latest_file" ]]; then
            echo "ERROR: latest PR inventory snapshot is missing or unreadable: $latest_file" >&2
            exit 2
          fi
          # Keep inventories in files: a full JSON snapshot must never be passed in argv.
          set +e
          comparison_result="$(jq -r -s --slurpfile latest "$latest_file" '
            if length != 1 or (.[0] | type) != "array" or ($latest | length) != 1 or ($latest[0] | type) != "array" then
              error("each PR inventory must contain exactly one JSON array")
            else
              .[0] as $previous
              | $latest[0] as $current
              | if (
                  ([$previous[].number] | unique | length) != ($previous | length)
                  or ([$current[].number] | unique | length) != ($current | length)
                  or any($previous[]; (.number | type) != "number" or .number < 1 or .number != (.number | floor) or (.headRefOid | type) != "string" or .headRefOid == "" or (.baseRefOid | type) != "string" or .baseRefOid == "")
                  or any($current[]; (.number | type) != "number" or .number < 1 or .number != (.number | floor) or (.headRefOid | type) != "string" or .headRefOid == "" or (.baseRefOid | type) != "string" or .baseRefOid == "")
                ) then
                  error("PR inventory contains duplicate numbers or incomplete identity")
                else
                  ($current | reduce .[] as $pr ({}; .[($pr.number | tostring)] = $pr)) as $latest_by_number
                  | ($previous | length) == ($current | length)
                    and all($previous[]; . as $old |
                      ($latest_by_number[($old.number | tostring)] // null) as $new |
                      $new != null
                      and $new.headRefOid == $old.headRefOid
                      and $new.baseRefOid == $old.baseRefOid
                    )
                end
            end
          ' "$previous_file")"
          jq_status=$?
          set -e
          if [[ "$jq_status" -ne 0 ]]; then
            echo "ERROR: PR inventory comparison failed (jq exit $jq_status)." >&2
            exit 2
          fi
          case "$comparison_result" in
            true) exit 0 ;; # inventories match
            false) exit 1 ;; # valid inventory delta
            *) echo "ERROR: PR inventory comparison returned unexpected output." >&2; exit 2 ;;
          esac
          COMPARE
          cat > "$RUNNER_TEMP/reconcile-pr-inventory.sh" <<'RECONCILE'
          #!/usr/bin/env bash
          set -euo pipefail
          previous_file="$1"
          latest_file="$2"
          fetch_script="$3"
          comparator="$4"
          repo="$5"
          comparison_file="$(mktemp)"
          trap 'rm -f "$comparison_file"' EXIT
          changed_seen=false
          # A close/open during offset pagination can shift an open-only REST page.
          # Require two consecutive identical complete snapshots; allow two bounded retries.
          for attempt in 1 2 3; do
            if ! bash "$fetch_script" "$repo" > "$latest_file"; then
              echo "UNKNOWN: PR inventory fetch failed on reconciliation attempt $attempt." >&2
              exit 1
            fi
            set +e
            bash "$comparator" "$previous_file" "$latest_file"
            comparison_status=$?
            set -e
            case "$comparison_status" in
              0)
                if [[ "$changed_seen" == true ]]; then echo "CHANGED"; else echo "UNCHANGED"; fi
                exit 0
                ;;
              1)
                changed_seen=true
                cp "$latest_file" "$comparison_file"
                mv "$comparison_file" "$previous_file"
                ;;
              *)
                echo "UNKNOWN: PR inventory comparison failed (exit $comparison_status)." >&2
                exit 1
                ;;
            esac
          done
          echo "UNKNOWN: PR inventory did not stabilize after three bounded snapshots." >&2
          exit 1
          RECONCILE
          cat > "$RUNNER_TEMP/write-reconciliation-failure-summary.sh" <<'SUMMARY'
          #!/usr/bin/env bash
          set -euo pipefail
          summary_file="$1"
          {
            echo "## ERROR: Dispatcher reconciliation incomplete"
            echo ""
            echo "Second PR inventory fetch or exact PR/head/base comparison failed. Current identity is UNKNOWN; this run is not a successful reconciliation."
          } >> "$summary_file"
          SUMMARY
          cat > "$RUNNER_TEMP/reconcile-and-report.sh" <<'REPORT'
          #!/usr/bin/env bash
          set -euo pipefail
          previous_file="$1"
          latest_file="$2"
          fetch_script="$3"
          comparator="$4"
          repo="$5"
          summary_file="$6"
          if result="$(bash "$RUNNER_TEMP/reconcile-pr-inventory.sh" "$previous_file" "$latest_file" "$fetch_script" "$comparator" "$repo")"; then
            case "$result" in
              UNCHANGED|CHANGED) printf '%s\n' "$result" ;;
              *)
                echo "ERROR: unexpected reconciliation result '$result'." >> "$summary_file"
                exit 1
                ;;
            esac
          else
            bash "$RUNNER_TEMP/write-reconciliation-failure-summary.sh" "$summary_file"
            exit 1
          fi
          REPORT
          cat > "$RUNNER_TEMP/test-renderer.sh" <<'TEST'
          #!/usr/bin/env bash
          set -euo pipefail
          renderer="$RUNNER_TEMP/render-dispatcher-status.sh"
          fetch_prs="$RUNNER_TEMP/fetch-open-prs.sh"
          fetch_runs="$RUNNER_TEMP/fetch-workflow-runs.sh"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/prs.json" <<'JSON'
          [
            {"number":553,"title":"current [link](https://evil.test) | title","headRefName":"docs/reconcile","headRefOid":"sha-current","baseRefOid":"base-current","isDraft":false,"url":"https://example.test/pr/553","statusCheckRollup":[]},
            {"number":554,"title":"stale only","headRefName":"feature/stale","headRefOid":"sha-new","baseRefOid":"base-new","isDraft":true,"url":"https://example.test/pr/554","statusCheckRollup":[]},
            {"number":555,"title":"rollup preferred","headRefName":"feature/rollup","headRefOid":"sha-rollup","baseRefOid":"base-rollup","isDraft":false,"url":"https://example.test/pr/555","statusCheckRollup":[{"name":"required","status":"COMPLETED","conclusion":"SUCCESS","detailsUrl":"https://example.test/check"}]},
            {"number":556,"title":"queued exact head","headRefName":"feature/queued","headRefOid":"sha-queued","baseRefOid":"base-queued","isDraft":false,"url":"https://example.test/pr/556","statusCheckRollup":[]},
            {"number":557,"title":"skipped exact head","headRefName":"feature/skipped","headRefOid":"sha-skipped","baseRefOid":"base-skipped","isDraft":false,"url":"https://example.test/pr/557","statusCheckRollup":[]},
            {"number":558,"title":"in progress exact head","headRefName":"feature/in-progress","headRefOid":"sha-progress","baseRefOid":"base-progress","isDraft":false,"url":"https://example.test/pr/558","statusCheckRollup":[]},
            {"number":559,"title":"cancelled exact head","headRefName":"feature/cancelled","headRefOid":"sha-cancelled","baseRefOid":"base-cancelled","isDraft":false,"url":"https://example.test/pr/559","statusCheckRollup":[]},
            {"number":560,"title":"failed exact head","headRefName":"feature/failed","headRefOid":"sha-failed","baseRefOid":"base-failed","isDraft":false,"url":"https://example.test/pr/560","statusCheckRollup":[]},
            {"number":562,"title":"metadata run must not hide validation","headRefName":"feature/metadata","headRefOid":"sha-meta","baseRefOid":"base-meta-562","isDraft":false,"url":"https://example.test/pr/562","statusCheckRollup":[]},
            {"number":563,"title":"same head different base","headRefName":"feature/other-base","headRefOid":"sha-meta","baseRefOid":"base-meta-563","isDraft":false,"url":"https://example.test/pr/563","statusCheckRollup":[]},
            {"number":564,"title":"same head and base different PR","headRefName":"feature/other-pr","headRefOid":"sha-meta","baseRefOid":"base-meta-562","isDraft":false,"url":"https://example.test/pr/564","statusCheckRollup":[]},
            {"number":565,"title":"metadata-looking commit title","headRefName":"feature/title","headRefOid":"sha-title","baseRefOid":"base-title","isDraft":false,"url":"https://example.test/pr/565","statusCheckRollup":[]},
            {"number":566,"title":"metadata rollup falls back","headRefName":"feature/metadata-rollup","headRefOid":"sha-meta-rollup","baseRefOid":"base-meta-rollup","isDraft":false,"url":"https://example.test/pr/566","statusCheckRollup":[{"name":"PR metadata edit — formatter not run","status":"COMPLETED","conclusion":"SKIPPED","detailsUrl":"https://example.test/metadata"}]}
          ]
          JSON
          cat > "$tmp/runs.json" <<'JSON'
          [
            {"headSha":"sha-current","workflowName":"Android CI","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:00:00Z","url":"https://example.test/run/android-new","pullRequests":[{"number":553,"base":{"sha":"base-current"}}]},
            {"headSha":"sha-current","workflowName":"Android CI","status":"completed","conclusion":"failure","createdAt":"2026-11-24T11:00:00Z","url":"https://example.test/run/android-old","pullRequests":[{"number":553,"base":{"sha":"base-current"}}]},
            {"headSha":"sha-current","workflowName":"Android CI","status":"completed","conclusion":"success","createdAt":"2026-11-24T13:00:00Z","url":"https://example.test/run/wrong-base","pullRequests":[{"number":553,"base":{"sha":"other-base"}}]},
            {"headSha":"sha-current","workflowName":"Android CI","status":"completed","conclusion":"failure","createdAt":"2026-11-24T14:00:00Z","url":"https://example.test/run/wrong-pr","pullRequests":[{"number":564,"base":{"sha":"base-current"}}]},
            {"headSha":"sha-other","workflowName":"Android CI","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:02:00Z","url":"https://example.test/run/stale","pullRequests":[{"number":553,"base":{"sha":"base-current"}}]},
            {"headSha":"sha-queued","workflowName":"Desktop CI","status":"queued","conclusion":null,"createdAt":"2026-11-24T12:03:00Z","url":"https://example.test/run/queued","pullRequests":[{"number":556,"base":{"sha":"base-queued"}}]},
            {"headSha":"sha-skipped","workflowName":"iOS CI","status":"completed","conclusion":"skipped","createdAt":"2026-11-24T12:04:00Z","url":"https://example.test/run/skipped","pullRequests":[{"number":557,"base":{"sha":"base-skipped"}}]},
            {"headSha":"sha-progress","workflowName":"Desktop CI","status":"in_progress","conclusion":null,"createdAt":"2026-11-24T12:05:00Z","url":"https://example.test/run/progress","pullRequests":[{"number":558,"base":{"sha":"base-progress"}}]},
            {"headSha":"sha-cancelled","workflowName":"Windows CI","status":"completed","conclusion":"cancelled","createdAt":"2026-11-24T12:06:00Z","url":"https://example.test/run/cancelled","pullRequests":[{"number":559,"base":{"sha":"base-cancelled"}}]},
            {"headSha":"sha-failed","workflowName":"Agent CI","status":"completed","conclusion":"failure","createdAt":"2026-11-24T12:07:00Z","url":"https://example.test/run/failed","pullRequests":[{"number":560,"base":{"sha":"base-failed"}}]},
            {"headSha":"sha-meta","workflowName":"GLAFIRA Java Format Check","displayTitle":"VALIDATION - Java format","status":"completed","conclusion":"failure","createdAt":"2026-11-24T12:07:00Z","url":"https://example.test/run/format-failed","pullRequests":[{"number":562,"base":{"sha":"base-meta-562"}}]},
            {"headSha":"sha-meta","workflowName":"GLAFIRA Java Format Check","displayTitle":"METADATA_ONLY - PR metadata edit","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:08:00Z","url":"https://example.test/run/metadata-skipped","pullRequests":[{"number":562,"base":{"sha":"base-meta-562"}}]},
            {"headSha":"sha-meta","workflowName":"Security Scan","displayTitle":"METADATA_ONLY - commit subject","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:09:00Z","url":"https://example.test/run/security-valid","pullRequests":[{"number":562,"base":{"sha":"base-meta-562"}}]},
            {"headSha":"sha-title","workflowName":"Security Scan","displayTitle":"METADATA_ONLY - ordinary commit title","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:10:00Z","url":"https://example.test/run/title-valid","pullRequests":[{"number":565,"base":{"sha":"base-title"}}]},
            {"headSha":"sha-meta-rollup","workflowName":"GLAFIRA Java Format Check","displayTitle":"VALIDATION - Java format","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:11:00Z","url":"https://example.test/run/format-rollup-fallback","pullRequests":[{"number":566,"base":{"sha":"base-meta-rollup"}}]},
            {"headSha":"sha-unassociated","workflowName":"No PR association","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:12:00Z","url":"https://example.test/run/no-pr","pullRequests":[]}
          ]
          JSON
          output="$(bash "$renderer" "$tmp/prs.json" "$tmp/runs.json")"
          row553="$(grep -F '| [#553]' <<< "$output")"
          [[ "$row553" == *'Android CI: COMPLETED/success ([run](https://example.test/run/android-new))'* && "$row553" != *'android-old'* && "$row553" != *'wrong-base'* ]]
          grep -q 'NO MATCHING RUN FOR EXACT PR/HEAD/BASE' <<< "$(grep -F '| [#554]' <<< "$output")"
          grep -q 'HEAD-ONLY / BASE NOT VERIFIED: required: COMPLETED/SUCCESS' <<< "$(grep -F '| [#555]' <<< "$output")"
          grep -q 'Desktop CI: QUEUED' <<< "$(grep -F '| [#556]' <<< "$output")"
          grep -q 'iOS CI: COMPLETED/skipped' <<< "$(grep -F '| [#557]' <<< "$output")"
          grep -q 'Desktop CI: IN_PROGRESS' <<< "$(grep -F '| [#558]' <<< "$output")"
          grep -q 'Windows CI: COMPLETED/cancelled' <<< "$(grep -F '| [#559]' <<< "$output")"
          grep -q 'Agent CI: COMPLETED/failure' <<< "$(grep -F '| [#560]' <<< "$output")"
          row562="$(grep -F '| [#562]' <<< "$output")"
          grep -q 'GLAFIRA Java Format Check: COMPLETED/failure' <<< "$row562"
          grep -q 'Security Scan: COMPLETED/success' <<< "$row562"
          ! grep -q 'metadata-skipped' <<< "$row562"
          grep -q 'NO MATCHING RUN FOR EXACT PR/HEAD/BASE' <<< "$(grep -F '| [#563]' <<< "$output")"
          grep -q 'NO MATCHING RUN FOR EXACT PR/HEAD/BASE' <<< "$(grep -F '| [#564]' <<< "$output")"
          row565="$(grep -F '| [#565]' <<< "$output")"
          grep -q 'Security Scan: COMPLETED/success' <<< "$row565"
          grep -q 'GLAFIRA Java Format Check: COMPLETED/success' <<< "$(grep -F '| [#566]' <<< "$output")"
          ! grep -q 'evil.test' <<< "$output"
          ! grep -q '\[link\]' <<< "$output"

          mkdir -p "$tmp/fake-bin"
          # GraphQL pagination preserves base SHA and check-rollup data.
          cat > "$tmp/fake-bin/gh" <<'GH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$1" == "api" && "$2" == "graphql" ]]; then
            cat <<'JSON'
          {"data":{"repository":{"pullRequests":{"pageInfo":{"hasNextPage":true,"endCursor":"cursor-1"},"nodes":[{"number":1,"state":"OPEN","title":"one","headRefName":"a","headRefOid":"h1","baseRefOid":"b1","isDraft":false,"url":"https://example.test/1","statusCheckRollup":{"contexts":{"nodes":[{"__typename":"CheckRun","name":"Android CI","status":"COMPLETED","conclusion":"SUCCESS","detailsUrl":"https://example.test/check"}]}}}]}}}}
          {"data":{"repository":{"pullRequests":{"pageInfo":{"hasNextPage":false,"endCursor":null},"nodes":[{"number":2,"state":"OPEN","title":"two","headRefName":"b","headRefOid":"h2","baseRefOid":"b2","isDraft":true,"url":"https://example.test/2","statusCheckRollup":{"contexts":{"nodes":[]}}}]}}}}
          JSON
            exit 0
          fi
          exit 2
          GH
          chmod +x "$tmp/fake-bin/gh"
          gql_prs="$(PATH="$tmp/fake-bin:$PATH" bash "$fetch_prs" micronizationlab/glafira-ai-hub)"
          jq -e 'length == 2 and .[0].baseRefOid == "b1" and .[0].statusCheckRollup == [] and .[1].number == 2' <<< "$gql_prs" >/dev/null

          # REST fallback also paginates the open PR inventory.
          cat > "$tmp/fake-bin/gh" <<'GH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$1" == "api" && "$2" == "graphql" ]]; then exit 1; fi
          if [[ "$1" == "api" && "$2" == "--paginate" ]]; then
            printf '%s\n' '[{"number":1,"state":"open","title":"one","head":{"ref":"a","sha":"h1"},"base":{"sha":"b1"},"draft":false,"html_url":"https://example.test/1"}]'
            printf '%s\n' '[{"number":2,"state":"open","title":"two","head":{"ref":"b","sha":"h2"},"base":{"sha":"b2"},"draft":true,"html_url":"https://example.test/2"}]'
            exit 0
          fi
          exit 2
          GH
          chmod +x "$tmp/fake-bin/gh"
          rest_prs="$(PATH="$tmp/fake-bin:$PATH" bash "$fetch_prs" micronizationlab/glafira-ai-hub)"
          jq -e 'length == 2 and .[1].baseRefOid == "b2" and .[1].statusCheckRollup == []' <<< "$rest_prs" >/dev/null

          # The run inventory is capped at ten pages. Exercise the exact production
          # jq projection against both an associated run and a null pull_requests run.
          grep -Fq 'for page in $(seq 1 10)' "$fetch_runs"
          grep -Fq 'pullRequests: [(.pull_requests // [])[]?' "$fetch_runs"
          cat > "$tmp/raw-workflow-runs.json" <<'JSON'
          {"workflow_runs":[
            {"head_sha":"head-one","name":"CI","display_title":"METADATA_ONLY - sample title","status":"completed","conclusion":"success","created_at":"2026-11-24T12:00:00Z","html_url":"https://example.test/run/one","pull_requests":[{"number":999,"base":{"sha":"base-999"}}]},
            {"head_sha":"head-two","name":"CI","display_title":"ordinary title","status":"completed","conclusion":"success","created_at":"2026-11-24T12:00:00Z","html_url":"https://example.test/run/two","pull_requests":null}
          ]}
          JSON
          projected="$(jq -c '.workflow_runs[]? | {
            headSha: .head_sha,
            workflowName: .name,
            displayTitle: .display_title,
            status,
            conclusion,
            createdAt: .created_at,
            url: .html_url,
            pullRequests: [(.pull_requests // [])[]? | {number, base: {sha: (.base.sha // "")}}]
          }' "$tmp/raw-workflow-runs.json")"
          projected_array="$(jq -s '.' <<< "$projected")"
          jq -e 'length == 2 and .[0].pullRequests[0].number == 999 and .[0].pullRequests[0].base.sha == "base-999" and .[0].displayTitle == "METADATA_ONLY - sample title" and .[1].pullRequests == []' <<< "$projected_array" >/dev/null

          # A 5,000-PR snapshot exceeds Linux's per-argument size limit. File-based
          # comparison must still distinguish equality from real inventory changes.
          comparator="$RUNNER_TEMP/compare-pr-inventory.sh"
          jq -n '[range(0; 5000) as $n | {number: ($n + 1), headRefOid: ("head-" + ($n | tostring)), baseRefOid: "base"}]' > "$tmp/large-prs.json"
          cp "$tmp/large-prs.json" "$tmp/large-prs-same.json"
          bash "$comparator" "$tmp/large-prs.json" "$tmp/large-prs-same.json"
          jq '.[4999].headRefOid = "changed"' "$tmp/large-prs.json" > "$tmp/large-prs-head-delta.json"
          if bash "$comparator" "$tmp/large-prs.json" "$tmp/large-prs-head-delta.json"; then
            echo "changed PR head was incorrectly treated as an identical inventory" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          jq '.[4999].baseRefOid = "changed-base"' "$tmp/large-prs.json" > "$tmp/large-prs-base-delta.json"
          if bash "$comparator" "$tmp/large-prs.json" "$tmp/large-prs-base-delta.json"; then
            echo "changed PR base was incorrectly treated as an identical inventory" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          jq '. + [{number: 5001, headRefOid: "head-new", baseRefOid: "base"}]' "$tmp/large-prs.json" > "$tmp/large-prs-added.json"
          if bash "$comparator" "$tmp/large-prs.json" "$tmp/large-prs-added.json"; then
            echo "added PR was incorrectly ignored" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          jq '.[0:4999]' "$tmp/large-prs.json" > "$tmp/large-prs-removed.json"
          if bash "$comparator" "$tmp/large-prs.json" "$tmp/large-prs-removed.json"; then
            echo "removed PR was incorrectly ignored" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi

          # jq execution/parse failures are not inventory deltas and must be surfaced.
          mkdir -p "$tmp/failing-jq"
          cat > "$tmp/failing-jq/jq" <<'JQ'
          #!/usr/bin/env bash
          exit 42
          JQ
          chmod +x "$tmp/failing-jq/jq"
          if PATH="$tmp/failing-jq:$PATH" bash "$comparator" "$tmp/large-prs.json" "$tmp/large-prs-same.json"; then
            echo "jq invocation failure was incorrectly accepted" >&2; exit 1
          else
            [[ "$?" -eq 2 ]]
          fi
          # A jq process exiting 1 is also a process failure, not a valid delta.
          mkdir -p "$tmp/failing-jq-exit-one"
          cat > "$tmp/failing-jq-exit-one/jq" <<'JQ_ONE'
          #!/usr/bin/env bash
          exit 1
          JQ_ONE
          chmod +x "$tmp/failing-jq-exit-one/jq"
          if PATH="$tmp/failing-jq-exit-one:$PATH" bash "$comparator" "$tmp/large-prs.json" "$tmp/large-prs-same.json"; then
            echo "jq exit 1 was incorrectly treated as a valid inventory comparison" >&2; exit 1
          else
            [[ "$?" -eq 2 ]]
          fi
          echo "dispatcher inventory comparison: 5,000 PRs, head/base/add/remove deltas and jq exit 1/42 injection: PASS"

          # Exercise the same fetch+compare wrapper used by the production step.
          reconcile="$RUNNER_TEMP/reconcile-pr-inventory.sh"
          cat > "$tmp/fetch-same-prs.sh" <<'FETCH_SAME'
          #!/usr/bin/env bash
          cat "$1"
          FETCH_SAME
          cat > "$tmp/fetch-failed-prs.sh" <<'FETCH_FAIL'
          #!/usr/bin/env bash
          exit 23
          FETCH_FAIL
          chmod +x "$tmp/fetch-same-prs.sh" "$tmp/fetch-failed-prs.sh"
          reconcile_result="$(bash "$reconcile" "$tmp/large-prs.json" "$tmp/reconcile-latest.json" "$tmp/fetch-same-prs.sh" "$comparator" "$tmp/large-prs.json")"
          [[ "$reconcile_result" == "UNCHANGED" ]]
          if bash "$reconcile" "$tmp/large-prs.json" "$tmp/reconcile-fetch-failed.json" "$tmp/fetch-failed-prs.sh" "$comparator" unused; then
            echo "second PR inventory fetch failure was incorrectly accepted" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          if PATH="$tmp/failing-jq:$PATH" bash "$reconcile" "$tmp/large-prs.json" "$tmp/reconcile-jq-failed.json" "$tmp/fetch-same-prs.sh" "$comparator" "$tmp/large-prs.json"; then
            echo "injected jq failure was incorrectly accepted by production reconciliation wrapper" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          echo "dispatcher fail-closed integration: second-fetch and injected-jq failures return non-zero: PASS"

          # A valid inventory delta is CHANGED (not UNKNOWN) through the production wrapper.
          jq '. + [{number: 5001, headRefOid: "head-new", baseRefOid: "base"}]' "$tmp/large-prs.json" > "$tmp/large-prs-wrapper-delta.json"
          cat > "$tmp/fetch-changed-prs.sh" <<'FETCH_CHANGED'
          #!/usr/bin/env bash
          set -euo pipefail
          cat "$1"
          FETCH_CHANGED
          chmod +x "$tmp/fetch-changed-prs.sh"
          changed_result="$(bash "$reconcile" "$tmp/large-prs.json" "$tmp/reconcile-changed.json" "$tmp/fetch-changed-prs.sh" "$comparator" "$tmp/large-prs-wrapper-delta.json")"
          [[ "$changed_result" == "CHANGED" ]]

          # Missing/unreadable local snapshots are explicit comparator errors.
          if bash "$comparator" "$tmp/does-not-exist.json" "$tmp/large-prs-same.json" 2>"$tmp/snapshot-open.err"; then
            echo "missing previous snapshot was incorrectly accepted" >&2; exit 1
          else
            [[ "$?" -eq 2 ]]
            grep -q "previous PR inventory snapshot is missing or unreadable" "$tmp/snapshot-open.err"
          fi

          # Exercise the exact production report wrapper: injected fetch failure must
          # both fail the step and write the diagnostic to its supplied summary path.
          : > "$tmp/production-summary.md"
          if bash "$RUNNER_TEMP/reconcile-and-report.sh" "$tmp/large-prs.json" "$tmp/report-latest.json" "$tmp/fetch-failed-prs.sh" "$comparator" unused "$tmp/production-summary.md"; then
            echo "production report wrapper accepted a failed inventory fetch" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          grep -q "ERROR: Dispatcher reconciliation incomplete" "$tmp/production-summary.md"
          grep -q "Current identity is UNKNOWN" "$tmp/production-summary.md"

          # Exercise the production fetcher against mixed, malformed and unstable page fixtures.
          grep -Fq 'states: [OPEN]' "$fetch_prs"
          grep -Fq 'state=open&sort=created&direction=asc' "$fetch_prs"
          ! grep -Fq 'states: [OPEN, CLOSED, MERGED]' "$fetch_prs"
          ! grep -Fq 'state=all&sort=created&direction=asc' "$fetch_prs"
          cat > "$tmp/fake-bin/gh" <<'GH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$1" == "api" && "$2" == "graphql" ]]; then
            [[ "$3" == "--paginate" ]] || exit 91
            [[ "$4" == "-f" && "$5" == query=* ]] || exit 92
            cat "$DISPATCHER_GRAPHQL_FIXTURE"
            exit 0
          fi
          if [[ "$1" == "api" && "$2" == "--paginate" ]]; then
            [[ "$3" == *"/pulls?state=open&sort=created&direction=asc&per_page=100" ]] || exit 93
            cat "$DISPATCHER_REST_FIXTURE"
            exit 0
          fi
          exit 94
          GH
          chmod +x "$tmp/fake-bin/gh"
          cat > "$tmp/graphql-mixed.jsonl" <<'PAGES'
          {"data":{"repository":{"pullRequests":{"pageInfo":{"hasNextPage":true,"endCursor":"cursor-1"},"nodes":[{"number":7001,"state":"OPEN","title":"still open","headRefName":"feature/open","headRefOid":"head-open","baseRefOid":"base","isDraft":false,"url":"https://example.test/7001"}]}}}}
          {"data":{"repository":{"pullRequests":{"pageInfo":{"hasNextPage":false,"endCursor":null},"nodes":[{"number":7003,"state":"OPEN","title":"new open","headRefName":"feature/new","headRefOid":"head-new","baseRefOid":"base","isDraft":false,"url":"https://example.test/7003"}]}}}}
          PAGES
          printf '%s\n' '[{"number":7001,"state":"open","title":"one","head":{"ref":"a","sha":"h1"},"base":{"sha":"b1"},"draft":false,"html_url":"https://example.test/1"}]' > "$tmp/rest-valid.json"
          gql_output="$(DISPATCHER_GRAPHQL_FIXTURE="$tmp/graphql-mixed.jsonl" DISPATCHER_REST_FIXTURE="$tmp/rest-valid.json" PATH="$tmp/fake-bin:$PATH" bash "$fetch_prs" micronizationlab/glafira-ai-hub)"
          jq -e 'length == 2 and map(.number) == [7001,7003]' <<< "$gql_output" >/dev/null

          # Closed nodes, null nodes, missing state, empty continuing pages and repeated cursors
          # must reject GraphQL and exercise the real REST fallback, not a copied jq filter.
          for malformed in closed null-node missing-state empty-page repeated-cursor overlapping-prs; do
            case "$malformed" in
              closed)
                printf '%s\n' '{"data":{"repository":{"pullRequests":{"pageInfo":{"hasNextPage":false,"endCursor":null},"nodes":[{"number":7002,"state":"CLOSED","headRefOid":"h","baseRefOid":"b"}]}}}}' > "$tmp/graphql-$malformed.jsonl" ;;
              null-node)
                printf '%s\n' '{"data":{"repository":{"pullRequests":{"pageInfo":{"hasNextPage":false,"endCursor":null},"nodes":[null]}}}}' > "$tmp/graphql-$malformed.jsonl" ;;
              missing-state)
                printf '%s\n' '{"data":{"repository":{"pullRequests":{"pageInfo":{"hasNextPage":false,"endCursor":null},"nodes":[{"number":7002,"headRefOid":"h","baseRefOid":"b"}]}}}}' > "$tmp/graphql-$malformed.jsonl" ;;
              empty-page)
                printf '%s\n' '{"data":{"repository":{"pullRequests":{"pageInfo":{"hasNextPage":true,"endCursor":"cursor-empty"},"nodes":[]}}}}' '{"data":{"repository":{"pullRequests":{"pageInfo":{"hasNextPage":false,"endCursor":null},"nodes":[]}}}}' > "$tmp/graphql-$malformed.jsonl" ;;
              repeated-cursor)
                printf '%s\n' '{"data":{"repository":{"pullRequests":{"pageInfo":{"hasNextPage":true,"endCursor":"same"},"nodes":[{"number":1,"state":"OPEN","headRefOid":"h1","baseRefOid":"b1"}]}}}}' '{"data":{"repository":{"pullRequests":{"pageInfo":{"hasNextPage":true,"endCursor":"same"},"nodes":[{"number":2,"state":"OPEN","headRefOid":"h2","baseRefOid":"b2"}]}}}}' '{"data":{"repository":{"pullRequests":{"pageInfo":{"hasNextPage":false,"endCursor":null},"nodes":[]}}}}' > "$tmp/graphql-$malformed.jsonl" ;;
              overlapping-prs)
                printf '%s\n' '{"data":{"repository":{"pullRequests":{"pageInfo":{"hasNextPage":true,"endCursor":"cursor-1"},"nodes":[{"number":1,"state":"OPEN","headRefOid":"h1","baseRefOid":"b1"}]}}}}' '{"data":{"repository":{"pullRequests":{"pageInfo":{"hasNextPage":false,"endCursor":null},"nodes":[{"number":1,"state":"OPEN","headRefOid":"h1","baseRefOid":"b1"}]}}}}' > "$tmp/graphql-$malformed.jsonl" ;;
            esac
            fallback="$(DISPATCHER_GRAPHQL_FIXTURE="$tmp/graphql-$malformed.jsonl" DISPATCHER_REST_FIXTURE="$tmp/rest-valid.json" PATH="$tmp/fake-bin:$PATH" bash "$fetch_prs" micronizationlab/glafira-ai-hub)"
            jq -e 'length == 1 and .[0].number == 1' <<< "$fallback" >/dev/null
          done

          # REST malformed state/identity must fail instead of silently producing an empty inventory.
          printf '%s\n' '[{"number":9,"state":"closed","head":{"sha":"h"},"base":{"sha":"b"}}]' > "$tmp/rest-invalid.json"
          if DISPATCHER_GRAPHQL_FIXTURE="$tmp/graphql-missing-state.jsonl" DISPATCHER_REST_FIXTURE="$tmp/rest-invalid.json" PATH="$tmp/fake-bin:$PATH" bash "$fetch_prs" micronizationlab/glafira-ai-hub; then
            echo "malformed REST inventory was incorrectly accepted" >&2; exit 1
          else
            [[ "$?" -eq 2 ]]
          fi

          # The preceding production CHANGED fixture returns the same new snapshot
          # on consecutive fetches, proving the bounded retry accepts only a stable result.
          echo "dispatcher production fetcher: mixed-state filtering, malformed GraphQL fallback, malformed REST fail-closed, cursor validation and bounded stabilization: PASS"
          echo "dispatcher exact-match, newest-run, metadata, Markdown, pagination, null-association and history-cap fixtures: PASS"
          TEST
          bash "$RUNNER_TEMP/test-renderer.sh"
      - name: Build cross-workstream status report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if ! bash "$RUNNER_TEMP/fetch-open-prs.sh" "$GH_REPO" > "$RUNNER_TEMP/glafira-open-prs.json"; then
            {
              echo "# GLAFIRA Project Dispatcher"
              echo ""
              echo "ERROR: GraphQL and REST open-PR inventory are unavailable; no status is reported as passing."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          count="$(jq 'length' "$RUNNER_TEMP/glafira-open-prs.json")"
          if [[ "$count" -eq 0 ]]; then
            {
              echo "# GLAFIRA Project Dispatcher"
              echo ""
              echo "No open pull requests."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          runs='[]'
          if jq -e 'any(.[]; ([.statusCheckRollup[]? | select(((.name // .context // "") | contains("PR metadata edit")) | not)] | length) == 0)' "$RUNNER_TEMP/glafira-open-prs.json" >/dev/null; then
            if runs="$(bash "$RUNNER_TEMP/fetch-workflow-runs.sh" "$GH_REPO")"; then :; else runs='null'; fi
          fi
          printf '%s\n' "$runs" > "$RUNNER_TEMP/glafira-workflow-runs.json"
          # Re-read and compare the PR inventory through the same tested wrapper.
          if reconciliation_result="$(bash "$RUNNER_TEMP/reconcile-and-report.sh" "$RUNNER_TEMP/glafira-open-prs.json" "$RUNNER_TEMP/glafira-open-prs.latest.json" "$RUNNER_TEMP/fetch-open-prs.sh" "$RUNNER_TEMP/compare-pr-inventory.sh" "$GH_REPO" "$GITHUB_STEP_SUMMARY")"; then
            case "$reconciliation_result" in
              UNCHANGED)
                echo "PR inventory unchanged during reconciliation; exact PR/head/base identity re-confirmed." >> "$GITHUB_STEP_SUMMARY"
                ;;
              CHANGED)
                echo "PR inventory changed during reconciliation; rendering the latest stable snapshot. Exact run matching remains mandatory." >> "$GITHUB_STEP_SUMMARY"
                ;;
            esac
          else
            exit 1
          fi
          {
            echo "# GLAFIRA Project Dispatcher"
            echo ""
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "| PR | Branch | Head SHA | Latest matching CI | Draft |"
            echo "|---:|---|---|---|:---:|"
            bash "$RUNNER_TEMP/render-dispatcher-status.sh" "$RUNNER_TEMP/glafira-open-prs.latest.json" "$RUNNER_TEMP/glafira-workflow-runs.json"
            echo ""
            echo "Policy: historical PR inventory does not request statusCheckRollup; fallback Actions runs require exact PR number, head SHA, and non-empty current base SHA. Formatter metadata-only runs are excluded only for the Java formatter workflow. Workflow history is capped at 1,000 recent runs. No matching evidence is UNKNOWN/not a pass; skipped, cancelled, queued, partial or unknown states are not acceptance passes."
          } >> "$GITHUB_STEP_SUMMARY"
