name: GLAFIRA Project Dispatcher

on:
  push:
    branches:
      - glafira/project-dispatcher-v1
  workflow_run:
    workflows:
      - GLAFIRA CI — change-aware platform validation
      - GLAFIRA Windows Agent
      - GLAFIRA Java Format Check
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  # Never let a later event replace a pending PR test or workflow-completion reconciliation.
  group: ${{ github.event_name == 'pull_request' && format('glafira-project-dispatcher-pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_run' && format('glafira-project-dispatcher-workflow-run-{0}', github.event.workflow_run.id) || format('glafira-project-dispatcher-run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  project-status:
    name: Reconcile all active GLAFIRA workstreams
    runs-on: ubuntu-latest
    steps:
      - name: Prepare and test exact-head renderer
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/render-dispatcher-status.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          prs_file="$1"
          runs_file="$2"
          prs="$(cat "$prs_file")"
          runs="$(cat "$runs_file")"
          if ! jq -e 'type == "array"' >/dev/null 2>&1 <<< "$prs"; then
            echo "pull request input must be a JSON array" >&2
            exit 2
          fi
          while IFS= read -r pr; do
            number="$(jq -r '.number' <<< "$pr")"
            # PR titles and branch names are contributor-controlled: strip Markdown syntax.
            title="$(jq -r '.title // "" | gsub("https?://[^ )]+"; "") | gsub("[|]"; "/") | gsub("[^[:alnum:] _.,:;!?-]"; " ")' <<< "$pr")"
            branch="$(jq -r '.headRefName // "" | gsub("[^[:alnum:] _.,:/-]"; " ")' <<< "$pr")"
            sha="$(jq -r '.headRefOid // ""' <<< "$pr")"
            base_sha="$(jq -r '.baseRefOid // ""' <<< "$pr")"
            draft="$(jq -r '.isDraft // false' <<< "$pr")"
            url="$(jq -r '.url // ""' <<< "$pr")"
            checks="$(jq -c '[.statusCheckRollup[]? | select(((.name // .context // "") | contains("PR metadata edit")) | not)]' <<< "$pr")"
            if [[ "$(jq 'length' <<< "$checks")" -gt 0 ]]; then
              ci="HEAD-ONLY / BASE NOT VERIFIED: $(jq -r 'map("\(.name // .context // "check"): \(.status // .state // "unknown")/\(.conclusion // "pending") ([check](\(.detailsUrl // .targetUrl // "")))") | join("<br>")' <<< "$checks")"
            elif ! jq -e 'type == "array"' >/dev/null 2>&1 <<< "$runs"; then
              ci="UNKNOWN / ACTIONS API UNAVAILABLE"
            else
              matching="$(jq -c --arg sha "$sha" --arg base "$base_sha" --argjson number "$number" '
                [.[] |
                  select(.headSha == $sha) |
                  select($base != "" and any((.pullRequests // [])[]?; .number == $number and (.base.sha // "") != "" and .base.sha == $base)) |
                  select((.workflowName // .name // "") != "GLAFIRA Java Format Check" or ((.displayTitle // "") | startswith("METADATA_ONLY -") | not))
                ] | sort_by(.createdAt // "") | reverse | group_by(.workflowName // .name // "unknown") | map(.[0])
              ' <<< "$runs")"
              if [[ "$(jq 'length' <<< "$matching")" -eq 0 ]]; then
                ci="NO MATCHING RUN FOR EXACT PR/HEAD/BASE"
              else
                ci="$(jq -r 'map((.workflowName // .name // "workflow") + ": " + (if .status == "queued" then "QUEUED" elif .status == "in_progress" then "IN_PROGRESS" elif .status == "completed" then ("COMPLETED/" + (.conclusion // "UNKNOWN")) else "UNKNOWN/" + (.status // "missing") end) + " ([run](\(.url // "")))") | join("<br>")' <<< "$matching")"
              fi
            fi
            short_sha="$(cut -c1-12 <<< "$sha")"
            echo "| [#$number]($url) $title | <code>$branch</code> | <code>$short_sha</code> | $ci | $draft |"
          done < <(jq -c '.[]' <<< "$prs")
          SCRIPT

          cat > "$RUNNER_TEMP/fetch-open-prs.sh" <<'FETCH'
          #!/usr/bin/env bash
          set -euo pipefail
          repo="$1"
          query='query($endCursor: String) {
            repository(owner: "micronizationlab", name: "glafira-ai-hub") {
              pullRequests(first: 100, after: $endCursor, states: OPEN) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  number title headRefName headRefOid baseRefOid isDraft url
                  statusCheckRollup { contexts(first: 100) { nodes {
                    __typename
                    ... on CheckRun { name status conclusion detailsUrl }
                    ... on StatusContext { context state targetUrl }
                  } } }
                }
              }
            }
          }'
          graphql_error="$RUNNER_TEMP/glafira-open-prs-graphql-error.log"
          validation_error="$RUNNER_TEMP/glafira-open-prs-graphql-validation-error.log"
          if pages="$(gh api graphql --paginate -f query="$query" 2>"$graphql_error")"; then
            if jq -s -e 'all(.[]; .data.repository.pullRequests.nodes != null)' >/dev/null 2>"$validation_error" <<< "$pages"; then
              jq -s '[
                .[].data.repository.pullRequests.nodes[] |
                {
                  number, title, headRefName, headRefOid, baseRefOid, isDraft, url,
                  statusCheckRollup: [
                    .statusCheckRollup.contexts.nodes[]? |
                    {
                      name: (.name // .context // "check"),
                      status: (.status // .state // "unknown"),
                      conclusion: (.conclusion // null),
                      detailsUrl: (.detailsUrl // .targetUrl // "")
                    }
                  ]
                }
              ]' <<< "$pages"
              exit 0
            else
              jq_status=$?
              graphql_detail="$(tail -n 3 "$validation_error" 2>/dev/null | tr '\n' ' ' | sed -E 's/(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_-]{20,}|Bearer [^ ]+)/[REDACTED]/g; s/[[:space:]]+$//')"
              printf 'UNKNOWN: GraphQL response validation failed (jq exit %s); REST offset fallback is disabled. %s\n' \
                "$jq_status" "${graphql_detail:-jq rejected the GraphQL response without stderr.}" >&2
              exit 1
            fi
          else
            gh_status=$?
            graphql_detail="$(tail -n 3 "$graphql_error" 2>/dev/null | tr '\n' ' ' | sed -E 's/(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_-]{20,}|Bearer [^ ]+)/[REDACTED]/g; s/[[:space:]]+$//')"
            printf 'UNKNOWN: GraphQL cursor-based open-PR request failed (gh exit %s); REST offset fallback is disabled. %s\n' \
              "$gh_status" "${graphql_detail:-No GraphQL stderr was captured.}" >&2
            exit 1
          fi
          FETCH
          cat > "$RUNNER_TEMP/fetch-workflow-runs.sh" <<'RUNS'
          #!/usr/bin/env bash
          set -euo pipefail
          repo="$1"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          : > "$tmp"
          # Bound each reconciliation to the newest 1,000 Actions runs.
          for page in $(seq 1 10); do
            response="$(gh api "repos/$repo/actions/runs?per_page=100&page=$page&sort=created&direction=desc")"
            count="$(jq '.workflow_runs | length' <<< "$response")"
            jq -c '.workflow_runs[]? | {
              headSha: .head_sha,
              workflowName: .name,
              displayTitle: .display_title,
              status,
              conclusion,
              createdAt: .created_at,
              url: .html_url,
              pullRequests: [(.pull_requests // [])[]? | {number, base: {sha: (.base.sha // "")}}]
            }' <<< "$response" >> "$tmp"
            if [[ "$count" -lt 100 ]]; then break; fi
          done
          jq -s '.' "$tmp"
          RUNS
          cat > "$RUNNER_TEMP/compare-pr-inventory.sh" <<'COMPARE'
          #!/usr/bin/env bash
          set -euo pipefail
          previous_file="$1"
          latest_file="$2"
          [[ "$previous_file" != "-" && -f "$previous_file" && -r "$previous_file" ]] || { echo "ERROR: previous PR snapshot must be a readable regular file." >&2; exit 2; }
          [[ "$latest_file" != "-" && -f "$latest_file" && -r "$latest_file" ]] || { echo "ERROR: latest PR snapshot must be a readable regular file." >&2; exit 2; }
          # Keep inventories in files: a full JSON snapshot must never be passed in argv.
          set +e
          comparison_result="$(jq -r -s --slurpfile latest "$latest_file" '
            if length != 1 or (.[0] | type) != "array" or ($latest | length) != 1 or ($latest[0] | type) != "array" then
              error("each PR inventory must contain exactly one JSON array")
            else
              .[0] as $previous
              | $latest[0] as $current
              | if (
                  ([$previous[].number] | unique | length) != ($previous | length)
                  or ([$current[].number] | unique | length) != ($current | length)
                  or any($previous[]; (.number | type) != "number" or .number < 1 or .number != (.number | floor) or (.headRefOid | type) != "string" or .headRefOid == "" or (.baseRefOid | type) != "string" or .baseRefOid == "")
                  or any($current[]; (.number | type) != "number" or .number < 1 or .number != (.number | floor) or (.headRefOid | type) != "string" or .headRefOid == "" or (.baseRefOid | type) != "string" or .baseRefOid == "")
                ) then
                  error("PR inventory contains duplicate numbers or incomplete identity")
                else
                  ($current | reduce .[] as $pr ({}; .[($pr.number | tostring)] = $pr)) as $latest_by_number
                  | ($previous | length) == ($current | length)
                    and all($previous[]; . as $old |
                      ($latest_by_number[($old.number | tostring)] // null) as $new |
                      $new != null
                      and $new.headRefOid == $old.headRefOid
                      and $new.baseRefOid == $old.baseRefOid
                    )
                end
            end
          ' "$previous_file")"
          jq_status=$?
          set -e
          if [[ "$jq_status" -ne 0 ]]; then
            echo "ERROR: PR inventory comparison failed (jq exit $jq_status)." >&2
            exit 2
          fi
          case "$comparison_result" in
            true) exit 0 ;; # inventories match
            false) exit 1 ;; # valid inventory delta
            *) echo "ERROR: PR inventory comparison returned unexpected output." >&2; exit 2 ;;
          esac
          COMPARE
          cat > "$RUNNER_TEMP/reconcile-pr-inventory.sh" <<'RECONCILE'
          #!/usr/bin/env bash
          set -euo pipefail
          previous_file="$1"
          latest_file="$2"
          fetch_script="$3"
          comparator="$4"
          repo="$5"
          [[ -f "$comparator" && -r "$comparator" ]] && bash -n "$comparator" || { echo "UNKNOWN: comparator is missing, unreadable or invalid." >&2; exit 1; }
          : > "$latest_file" || { echo "UNKNOWN: cannot open second PR snapshot '$latest_file'." >&2; exit 1; }
          if ! bash "$fetch_script" "$repo" > "$latest_file"; then
            echo "UNKNOWN: second PR inventory fetch failed." >&2
            exit 1
          fi
          set +e
          bash "$comparator" "$previous_file" "$latest_file"
          comparison_status=$?
          set -e
          case "$comparison_status" in
            0) echo "UNCHANGED" ;;
            1) echo "CHANGED" ;;
            *) echo "UNKNOWN: PR inventory comparison failed (exit $comparison_status)." >&2; exit 1 ;;
          esac
          RECONCILE
          cat > "$RUNNER_TEMP/write-dispatcher-error-summary.sh" <<'ERROR_SUMMARY'
          #!/usr/bin/env bash
          set -euo pipefail
          summary="$1"
          message="$2"
          {
            echo "## ERROR: Dispatcher reconciliation incomplete"
            echo ""
            echo "$message"
            echo "Current identity is UNKNOWN; this run is not a successful reconciliation."
          } >> "$summary"
          exit 1
          ERROR_SUMMARY
          chmod +x "$RUNNER_TEMP/write-dispatcher-error-summary.sh"
          cat > "$RUNNER_TEMP/test-renderer.sh" <<'TEST'
          #!/usr/bin/env bash
          set -euo pipefail
          trap 'status=$?; printf "Dispatcher fixture failed (exit %s): %s\\n" "$status" "$BASH_COMMAND" >&2' ERR

          run_probe() {
            local probe_name="$1"
            local probe_script="$2"
            local probe_status=0
            if bash -e -o pipefail -c "$probe_script"; then
              return 0
            else
              probe_status=$?
            fi
            printf 'Probe %s returned exit %s\n' "$probe_name" "$probe_status" >&2
            return "$probe_status"
          }
          renderer="$RUNNER_TEMP/render-dispatcher-status.sh"
          fetch_prs="$RUNNER_TEMP/fetch-open-prs.sh"
          fetch_runs="$RUNNER_TEMP/fetch-workflow-runs.sh"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          force_probe_failure() {
            run_probe "injected top-level failure" 'exit 37'
          }
          no_probe_failure() { return 0; }
          if run_probe "function with internal failure" 'probe() { false; true; }; probe' 2>"$RUNNER_TEMP/dispatcher-function-probe.err"; then
            echo "run_probe accepted a function that failed before a later success" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          grep -Fq "Probe function with internal failure returned exit 1" "$RUNNER_TEMP/dispatcher-function-probe.err"
          if [[ "${GLAFIRA_FIXTURE_FORCE_PROBE_FAILURE:-0}" == "1" ]]; then
            forced_probe_command=force_probe_failure
          else
            forced_probe_command=no_probe_failure
          fi
          "$forced_probe_command"
          cat > "$tmp/prs.json" <<'JSON'
          [
            {"number":553,"title":"current [link](https://evil.test) | title","headRefName":"docs/reconcile","headRefOid":"sha-current","baseRefOid":"base-current","isDraft":false,"url":"https://example.test/pr/553","statusCheckRollup":[]},
            {"number":554,"title":"stale only","headRefName":"feature/stale","headRefOid":"sha-new","baseRefOid":"base-new","isDraft":true,"url":"https://example.test/pr/554","statusCheckRollup":[]},
            {"number":555,"title":"rollup preferred","headRefName":"feature/rollup","headRefOid":"sha-rollup","baseRefOid":"base-rollup","isDraft":false,"url":"https://example.test/pr/555","statusCheckRollup":[{"name":"required","status":"COMPLETED","conclusion":"SUCCESS","detailsUrl":"https://example.test/check"}]},
            {"number":556,"title":"queued exact head","headRefName":"feature/queued","headRefOid":"sha-queued","baseRefOid":"base-queued","isDraft":false,"url":"https://example.test/pr/556","statusCheckRollup":[]},
            {"number":557,"title":"skipped exact head","headRefName":"feature/skipped","headRefOid":"sha-skipped","baseRefOid":"base-skipped","isDraft":false,"url":"https://example.test/pr/557","statusCheckRollup":[]},
            {"number":558,"title":"in progress exact head","headRefName":"feature/in-progress","headRefOid":"sha-progress","baseRefOid":"base-progress","isDraft":false,"url":"https://example.test/pr/558","statusCheckRollup":[]},
            {"number":559,"title":"cancelled exact head","headRefName":"feature/cancelled","headRefOid":"sha-cancelled","baseRefOid":"base-cancelled","isDraft":false,"url":"https://example.test/pr/559","statusCheckRollup":[]},
            {"number":560,"title":"failed exact head","headRefName":"feature/failed","headRefOid":"sha-failed","baseRefOid":"base-failed","isDraft":false,"url":"https://example.test/pr/560","statusCheckRollup":[]},
            {"number":562,"title":"metadata run must not hide validation","headRefName":"feature/metadata","headRefOid":"sha-meta","baseRefOid":"base-meta-562","isDraft":false,"url":"https://example.test/pr/562","statusCheckRollup":[]},
            {"number":563,"title":"same head different base","headRefName":"feature/other-base","headRefOid":"sha-meta","baseRefOid":"base-meta-563","isDraft":false,"url":"https://example.test/pr/563","statusCheckRollup":[]},
            {"number":564,"title":"same head and base different PR","headRefName":"feature/other-pr","headRefOid":"sha-meta","baseRefOid":"base-meta-562","isDraft":false,"url":"https://example.test/pr/564","statusCheckRollup":[]},
            {"number":565,"title":"metadata-looking commit title","headRefName":"feature/title","headRefOid":"sha-title","baseRefOid":"base-title","isDraft":false,"url":"https://example.test/pr/565","statusCheckRollup":[]},
            {"number":566,"title":"metadata rollup falls back","headRefName":"feature/metadata-rollup","headRefOid":"sha-meta-rollup","baseRefOid":"base-meta-rollup","isDraft":false,"url":"https://example.test/pr/566","statusCheckRollup":[{"name":"PR metadata edit — formatter not run","status":"COMPLETED","conclusion":"SKIPPED","detailsUrl":"https://example.test/metadata"}]}
          ]
          JSON
          cat > "$tmp/runs.json" <<'JSON'
          [
            {"headSha":"sha-current","workflowName":"Android CI","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:00:00Z","url":"https://example.test/run/android-new","pullRequests":[{"number":553,"base":{"sha":"base-current"}}]},
            {"headSha":"sha-current","workflowName":"Android CI","status":"completed","conclusion":"failure","createdAt":"2026-11-24T11:00:00Z","url":"https://example.test/run/android-old","pullRequests":[{"number":553,"base":{"sha":"base-current"}}]},
            {"headSha":"sha-current","workflowName":"Android CI","status":"completed","conclusion":"success","createdAt":"2026-11-24T13:00:00Z","url":"https://example.test/run/wrong-base","pullRequests":[{"number":553,"base":{"sha":"other-base"}}]},
            {"headSha":"sha-current","workflowName":"Android CI","status":"completed","conclusion":"failure","createdAt":"2026-11-24T14:00:00Z","url":"https://example.test/run/wrong-pr","pullRequests":[{"number":564,"base":{"sha":"base-current"}}]},
            {"headSha":"sha-other","workflowName":"Android CI","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:02:00Z","url":"https://example.test/run/stale","pullRequests":[{"number":553,"base":{"sha":"base-current"}}]},
            {"headSha":"sha-queued","workflowName":"Desktop CI","status":"queued","conclusion":null,"createdAt":"2026-11-24T12:03:00Z","url":"https://example.test/run/queued","pullRequests":[{"number":556,"base":{"sha":"base-queued"}}]},
            {"headSha":"sha-skipped","workflowName":"iOS CI","status":"completed","conclusion":"skipped","createdAt":"2026-11-24T12:04:00Z","url":"https://example.test/run/skipped","pullRequests":[{"number":557,"base":{"sha":"base-skipped"}}]},
            {"headSha":"sha-progress","workflowName":"Desktop CI","status":"in_progress","conclusion":null,"createdAt":"2026-11-24T12:05:00Z","url":"https://example.test/run/progress","pullRequests":[{"number":558,"base":{"sha":"base-progress"}}]},
            {"headSha":"sha-cancelled","workflowName":"Windows CI","status":"completed","conclusion":"cancelled","createdAt":"2026-11-24T12:06:00Z","url":"https://example.test/run/cancelled","pullRequests":[{"number":559,"base":{"sha":"base-cancelled"}}]},
            {"headSha":"sha-failed","workflowName":"Agent CI","status":"completed","conclusion":"failure","createdAt":"2026-11-24T12:07:00Z","url":"https://example.test/run/failed","pullRequests":[{"number":560,"base":{"sha":"base-failed"}}]},
            {"headSha":"sha-meta","workflowName":"GLAFIRA Java Format Check","displayTitle":"VALIDATION - Java format","status":"completed","conclusion":"failure","createdAt":"2026-11-24T12:07:00Z","url":"https://example.test/run/format-failed","pullRequests":[{"number":562,"base":{"sha":"base-meta-562"}}]},
            {"headSha":"sha-meta","workflowName":"GLAFIRA Java Format Check","displayTitle":"METADATA_ONLY - PR metadata edit","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:08:00Z","url":"https://example.test/run/metadata-skipped","pullRequests":[{"number":562,"base":{"sha":"base-meta-562"}}]},
            {"headSha":"sha-meta","workflowName":"Security Scan","displayTitle":"METADATA_ONLY - commit subject","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:09:00Z","url":"https://example.test/run/security-valid","pullRequests":[{"number":562,"base":{"sha":"base-meta-562"}}]},
            {"headSha":"sha-title","workflowName":"Security Scan","displayTitle":"METADATA_ONLY - ordinary commit title","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:10:00Z","url":"https://example.test/run/title-valid","pullRequests":[{"number":565,"base":{"sha":"base-title"}}]},
            {"headSha":"sha-meta-rollup","workflowName":"GLAFIRA Java Format Check","displayTitle":"VALIDATION - Java format","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:11:00Z","url":"https://example.test/run/format-rollup-fallback","pullRequests":[{"number":566,"base":{"sha":"base-meta-rollup"}}]},
            {"headSha":"sha-unassociated","workflowName":"No PR association","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:12:00Z","url":"https://example.test/run/no-pr","pullRequests":[]}
          ]
          JSON
          output="$(bash "$renderer" "$tmp/prs.json" "$tmp/runs.json")"
          row553="$(grep -F '| [#553]' <<< "$output")"
          [[ "$row553" == *'Android CI: COMPLETED/success ([run](https://example.test/run/android-new))'* && "$row553" != *'android-old'* && "$row553" != *'wrong-base'* ]]
          grep -q 'NO MATCHING RUN FOR EXACT PR/HEAD/BASE' <<< "$(grep -F '| [#554]' <<< "$output")"
          grep -q 'HEAD-ONLY / BASE NOT VERIFIED: required: COMPLETED/SUCCESS' <<< "$(grep -F '| [#555]' <<< "$output")"
          grep -q 'Desktop CI: QUEUED' <<< "$(grep -F '| [#556]' <<< "$output")"
          grep -q 'iOS CI: COMPLETED/skipped' <<< "$(grep -F '| [#557]' <<< "$output")"
          grep -q 'Desktop CI: IN_PROGRESS' <<< "$(grep -F '| [#558]' <<< "$output")"
          grep -q 'Windows CI: COMPLETED/cancelled' <<< "$(grep -F '| [#559]' <<< "$output")"
          grep -q 'Agent CI: COMPLETED/failure' <<< "$(grep -F '| [#560]' <<< "$output")"
          row562="$(grep -F '| [#562]' <<< "$output")"
          grep -q 'GLAFIRA Java Format Check: COMPLETED/failure' <<< "$row562"
          grep -q 'Security Scan: COMPLETED/success' <<< "$row562"
          ! grep -q 'metadata-skipped' <<< "$row562"
          grep -q 'NO MATCHING RUN FOR EXACT PR/HEAD/BASE' <<< "$(grep -F '| [#563]' <<< "$output")"
          grep -q 'NO MATCHING RUN FOR EXACT PR/HEAD/BASE' <<< "$(grep -F '| [#564]' <<< "$output")"
          row565="$(grep -F '| [#565]' <<< "$output")"
          grep -q 'Security Scan: COMPLETED/success' <<< "$row565"
          grep -q 'GLAFIRA Java Format Check: COMPLETED/success' <<< "$(grep -F '| [#566]' <<< "$output")"
          ! grep -q 'evil.test' <<< "$output"
          ! grep -q '\[link\]' <<< "$output"

          mkdir -p "$tmp/fake-bin"
          # GraphQL pagination preserves base SHA and check-rollup data.
          cat > "$tmp/fake-bin/gh" <<'GH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$1" == "api" && "$2" == "graphql" ]]; then
            cat <<'JSON'
          {"data":{"repository":{"pullRequests":{"nodes":[{"number":1,"title":"one","headRefName":"a","headRefOid":"h1","baseRefOid":"b1","isDraft":false,"url":"https://example.test/1","statusCheckRollup":{"contexts":{"nodes":[{"__typename":"CheckRun","name":"Android CI","status":"COMPLETED","conclusion":"SUCCESS","detailsUrl":"https://example.test/check"}]}}}]}}}}
          {"data":{"repository":{"pullRequests":{"nodes":[{"number":2,"title":"two","headRefName":"b","headRefOid":"h2","baseRefOid":"b2","isDraft":true,"url":"https://example.test/2","statusCheckRollup":{"contexts":{"nodes":[]}}}]}}}}
          JSON
            exit 0
          fi
          exit 2
          GH
          chmod +x "$tmp/fake-bin/gh"
          gql_prs="$(PATH="$tmp/fake-bin:$PATH" bash "$fetch_prs" micronizationlab/glafira-ai-hub)"
          jq -e 'length == 2 and .[0].baseRefOid == "b1" and .[0].statusCheckRollup[0].name == "Android CI" and .[1].number == 2' <<< "$gql_prs" >/dev/null

          # A later-page GraphQL failure must discard partial stdout and never call REST.
          cat > "$tmp/fake-bin/gh" <<'GH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$1" == "api" && "$2" == "graphql" ]]; then
            [[ " $* " == *" --paginate "* ]]
            [[ "$*" == *"pageInfo"* && "$*" == *"endCursor"* && "$*" == *'after: $endCursor'* ]]
            echo graphql >> "$CALL_LOG"
            cat <<'JSON'
          {"data":{"repository":{"pullRequests":{"pageInfo":{"hasNextPage":true,"endCursor":"cursor-one"},"nodes":[{"number":1,"title":"partial","headRefName":"a","headRefOid":"h1","baseRefOid":"b1","isDraft":false,"url":"https://example.test/1","statusCheckRollup":{"contexts":{"nodes":[]}}}]}}}}
          JSON
            classic_token="$(printf '%s' 'ghp_' '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ')"
            fine_grained_token="$(printf '%s' 'github_pat_' '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-' '0123456789')"
            printf 'injected GraphQL page two failure: %s %s\n' "$classic_token" "$fine_grained_token" >&2
            exit 23
          fi
          echo unexpected-rest >> "$CALL_LOG"
          exit 99
          GH
          chmod +x "$tmp/fake-bin/gh"
          if output="$(CALL_LOG="$tmp/gh-calls.log" PATH="$tmp/fake-bin:$PATH" bash "$fetch_prs" micronizationlab/glafira-ai-hub 2>"$tmp/graphql-outage.err")"; then
            echo "GraphQL outage was incorrectly accepted" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          [[ -z "$output" ]]
          [[ "$(cat "$tmp/gh-calls.log")" == "graphql" ]]
          expected_graphql_outage="UNKNOWN: GraphQL cursor-based open-PR request failed (gh exit 23); REST offset fallback is disabled. injected GraphQL page two failure: [REDACTED] [REDACTED]"
          [[ "$(cat "$tmp/graphql-outage.err")" == "$expected_graphql_outage" ]]

          if grep -Eq 'ghp_|github_pat_|0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ|0123456789' "$tmp/graphql-outage.err"; then
            echo "a prefix or fragment of a synthetic credential reached the sanitized diagnostic" >&2; exit 1
          fi
          echo "validated sanitized GraphQL outage diagnostic: $(cat "$tmp/graphql-outage.err")"
          # A valid gh response followed by jq validation failure must have a distinct diagnostic.
          mkdir -p "$tmp/fake-gh"

          cat > "$tmp/fake-gh/gh" <<'GH_VALID'
          #!/usr/bin/env bash
          if [[ "$1" == "api" && "$2" == "graphql" ]]; then
            echo graphql >> "$CALL_LOG"
            cat <<'JSON'
          {"data":{"repository":{"pullRequests":{"nodes":[]}}}}
          {"data":{"repository":{"pullRequests":{"pageInfo":{"hasNextPage":false,"endCursor":null}}}}}
          JSON
            exit 0
          fi
          echo unexpected-rest >> "$CALL_LOG"
          exit 99
          GH_VALID
          chmod +x "$tmp/fake-gh/gh"
          if CALL_LOG="$tmp/graphql-validation-calls.log" PATH="$tmp/fake-gh:$PATH" bash "$fetch_prs" "micronizationlab/glafira-ai-hub" > "$tmp/graphql-validation.out" 2>"$tmp/graphql-validation.err"; then
            echo "jq response-validation failure was incorrectly accepted" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          [[ ! -s "$tmp/graphql-validation.out" ]]

          grep -Fq "GraphQL response validation failed (jq exit 1)" "$tmp/graphql-validation.err"
          [[ "$(cat "$tmp/graphql-validation-calls.log")" == "graphql" ]]
          mkdir -p "$tmp/fake-gh-valid" "$tmp/failing-validation-jq"
          cat > "$tmp/fake-gh-valid/gh" <<'GH_VALID_PAGES'
          #!/usr/bin/env bash
          if [[ "$1" == "api" && "$2" == "graphql" ]]; then
            echo graphql >> "$CALL_LOG"
            cat <<'JSON'
          {"data":{"repository":{"pullRequests":{"nodes":[]}}}}
          {"data":{"repository":{"pullRequests":{"pageInfo":{"hasNextPage":false,"endCursor":null},"nodes":[]}}}}
          JSON
            exit 0
          fi
          echo unexpected-rest >> "$CALL_LOG"
          exit 99
          GH_VALID_PAGES
          cat > "$tmp/failing-validation-jq/jq" <<'JQ_VALIDATION'
          #!/usr/bin/env bash
          exit 42
          JQ_VALIDATION
          chmod +x "$tmp/fake-gh-valid/gh" "$tmp/failing-validation-jq/jq"
          if CALL_LOG="$tmp/graphql-validation-jq42-calls.log" PATH="$tmp/fake-gh-valid:$tmp/failing-validation-jq:$PATH" bash "$fetch_prs" "micronizationlab/glafira-ai-hub" > "$tmp/graphql-validation-jq42.out" 2>"$tmp/graphql-validation-jq42.err"; then
            echo "injected jq validator exit 42 was incorrectly accepted" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          [[ ! -s "$tmp/graphql-validation-jq42.out" ]]
          grep -Fq "GraphQL response validation failed (jq exit 42)" "$tmp/graphql-validation-jq42.err"
          [[ "$(cat "$tmp/graphql-validation-jq42-calls.log")" == "graphql" ]]
          echo "GraphQL malformed-page validation and injected jq exit 42 fail closed without REST fallback: PASS"
          # The run inventory is capped at ten pages. Exercise the exact production
          # jq projection against both an associated run and a null pull_requests run.
          grep -Fq 'for page in $(seq 1 10)' "$fetch_runs"
          grep -Fq 'pullRequests: [(.pull_requests // [])[]?' "$fetch_runs"
          cat > "$tmp/raw-workflow-runs.json" <<'JSON'
          {"workflow_runs":[
            {"head_sha":"head-one","name":"CI","display_title":"METADATA_ONLY - sample title","status":"completed","conclusion":"success","created_at":"2026-11-24T12:00:00Z","html_url":"https://example.test/run/one","pull_requests":[{"number":999,"base":{"sha":"base-999"}}]},
            {"head_sha":"head-two","name":"CI","display_title":"ordinary title","status":"completed","conclusion":"success","created_at":"2026-11-24T12:00:00Z","html_url":"https://example.test/run/two","pull_requests":null}
          ]}
          JSON
          projected="$(jq -c '.workflow_runs[]? | {
            headSha: .head_sha,
            workflowName: .name,
            displayTitle: .display_title,
            status,
            conclusion,
            createdAt: .created_at,
            url: .html_url,
            pullRequests: [(.pull_requests // [])[]? | {number, base: {sha: (.base.sha // "")}}]
          }' "$tmp/raw-workflow-runs.json")"
          projected_array="$(jq -s '.' <<< "$projected")"
          jq -e 'length == 2 and .[0].pullRequests[0].number == 999 and .[0].pullRequests[0].base.sha == "base-999" and .[0].displayTitle == "METADATA_ONLY - sample title" and .[1].pullRequests == []' <<< "$projected_array" >/dev/null

          # A 5,000-PR snapshot exceeds Linux's per-argument size limit. File-based
          # comparison must still distinguish equality from real inventory changes.
          comparator="$RUNNER_TEMP/compare-pr-inventory.sh"
          jq -n '[range(0; 5000) as $n | {number: ($n + 1), headRefOid: ("head-" + ($n | tostring)), baseRefOid: "base"}]' > "$tmp/large-prs.json"
          cp "$tmp/large-prs.json" "$tmp/large-prs-same.json"
          bash "$comparator" "$tmp/large-prs.json" "$tmp/large-prs-same.json"
          jq '.[4999].headRefOid = "changed"' "$tmp/large-prs.json" > "$tmp/large-prs-head-delta.json"
          if bash "$comparator" "$tmp/large-prs.json" "$tmp/large-prs-head-delta.json"; then
            echo "changed PR head was incorrectly treated as an identical inventory" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          jq '.[4999].baseRefOid = "changed-base"' "$tmp/large-prs.json" > "$tmp/large-prs-base-delta.json"
          if bash "$comparator" "$tmp/large-prs.json" "$tmp/large-prs-base-delta.json"; then
            echo "changed PR base was incorrectly treated as an identical inventory" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          jq '.[0].number = 6000' "$tmp/large-prs.json" > "$tmp/large-prs-number-delta.json"
          if bash "$comparator" "$tmp/large-prs.json" "$tmp/large-prs-number-delta.json"; then
            echo "changed PR number was incorrectly ignored" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          printf '{' > "$tmp/malformed-prs.json"
          if bash "$comparator" "$tmp/malformed-prs.json" "$tmp/large-prs.json"; then
            echo "malformed JSON was incorrectly accepted" >&2; exit 1
          else
            [[ "$?" -eq 2 ]]
          fi
          printf '%s\n' '[{"number":1,"headRefOid":"head"}]' > "$tmp/missing-identity-prs.json"
          if bash "$comparator" "$tmp/missing-identity-prs.json" "$tmp/large-prs.json"; then
            echo "incomplete PR identity was incorrectly accepted" >&2; exit 1
          else
            [[ "$?" -eq 2 ]]
          fi
          if bash "$comparator" - "$tmp/large-prs.json"; then
            echo "stdin marker was incorrectly accepted as a snapshot path" >&2; exit 1
          else
            [[ "$?" -eq 2 ]]
          fi
          jq '. + [{number: 5001, headRefOid: "head-new", baseRefOid: "base"}]' "$tmp/large-prs.json" > "$tmp/large-prs-added.json"
          if bash "$comparator" "$tmp/large-prs.json" "$tmp/large-prs-added.json"; then
            echo "added PR was incorrectly ignored" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          jq '.[0:4999]' "$tmp/large-prs.json" > "$tmp/large-prs-removed.json"
          if bash "$comparator" "$tmp/large-prs.json" "$tmp/large-prs-removed.json"; then
            echo "removed PR was incorrectly ignored" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi

          # jq execution/parse failures are not inventory deltas and must be surfaced.
          mkdir -p "$tmp/failing-jq"
          cat > "$tmp/failing-jq/jq" <<'JQ'
          #!/usr/bin/env bash
          exit 42
          JQ
          chmod +x "$tmp/failing-jq/jq"
          if PATH="$tmp/failing-jq:$PATH" bash "$comparator" "$tmp/large-prs.json" "$tmp/large-prs-same.json"; then
            echo "jq invocation failure was incorrectly accepted" >&2; exit 1
          else
            [[ "$?" -eq 2 ]]
          fi
          # A jq process exiting 1 is also a process failure, not a valid delta.
          mkdir -p "$tmp/failing-jq-exit-one"
          cat > "$tmp/failing-jq-exit-one/jq" <<'JQ_ONE'
          #!/usr/bin/env bash
          exit 1
          JQ_ONE
          chmod +x "$tmp/failing-jq-exit-one/jq"
          if PATH="$tmp/failing-jq-exit-one:$PATH" bash "$comparator" "$tmp/large-prs.json" "$tmp/large-prs-same.json"; then
            echo "jq exit 1 was incorrectly treated as a valid inventory comparison" >&2; exit 1
          else
            [[ "$?" -eq 2 ]]
          fi
          echo "dispatcher inventory comparison: 5,000 PRs, head/base/add/remove deltas and jq exit 1/42 injection: PASS"

          # Exercise the same fetch+compare wrapper used by the production step.
          reconcile="$RUNNER_TEMP/reconcile-pr-inventory.sh"
          cat > "$tmp/fetch-same-prs.sh" <<'FETCH_SAME'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -n "${FETCH_CALL_LOG:-}" ]]; then
            printf 'invoked\n' >> "$FETCH_CALL_LOG"
          fi
          cat "$1"
          FETCH_SAME
          cat > "$tmp/fetch-failed-prs.sh" <<'FETCH_FAIL'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -n "${FETCH_CALL_LOG:-}" ]]; then
            printf 'invoked\n' >> "$FETCH_CALL_LOG"
          fi
          exit 23
          FETCH_FAIL
          chmod +x "$tmp/fetch-same-prs.sh" "$tmp/fetch-failed-prs.sh"
          cat > "$tmp/fetch-distinct-prs.sh" <<'FETCH_DISTINCT'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -n "${FETCH_CALL_LOG:-}" ]]; then
            printf 'invoked\n' >> "$FETCH_CALL_LOG"
          fi
          cat "$1"
          FETCH_DISTINCT
          chmod +x "$tmp/fetch-distinct-prs.sh"
          env -u FETCH_CALL_LOG bash "$tmp/fetch-distinct-prs.sh" "$tmp/large-prs-head-delta.json" > "$tmp/distinct-without-log.json"
          cmp -s "$tmp/large-prs-head-delta.json" "$tmp/distinct-without-log.json"
          cp "$tmp/large-prs.json" "$tmp/reconcile-baseline-before.json"
          reconcile_result="$(FETCH_CALL_LOG="$tmp/comparator-fetch-calls.log" bash "$reconcile" "$tmp/large-prs.json" "$tmp/reconcile-latest.json" "$tmp/fetch-same-prs.sh" "$comparator" "$tmp/large-prs.json")"
          [[ "$reconcile_result" == "UNCHANGED" ]]
          [[ "$(wc -l < "$tmp/comparator-fetch-calls.log")" -eq 1 ]]
          changed_result="$(FETCH_CALL_LOG="$tmp/comparator-fetch-calls.log" bash "$reconcile" "$tmp/large-prs.json" "$tmp/reconcile-changed.json" "$tmp/fetch-same-prs.sh" "$comparator" "$tmp/large-prs-head-delta.json")"
          [[ "$changed_result" == "CHANGED" ]]
          [[ "$(wc -l < "$tmp/comparator-fetch-calls.log")" -eq 2 ]]
          if FETCH_CALL_LOG="$tmp/failed-fetch-calls.log" bash "$reconcile" "$tmp/large-prs.json" "$tmp/reconcile-fetch-failed.json" "$tmp/fetch-failed-prs.sh" "$comparator" "$tmp/large-prs.json" 2>"$tmp/second-fetch-error.log"; then
            echo "second PR inventory fetch failure was incorrectly accepted" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          grep -Fq "second PR inventory fetch failed" "$tmp/second-fetch-error.log"
          [[ "$(wc -l < "$tmp/failed-fetch-calls.log")" -eq 1 ]]
          [[ "$(wc -l < "$tmp/comparator-fetch-calls.log")" -eq 2 ]]
          if FETCH_CALL_LOG="$tmp/comparator-fetch-calls.log" bash "$reconcile" "$tmp/large-prs.json" "$tmp/missing-comparator-latest.json" "$tmp/fetch-same-prs.sh" "$tmp/missing-comparator.sh" "$tmp/large-prs.json" 2>"$tmp/missing-comparator.err"; then
            echo "missing comparator was incorrectly accepted" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          grep -Fq "comparator is missing, unreadable or invalid" "$tmp/missing-comparator.err"
          [[ ! -e "$tmp/missing-comparator-latest.json" ]]
          [[ "$(wc -l < "$tmp/comparator-fetch-calls.log")" -eq 2 ]]
          printf 'not a valid bash script (\n' > "$tmp/invalid-comparator.sh"
          if FETCH_CALL_LOG="$tmp/comparator-fetch-calls.log" bash "$reconcile" "$tmp/large-prs.json" "$tmp/invalid-comparator-latest.json" "$tmp/fetch-same-prs.sh" "$tmp/invalid-comparator.sh" "$tmp/large-prs.json" 2>"$tmp/invalid-comparator.err"; then
            echo "invalid comparator was incorrectly accepted" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          grep -Fq "comparator is missing, unreadable or invalid" "$tmp/invalid-comparator.err"
          [[ ! -e "$tmp/invalid-comparator-latest.json" ]]
          [[ "$(wc -l < "$tmp/comparator-fetch-calls.log")" -eq 2 ]]

          cat > "$tmp/capturing-comparator.sh" <<'CAPTURE_COMPARATOR'
          #!/usr/bin/env bash
          set -euo pipefail
          cp "$2" "$CAPTURED_CANDIDATE"
          exec "$REAL_COMPARATOR" "$@"
          CAPTURE_COMPARATOR
          chmod +x "$tmp/capturing-comparator.sh"
          if PATH="$tmp/failing-jq:$PATH" FETCH_CALL_LOG="$tmp/jq-failed-fetch.log" CAPTURED_CANDIDATE="$tmp/captured-jq-failure-candidate.json" REAL_COMPARATOR="$comparator" bash "$reconcile" "$tmp/large-prs.json" "$tmp/reconcile-jq-failed.json" "$tmp/fetch-distinct-prs.sh" "$tmp/capturing-comparator.sh" "$tmp/large-prs-head-delta.json" > "$tmp/reconcile-jq-failed.out" 2>"$tmp/reconcile-jq-failed.err"; then
            echo "injected jq failure was incorrectly accepted by production reconciliation wrapper" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          grep -Fq "UNKNOWN: PR inventory comparison failed" "$tmp/reconcile-jq-failed.err"
          [[ "$(wc -l < "$tmp/jq-failed-fetch.log")" -eq 1 ]]
          cmp -s "$tmp/large-prs-head-delta.json" "$tmp/captured-jq-failure-candidate.json"
          cmp -s "$tmp/reconcile-baseline-before.json" "$tmp/large-prs.json"
          [[ ! -s "$tmp/reconcile-jq-failed.out" ]]
          mkdir -p "$tmp/unwritable-fetch-log"
          if FETCH_CALL_LOG="$tmp/unwritable-fetch-log/missing/calls.log" bash "$tmp/fetch-same-prs.sh" "$tmp/large-prs.json" > "$tmp/fetch-log-failure.out" 2>/dev/null; then
            echo "fixture fetch succeeded despite an unwriteable invocation log" >&2; exit 1
          else
            [[ "$?" -ne 0 ]]
          fi
          [[ ! -s "$tmp/fetch-log-failure.out" ]]

          if FETCH_CALL_LOG="$tmp/unwritable-fetch-log/missing/distinct-calls.log" bash "$tmp/fetch-distinct-prs.sh" "$tmp/large-prs-head-delta.json" > "$tmp/distinct-fetch-log-failure.out" 2>/dev/null; then
            echo "distinct fetch succeeded despite an unwriteable invocation log" >&2; exit 1
          else
            [[ "$?" -ne 0 ]]
          fi
          [[ ! -s "$tmp/distinct-fetch-log-failure.out" ]]
          env -u FETCH_CALL_LOG bash "$tmp/fetch-same-prs.sh" "$tmp/large-prs.json" > "$tmp/fetch-without-optional-log.json"
          cmp -s "$tmp/large-prs.json" "$tmp/fetch-without-optional-log.json"
          if bash "$reconcile" "$tmp/large-prs.json" "$tmp" "$tmp/fetch-same-prs.sh" "$comparator" "$tmp/large-prs.json" 2>"$tmp/local-open-error.log"; then
            echo "unwritable local snapshot path was incorrectly accepted" >&2; exit 1
          else
            [[ "$?" -eq 1 ]]
          fi
          grep -Fq "cannot open second PR snapshot" "$tmp/local-open-error.log"
          if bash "$RUNNER_TEMP/write-dispatcher-error-summary.sh" "$tmp/report-failure-summary.md" "injected second-fetch failure"; then
            echo "production report failure-summary helper returned success" >&2; exit 1
          fi
          grep -Fq "injected second-fetch failure" "$tmp/report-failure-summary.md"
          grep -Fq "Current identity is UNKNOWN" "$tmp/report-failure-summary.md"
          if grep -Fq "| PR |" "$tmp/report-failure-summary.md"; then
            echo "normal PR table appeared in failure summary" >&2; exit 1
          fi
          echo "dispatcher fail-closed integration: second-fetch, comparator, local-open, jq and report-summary failures return non-zero: PASS"

          if GLAFIRA_FIXTURE_FORCE_PROBE_FAILURE=1 bash "$RUNNER_TEMP/test-renderer.sh" > "$RUNNER_TEMP/dispatcher-forced-failure.out" 2> "$RUNNER_TEMP/dispatcher-forced-failure.err"; then
            echo "forced renderer failure unexpectedly passed" >&2; exit 1
          else
            forced_failure_status=$?
          fi
          [[ "$forced_failure_status" -eq 37 ]]
          grep -Fq "Probe injected top-level failure returned exit 37" "$RUNNER_TEMP/dispatcher-forced-failure.err"
          grep -Eq '^Dispatcher fixture failed \\(exit 37\\): .+' "$RUNNER_TEMP/dispatcher-forced-failure.err"
          echo "dispatcher ERR trap preserves originating probe name and exit 37: PASS"
          echo "dispatcher exact-match, newest-run, metadata, Markdown, pagination, null-association and history-cap fixtures: PASS"
          TEST
          bash "$RUNNER_TEMP/test-renderer.sh"
      - name: Build cross-workstream status report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/glafira-open-prs.json" || { bash "$RUNNER_TEMP/write-dispatcher-error-summary.sh" "$GITHUB_STEP_SUMMARY" "Cannot open local PR snapshot '$RUNNER_TEMP/glafira-open-prs.json'."; exit 1; }
          if ! bash "$RUNNER_TEMP/fetch-open-prs.sh" "$GH_REPO" > "$RUNNER_TEMP/glafira-open-prs.json"; then
            bash "$RUNNER_TEMP/write-dispatcher-error-summary.sh" "$GITHUB_STEP_SUMMARY" "GraphQL cursor-based open-PR inventory is unavailable; no status is reported as passing."
            exit 1
          fi
          if ! jq -e 'type == "array"' "$RUNNER_TEMP/glafira-open-prs.json" >/dev/null; then
            bash "$RUNNER_TEMP/write-dispatcher-error-summary.sh" "$GITHUB_STEP_SUMMARY" "Open-PR snapshot is malformed or is not a JSON array."
            exit 1
          fi
          # Always reconcile before declaring the inventory empty; a new PR may have opened after the first snapshot.
          if reconciliation_result="$(bash "$RUNNER_TEMP/reconcile-pr-inventory.sh" "$RUNNER_TEMP/glafira-open-prs.json" "$RUNNER_TEMP/glafira-open-prs.latest.json" "$RUNNER_TEMP/fetch-open-prs.sh" "$RUNNER_TEMP/compare-pr-inventory.sh" "$GH_REPO")"; then
            case "$reconciliation_result" in
              UNCHANGED)
                echo "PR inventory unchanged during reconciliation; exact PR/head/base identity re-confirmed." >> "$GITHUB_STEP_SUMMARY"
                ;;
              CHANGED)
                echo "PR inventory changed during reconciliation; rendering the latest snapshot. Exact run matching remains mandatory." >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                echo "ERROR: unexpected reconciliation result '$reconciliation_result'." >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
            esac
          else
            bash "$RUNNER_TEMP/write-dispatcher-error-summary.sh" "$GITHUB_STEP_SUMMARY" "Second PR inventory fetch or exact PR/head/base comparison failed."
            exit 1
          fi
          latest_count="$(jq 'length' "$RUNNER_TEMP/glafira-open-prs.latest.json")"
          if [[ "$latest_count" -eq 0 ]]; then
            {
              echo "# GLAFIRA Project Dispatcher"
              echo ""
              echo "No open pull requests."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          runs='[]'
          if jq -e 'any(.[]; ([.statusCheckRollup[]? | select(((.name // .context // "") | contains("PR metadata edit")) | not)] | length) == 0)' "$RUNNER_TEMP/glafira-open-prs.latest.json" >/dev/null; then
            if ! runs="$(bash "$RUNNER_TEMP/fetch-workflow-runs.sh" "$GH_REPO")"; then
              bash "$RUNNER_TEMP/write-dispatcher-error-summary.sh" "$GITHUB_STEP_SUMMARY" "Actions run inventory fetch failed; no PR status is reported as passing."
              exit 1
            fi
          fi
          : > "$RUNNER_TEMP/glafira-workflow-runs.json" || { bash "$RUNNER_TEMP/write-dispatcher-error-summary.sh" "$GITHUB_STEP_SUMMARY" "Cannot open local Actions snapshot."; exit 1; }
          printf '%s\n' "$runs" > "$RUNNER_TEMP/glafira-workflow-runs.json"
          {
            echo "# GLAFIRA Project Dispatcher"
            echo ""
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "| PR | Branch | Head SHA | Latest matching CI | Draft |"
            echo "|---:|---|---|---|:---:|"
            bash "$RUNNER_TEMP/render-dispatcher-status.sh" "$RUNNER_TEMP/glafira-open-prs.latest.json" "$RUNNER_TEMP/glafira-workflow-runs.json"
            echo ""
            echo "Policy: GraphQL cursor pagination is authoritative; REST offset fallback is disabled. Fallback Actions runs require exact PR number, head SHA, and non-empty current base SHA. Skipped, cancelled, queued, partial or unknown states are not acceptance passes."
          } >> "$GITHUB_STEP_SUMMARY"
