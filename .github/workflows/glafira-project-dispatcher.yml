name: GLAFIRA Project Dispatcher

on:
  push:
    branches:
      - glafira/project-dispatcher-v1
  workflow_run:
    workflows:
      - GLAFIRA CI — change-aware platform validation
      - GLAFIRA Windows Agent
      - GLAFIRA Java Format Check
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  # Never let a later event replace a pending PR test or workflow-completion reconciliation.
  group: ${{ github.event_name == 'pull_request' && format('glafira-project-dispatcher-pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_run' && format('glafira-project-dispatcher-workflow-run-{0}', github.event.workflow_run.id) || format('glafira-project-dispatcher-run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  project-status:
    name: Reconcile all active GLAFIRA workstreams
    runs-on: ubuntu-latest
    steps:
      - name: Prepare and test exact-head renderer
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/render-dispatcher-status.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          prs_file="$1"
          runs_file="$2"
          if ! jq -e 'type == "array"' "$prs_file" >/dev/null 2>&1; then
            echo "pull request input must be a JSON array" >&2
            exit 2
          fi
          # Normalize unavailable/malformed Actions history so it cannot erase PR rows.
          normalized_runs="$RUNNER_TEMP/dispatcher-normalized-runs.json"
          if ! jq -e 'type == "array"' "$runs_file" >/dev/null 2>&1; then
            printf 'null\n' > "$normalized_runs"
          else
            cp "$runs_file" "$normalized_runs"
          fi
          # Build the exact PR/head/base run index once, then render all PR rows in
          # one jq pass. This avoids rescanning the 1,000-run history for every PR.
          jq -r --slurpfile runs "$normalized_runs" '
            def clean_title:
              (.title // "")
              | gsub("https?://[^ )]+"; "")
              | gsub("[|]"; "/")
              | gsub("[^[:alnum:] _.,:;!?-]"; " ");
            def clean_branch:
              (.headRefName // "") | gsub("[^[:alnum:] _.,:/-]"; " ");
            def run_status:
              if .status == "queued" then "QUEUED"
              elif .status == "in_progress" then "IN_PROGRESS"
              elif .status == "completed" then "COMPLETED/" + (.conclusion // "UNKNOWN")
              else "UNKNOWN/" + (.status // "missing") end;
            . as $prs
            | (if (($runs | length) == 1 and ($runs[0] | type) == "array") then $runs[0] else null end) as $valid_runs
            | ($valid_runs // [] | [
                .[] as $run
                | ($run.pullRequests // [])[]? as $association
                | select($association.number != null and ($association.base.sha // "") != "" and ($run.headSha // "") != "")
                | select(($run.workflowName // $run.name // "") != "GLAFIRA Java Format Check" or (((if ($run.displayTitle | type) == "string" then $run.displayTitle else "" end) | startswith("METADATA_ONLY -")) | not))
                | {key: ([$association.number, $run.headSha, $association.base.sha] | tojson), run: $run}
              ]
              | group_by(.key)
              | map({key: .[0].key, value: ([.[].run] | sort_by(.createdAt // "") | reverse | group_by(.workflowName // .name // "unknown") | map(.[0]))})
              | from_entries) as $run_index
            | [
                $prs[] as $pr
                | ([$pr.statusCheckRollup[]? | select(((.name // .context // "") | contains("PR metadata edit")) | not)]) as $checks
                | if ($checks | length) > 0 then
                    "| [#\($pr.number)](\($pr.url // "")) \($pr | clean_title) | <code>\($pr | clean_branch)</code> | <code>\(($pr.headRefOid // "")[0:12])</code> | HEAD-ONLY / BASE NOT VERIFIED: \($checks | map("\(.name // .context // "check"): \(.status // .state // "unknown")/\(.conclusion // "pending") ([check](\(.detailsUrl // .targetUrl // "")))") | join("<br>")) | \($pr.isDraft // false) |"
                  elif $valid_runs == null then
                    "| [#\($pr.number)](\($pr.url // "")) \($pr | clean_title) | <code>\($pr | clean_branch)</code> | <code>\(($pr.headRefOid // "")[0:12])</code> | UNKNOWN / ACTIONS API UNAVAILABLE | \($pr.isDraft // false) |"
                  else
                    ($run_index[([$pr.number, ($pr.headRefOid // ""), ($pr.baseRefOid // "")] | tojson)] // []) as $matching
                    | if ($matching | length) == 0 then
                        "| [#\($pr.number)](\($pr.url // "")) \($pr | clean_title) | <code>\($pr | clean_branch)</code> | <code>\(($pr.headRefOid // "")[0:12])</code> | NO MATCHING RUN FOR EXACT PR/HEAD/BASE | \($pr.isDraft // false) |"
                      else
                        "| [#\($pr.number)](\($pr.url // "")) \($pr | clean_title) | <code>\($pr | clean_branch)</code> | <code>\(($pr.headRefOid // "")[0:12])</code> | \($matching | map(((.workflowName // .name // "workflow") | gsub("[|]"; "/")) + ": " + run_status + " ([run](\(.url // "")))") | join("<br>")) | \($pr.isDraft // false) |"
                      end
                  end
              ]
            | .[]
          ' "$prs_file"
          SCRIPT

          cat > "$RUNNER_TEMP/fetch-open-prs.sh" <<'FETCH'
          #!/usr/bin/env bash
          set -euo pipefail
          repo="$1"
          # One bounded GraphQL request only. If more than 100 open PRs exist,
          # fall back to REST pagination rather than letting gh --paginate follow
          # an untrusted/repeated endCursor indefinitely.
          query='query {
            repository(owner: "micronizationlab", name: "glafira-ai-hub") {
              pullRequests(first: 100, states: [OPEN], orderBy: {field: CREATED_AT, direction: ASC}) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  number state title headRefName headRefOid baseRefOid isDraft url
                }
              }
            }
          }'
          valid_graphql_pages() {
            jq -s -e '
              length > 0
              and all(.[]; (.errors // [] | length) == 0
                and (.data.repository.pullRequests | type) == "object"
                and (.data.repository.pullRequests.nodes | type) == "array"
                and (.data.repository.pullRequests.pageInfo.hasNextPage | type) == "boolean"
                and all(.data.repository.pullRequests.nodes[];
                  type == "object"
                  and .state == "OPEN"
                  and (.number | type) == "number" and .number > 0 and .number == (.number | floor)
                  and (.headRefOid | type) == "string" and .headRefOid != ""
                  and (.baseRefOid | type) == "string" and .baseRefOid != ""
                )
                and ((.data.repository.pullRequests.pageInfo.hasNextPage == false)
                  or ((.data.repository.pullRequests.nodes | length) > 0
                    and (.data.repository.pullRequests.pageInfo.endCursor | type) == "string"
                    and .data.repository.pullRequests.pageInfo.endCursor != "")))
              and length == 1
              and (.[0].data.repository.pullRequests.pageInfo.hasNextPage == false)
              and (
                [.[0].data.repository.pullRequests.nodes[].number] as $numbers
                | ($numbers | length) == ($numbers | unique | length)
              )
            ' >/dev/null
          }
          if pages="$(gh api graphql -f query="$query" 2>/dev/null)" && valid_graphql_pages <<< "$pages"; then
            jq -s '[
              .[].data.repository.pullRequests.nodes[] |
              {
                number, title, headRefName, headRefOid, baseRefOid, isDraft, url,
                statusCheckRollup: []
              }
            ]' <<< "$pages"
            exit 0
          fi
          # Fail closed on malformed REST pages; never turn bad records into an empty report.
          # state=open keeps pagination bounded by active PRs rather than repository history.
          rest_pages="$(gh api --paginate "repos/$repo/pulls?state=open&sort=created&direction=asc&per_page=100")"
          jq -s -e '
            length > 0
            and all(.[];
              type == "array"
              and all(.[];
                type == "object"
                and .state == "open"
                and (.number | type) == "number" and .number > 0 and .number == (.number | floor)
                and (.head.sha | type) == "string" and .head.sha != ""
                and (.base.sha | type) == "string" and .base.sha != ""
              )
            )
            and (
              [.[].[] | .number] as $numbers
              | ($numbers | length) == ($numbers | unique | length)
            )
          ' >/dev/null <<< "$rest_pages" || {
            echo "ERROR: REST open-PR inventory contains malformed pages or records." >&2
            exit 2
          }
          jq -s '[
            add[] |
            {
              number, title,
              headRefName: .head.ref,
              headRefOid: .head.sha,
              baseRefOid: .base.sha,
              isDraft: .draft,
              url: .html_url,
              statusCheckRollup: []
            }
          ]' <<< "$rest_pages"
          FETCH
          cat > "$RUNNER_TEMP/fetch-workflow-runs.sh" <<'RUNS'
          #!/usr/bin/env bash
          set -euo pipefail
          repo="$1"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          : > "$tmp"
          # Bound each reconciliation to the newest 1,000 Actions runs.
          for page in $(seq 1 10); do
            response="$(gh api "repos/$repo/actions/runs?per_page=100&page=$page&sort=created&direction=desc")"
            if ! jq -e '.workflow_runs | type == "array"' <<< "$response" >/dev/null 2>&1; then
              echo "ERROR: malformed Actions history page $page: workflow_runs must be an array." >&2
              exit 2
            fi
            count="$(jq '.workflow_runs | length' <<< "$response")"
            jq -c '.workflow_runs[]? | {
              headSha: .head_sha,
              workflowName: .name,
              displayTitle: .display_title,
              status,
              conclusion,
              createdAt: .created_at,
              url: .html_url,
              pullRequests: [(.pull_requests // [])[]? | {number, base: {sha: (.base.sha // "")}}]
            }' <<< "$response" >> "$tmp"
            if [[ "$count" -lt 100 ]]; then break; fi
          done
          jq -s '.' "$tmp"
          RUNS
          cat > "$RUNNER_TEMP/compare-pr-inventory.sh" <<'COMPARE'
          #!/usr/bin/env bash
          set -euo pipefail
          previous_file="$1"
          latest_file="$2"
          # Diagnose local snapshot failures before invoking jq.
          if [[ ! -f "$previous_file" || ! -r "$previous_file" ]]; then
            echo "ERROR: previous PR inventory snapshot is missing or unreadable: $previous_file" >&2
            exit 2
          fi
          if [[ ! -f "$latest_file" || ! -r "$latest_file" ]]; then
            echo "ERROR: latest PR inventory snapshot is missing or unreadable: $latest_file" >&2
            exit 2
          fi
          # Keep inventories in files: a full JSON snapshot must never be passed in argv.
          set +e
          comparison_result="$(jq -r -s --slurpfile latest "$latest_file" '
            if length != 1 or (.[0] | type) != "array" or ($latest | length) != 1 or ($latest[0] | type) != "array" then
              error("each PR inventory must contain exactly one JSON array")
            else
              .[0] as $previous
              | $latest[0] as $current
              | if (
                  ([$previous[].number] | unique | length) != ($previous | length)
                  or ([$current[].number] | unique | length) != ($current | length)
                  or any($previous[]; (.number | type) != "number" or .number < 1 or .number != (.number | floor) or (.headRefOid | type) != "string" or .headRefOid == "" or (.baseRefOid | type) != "string" or .baseRefOid == "")
                  or any($current[]; (.number | type) != "number" or .number < 1 or .number != (.number | floor) or (.headRefOid | type) != "string" or .headRefOid == "" or (.baseRefOid | type) != "string" or .baseRefOid == "")
                ) then
                  error("PR inventory contains duplicate numbers or incomplete identity")
                else
                  ($current | reduce .[] as $pr ({}; .[($pr.number | tostring)] = $pr)) as $latest_by_number
                  | ($previous | length) == ($current | length)
                    and all($previous[]; . as $old |
                      ($latest_by_number[($old.number | tostring)] // null) as $new |
                      $new != null
                      and $new.headRefOid == $old.headRefOid
                      and $new.baseRefOid == $old.baseRefOid
                    )
                end
            end
          ' "$previous_file")"
          jq_status=$?
          set -e
          if [[ "$jq_status" -ne 0 ]]; then
            echo "ERROR: PR inventory comparison failed (jq exit $jq_status)." >&2
            exit 2
          fi
          case "$comparison_result" in
            true) exit 0 ;; # inventories match
            false) exit 1 ;; # valid inventory delta
            *) echo "ERROR: PR inventory comparison returned unexpected output." >&2; exit 2 ;;
          esac
          COMPARE
          cat > "$RUNNER_TEMP/reconcile-pr-inventory.sh" <<'RECONCILE'
          #!/usr/bin/env bash
          set -euo pipefail
          previous_file="$1"
          latest_file="$2"
          fetch_script="$3"
          comparator="$4"
          repo="$5"
          runs_fetch_script="${6:-}"
          runs_file="${7:-}"
          runs_fetched=false
          comparison_file="$(mktemp)"
          trap 'rm -f "$comparison_file"' EXIT
          # Preserve the caller's initial snapshot; only the private working copy
          # advances between attempts, so UNKNOWN never mutates the original input.
          cp "$previous_file" "$comparison_file"
          previous_working_file="$comparison_file"
          changed_seen=false
          # A close/open during offset pagination can shift an open-only REST page.
          # The initial production inventory is snapshot one. Allow only two
          # additional snapshots: A→B→B stabilizes; A→B→C is UNKNOWN.
          for attempt in 1 2; do
            if ! bash "$fetch_script" "$repo" > "$latest_file"; then
              echo "UNKNOWN: PR inventory fetch failed on reconciliation attempt $attempt." >&2
              exit 1
            fi
            set +e
            bash "$comparator" "$previous_working_file" "$latest_file"
            comparison_status=$?
            set -e
            case "$comparison_status" in
              0)
                if [[ "$attempt" -eq 1 ]] && jq -e 'length > 0' "$latest_file" >/dev/null 2>&1; then
                  # Fetch fallback evidence before the final confirming PR snapshot.
                  if [[ "$runs_fetched" == false && -n "$runs_fetch_script" && -n "$runs_file" ]]; then
                    if runs="$(bash "$runs_fetch_script" "$repo")"; then :; else runs='null'; fi
                    printf '%s\n' "$runs" > "$runs_file"
                    runs_fetched=true
                  fi
                  continue
                fi
                if [[ "$changed_seen" == true ]]; then echo "CHANGED"; else echo "UNCHANGED"; fi
                exit 0
                ;;
              1)
                changed_seen=true
                cp "$latest_file" "$comparison_file"
                previous_working_file="$comparison_file"
                if [[ "$attempt" -eq 1 ]] && jq -e 'length > 0' "$latest_file" >/dev/null 2>&1; then
                  # A PR opened during reconciliation also needs evidence before snapshot 3.
                  if [[ "$runs_fetched" == false && -n "$runs_fetch_script" && -n "$runs_file" ]]; then
                    if runs="$(bash "$runs_fetch_script" "$repo")"; then :; else runs='null'; fi
                    printf '%s\n' "$runs" > "$runs_file"
                    runs_fetched=true
                  fi
                fi
                ;;
              *)
                echo "UNKNOWN: PR inventory comparison failed (exit $comparison_status)." >&2
                exit 1
                ;;
            esac
          done
          echo "UNKNOWN: PR inventory did not stabilize after two additional snapshots (three total)." >&2
          exit 1
          RECONCILE
          cat > "$RUNNER_TEMP/write-reconciliation-failure-summary.sh" <<'SUMMARY'
          #!/usr/bin/env bash
          set -euo pipefail
          summary_file="$1"
          failure_detail="${2:-PR inventory fetch or exact PR/head/base comparison failed.}"
          {
            echo "## ERROR: Dispatcher reconciliation incomplete"
            echo ""
            echo "Reason: $failure_detail"
            echo ""
            echo "Current identity is UNKNOWN; this run is not a successful reconciliation."
          } >> "$summary_file"
          SUMMARY
          cat > "$RUNNER_TEMP/reconcile-and-report.sh" <<'REPORT'
          #!/usr/bin/env bash
          set -euo pipefail
          previous_file="$1"
          latest_file="$2"
          fetch_script="$3"
          comparator="$4"
          repo="$5"
          summary_file="$6"
          runs_fetch_script="${7:-}"
          runs_file="${8:-}"
          reconciliation_error="$RUNNER_TEMP/reconciliation-error.log"
          if result="$(bash "$RUNNER_TEMP/reconcile-pr-inventory.sh" "$previous_file" "$latest_file" "$fetch_script" "$comparator" "$repo" "$runs_fetch_script" "$runs_file" 2>"$reconciliation_error")"; then
            case "$result" in
              UNCHANGED|CHANGED) printf '%s\n' "$result" ;;
              *)
                echo "ERROR: unexpected reconciliation result '$result'." >> "$summary_file"
                exit 1
                ;;
            esac
          else
            failure_detail="$(cat "$reconciliation_error" 2>/dev/null || true)"
            if [[ -z "$failure_detail" ]]; then
              failure_detail="PR inventory reconciliation failed; diagnostic log was unavailable."
            fi
            bash "$RUNNER_TEMP/write-reconciliation-failure-summary.sh" "$summary_file" "$failure_detail"
            exit 1
          fi
          REPORT
          cat > "$RUNNER_TEMP/count-initial-inventory.sh" <<'COUNT'
          #!/usr/bin/env bash
          set -euo pipefail
          snapshot_file="$1"
          summary_file="$2"
          if ! count="$(jq -er 'if type == "array" then length else error("initial PR inventory must be a JSON array") end' "$snapshot_file")"; then
            {
              echo "## ERROR: Dispatcher initial inventory unavailable"
              echo ""
              echo "Initial PR inventory snapshot is unreadable or malformed. Current identity is UNKNOWN; this run is not a successful reconciliation."
            } >> "$summary_file"
            exit 1
          fi
          printf '%s\n' "$count"
          COUNT
          cat > "$RUNNER_TEMP/render-stable-report.sh" <<'STABLE_REPORT'
          #!/usr/bin/env bash
          set -euo pipefail
          prs_file="$1"
          runs_file="$2"
          summary_file="$3"
          if ! jq -e 'type == "array"' "$prs_file" >/dev/null 2>&1; then
            echo "stable PR inventory is not a JSON array" >&2
            exit 2
          fi
          if ! jq -e 'type == "array"' "$runs_file" >/dev/null 2>&1; then
            printf 'null\n' > "$RUNNER_TEMP/stable-report-unavailable-runs.json"
            runs_file="$RUNNER_TEMP/stable-report-unavailable-runs.json"
          fi
          count="$(jq 'length' "$prs_file")"
          if [[ "$count" -eq 0 ]]; then
            {
              echo "# GLAFIRA Project Dispatcher"
              echo ""
              echo "No open pull requests (confirmed by two identical complete snapshots)."
            } >> "$summary_file"
            exit 0
          fi
          {
            echo "# GLAFIRA Project Dispatcher"
            echo ""
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "| PR | Branch | Head SHA | Latest matching CI | Draft |"
            echo "|---:|---|---|---|:---:|"
            bash "$RUNNER_TEMP/render-dispatcher-status.sh" "$prs_file" "$runs_file"
            echo ""
            echo "Policy: historical PR inventory does not request statusCheckRollup; fallback Actions runs require exact PR number, head SHA, and non-empty current base SHA. Formatter metadata-only runs are excluded only for the Java formatter workflow. Workflow history is capped at 1,000 recent runs. No matching evidence is UNKNOWN/not a pass; skipped, cancelled, queued, partial or unknown states are not acceptance passes."
          } >> "$summary_file"
          STABLE_REPORT
          cat > "$RUNNER_TEMP/test-renderer.sh" <<'TEST'
          #!/usr/bin/env bash
          set -euo pipefail
          set -x
          renderer="$RUNNER_TEMP/render-dispatcher-status.sh"
          fetch_prs="$RUNNER_TEMP/fetch-open-prs.sh"
          fetch_runs="$RUNNER_TEMP/fetch-workflow-runs.sh"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/prs.json" <<'JSON'
          [
            {"number":553,"title":"current [link](https://evil.test) | title","headRefName":"docs/reconcile","headRefOid":"sha-current","baseRefOid":"base-current","isDraft":false,"url":"https://example.test/pr/553","statusCheckRollup":[]},
            {"number":554,"title":"stale only","headRefName":"feature/stale","headRefOid":"sha-new","baseRefOid":"base-new","isDraft":true,"url":"https://example.test/pr/554","statusCheckRollup":[]},
            {"number":555,"title":"rollup preferred","headRefName":"feature/rollup","headRefOid":"sha-rollup","baseRefOid":"base-rollup","isDraft":false,"url":"https://example.test/pr/555","statusCheckRollup":[{"name":"required","status":"COMPLETED","conclusion":"SUCCESS","detailsUrl":"https://example.test/check"}]},
            {"number":556,"title":"queued exact head","headRefName":"feature/queued","headRefOid":"sha-queued","baseRefOid":"base-queued","isDraft":false,"url":"https://example.test/pr/556","statusCheckRollup":[]},
            {"number":557,"title":"skipped exact head","headRefName":"feature/skipped","headRefOid":"sha-skipped","baseRefOid":"base-skipped","isDraft":false,"url":"https://example.test/pr/557","statusCheckRollup":[]},
            {"number":558,"title":"in progress exact head","headRefName":"feature/in-progress","headRefOid":"sha-progress","baseRefOid":"base-progress","isDraft":false,"url":"https://example.test/pr/558","statusCheckRollup":[]},
            {"number":559,"title":"cancelled exact head","headRefName":"feature/cancelled","headRefOid":"sha-cancelled","baseRefOid":"base-cancelled","isDraft":false,"url":"https://example.test/pr/559","statusCheckRollup":[]},
            {"number":560,"title":"failed exact head","headRefName":"feature/failed","headRefOid":"sha-failed","baseRefOid":"base-failed","isDraft":false,"url":"https://example.test/pr/560","statusCheckRollup":[]},
            {"number":562,"title":"metadata run must not hide validation","headRefName":"feature/metadata","headRefOid":"sha-meta","baseRefOid":"base-meta-562","isDraft":false,"url":"https://example.test/pr/562","statusCheckRollup":[]},
            {"number":563,"title":"same head different base","headRefName":"feature/other-base","headRefOid":"sha-meta","baseRefOid":"base-meta-563","isDraft":false,"url":"https://example.test/pr/563","statusCheckRollup":[]},
            {"number":564,"title":"same head and base different PR","headRefName":"feature/other-pr","headRefOid":"sha-meta","baseRefOid":"base-meta-562","isDraft":false,"url":"https://example.test/pr/564","statusCheckRollup":[]},
            {"number":565,"title":"metadata-looking commit title","headRefName":"feature/title","headRefOid":"sha-title","baseRefOid":"base-title","isDraft":false,"url":"https://example.test/pr/565","statusCheckRollup":[]},
            {"number":566,"title":"metadata rollup falls back","headRefName":"feature/metadata-rollup","headRefOid":"sha-meta-rollup","baseRefOid":"base-meta-rollup","isDraft":false,"url":"https://example.test/pr/566","statusCheckRollup":[{"name":"PR metadata edit — formatter not run","status":"COMPLETED","conclusion":"SKIPPED","detailsUrl":"https://example.test/metadata"}]}
          ]
          JSON
          cat > "$tmp/runs.json" <<'JSON'
          [
            {"headSha":"sha-current","workflowName":"Android CI","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:00:00Z","url":"https://example.test/run/android-new","pullRequests":[{"number":553,"base":{"sha":"base-current"}}]},
            {"headSha":"sha-current","workflowName":"Android CI","status":"completed","conclusion":"failure","createdAt":"2026-11-24T11:00:00Z","url":"https://example.test/run/android-old","pullRequests":[{"number":553,"base":{"sha":"base-current"}}]},
            {"headSha":"sha-current","workflowName":"Android CI","status":"completed","conclusion":"success","createdAt":"2026-11-24T13:00:00Z","url":"https://example.test/run/wrong-base","pullRequests":[{"number":553,"base":{"sha":"other-base"}}]},
            {"headSha":"sha-current","workflowName":"Android CI","status":"completed","conclusion":"failure","createdAt":"2026-11-24T14:00:00Z","url":"https://example.test/run/wrong-pr","pullRequests":[{"number":564,"base":{"sha":"base-current"}}]},
            {"headSha":"sha-other","workflowName":"Android CI","status":"completed","conclusion":"success","createdAt":"2026-11-24T12:02:00Z","url":"https://example.test/run/stale","pullRequests":[{"number":553,"base":{"sha":"base-current"}}]},
            {"headSha":"sha-queued","workflowName":"Desktop CI","status":"queued","conclusion":null,"createdAt":"2026-11-24T12:03:00Z","url":"https://example.test/run/queued","pullRequests":[{"number":556,"base":{"sha":"base-queued"}}]},
            {"headSha":"sha-skipped","workflowName":"iOS CI","status":"completed","conclusion":"skipped","createdAt":"2026-11-24T12:04:00Z","url":"https://example.test/run/skipped","pullRequests":[{"number":557,"base":{"sha":"base-skipped"}}]},
