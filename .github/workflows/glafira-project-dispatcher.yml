name: GLAFIRA Project Dispatcher

on:
  push:
    branches:
      - glafira/project-dispatcher-v1
  workflow_run:
    workflows:
      - GLAFIRA CI — change-aware platform validation
      - GLAFIRA Windows Agent
      - GLAFIRA Java Format Check
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  # Never let a later event replace a pending PR test or workflow-completion reconciliation.
  group: ${{ github.event_name == 'pull_request' && format('glafira-project-dispatcher-pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_run' && format('glafira-project-dispatcher-workflow-run-{0}', github.event.workflow_run.id) || format('glafira-project-dispatcher-run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  project-status:
    name: Reconcile all active GLAFIRA workstreams
    runs-on: ubuntu-latest
    steps:
      - name: Prepare and test exact-head renderer
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/render-dispatcher-status.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          prs_file="$1"
          runs_file="$2"
          prs="$(cat "$prs_file")"
          runs="$(cat "$runs_file")"
          if ! jq -e 'type == "array"' >/dev/null 2>&1 <<< "$prs"; then
            echo "pull request input must be a JSON array" >&2
            exit 2
          fi
          while IFS= read -r pr; do
            number="$(jq -r '.number' <<< "$pr")"
            # PR titles and branch names are contributor-controlled: strip Markdown syntax.
            title="$(jq -r '.title // "" | gsub("https?://[^ )]+"; "") | gsub("[|]"; "/") | gsub("[^[:alnum:] _.,:;!?-]"; " ")' <<< "$pr")"
            branch="$(jq -r '.headRefName // "" | gsub("[^[:alnum:] _.,:/-]"; " ")' <<< "$pr")"
            sha="$(jq -r '.headRefOid // ""' <<< "$pr")"
            base_sha="$(jq -r '.baseRefOid // ""' <<< "$pr")"
            draft="$(jq -r '.isDraft // false' <<< "$pr")"
            url="$(jq -r '.url // ""' <<< "$pr")"
            checks="$(jq -c '[.statusCheckRollup[]? | select(((.name // .context // "") | contains("PR metadata edit")) | not)]' <<< "$pr")"
            if [[ "$(jq 'length' <<< "$checks")" -gt 0 ]]; then
              ci="HEAD-ONLY / BASE NOT VERIFIED: $(jq -r 'map("\(.name // .context // "check"): \(.status // .state // "unknown")/\(.conclusion // "pending") ([check](\(.detailsUrl // .targetUrl // "")))") | join("<br>")' <<< "$checks")"
            elif ! jq -e 'type == "array"' >/dev/null 2>&1 <<< "$runs"; then
              ci="UNKNOWN / ACTIONS API UNAVAILABLE"
            else
              matching="$(jq -c --arg sha "$sha" --arg base "$base_sha" --argjson number "$number" '
                [.[] |
                  select(.headSha == $sha) |
                  select($base != "" and any((.pullRequests // [])[]?; .number == $number and (.base.sha // "") != "" and .base.sha == $base)) |
                  select((.workflowName // .name // "") != "GLAFIRA Java Format Check" or ((.displayTitle // "") | startswith("METADATA_ONLY -") | not))
                ] | sort_by(.createdAt // "") | reverse | group_by(.workflowName // .name // "unknown") | map(.[0])
              ' <<< "$runs")"
              if [[ "$(jq 'length' <<< "$matching")" -eq 0 ]]; then
                ci="NO MATCHING RUN FOR EXACT PR/HEAD/BASE"
              else
                ci="$(jq -r 'map((.workflowName // .name // "workflow") + ": " + (if .status == "queued" then "QUEUED" elif .status == "in_progress" then "IN_PROGRESS" elif .status == "completed" then ("COMPLETED/" + (.conclusion // "UNKNOWN")) else "UNKNOWN/" + (.status // "missing") end) + " ([run](\(.url // "")))") | join("<br>")' <<< "$matching")"
              fi
            fi
            short_sha="$(cut -c1-12 <<< "$sha")"
            echo "| [#$number]($url) $title | <code>$branch</code> | <code>$short_sha</code> | $ci | $draft |"
          done < <(jq -c '.[]' <<< "$prs")
          SCRIPT

          cat > "$RUNNER_TEMP/fetch-open-prs.sh" <<'FETCH'
          #!/usr/bin/env bash
          set -euo pipefail
          repo="$1"
          gh_bin="${GLAFIRA_GH_BIN:-gh}"
          query='query($endCursor: String) {
            repository(owner: "micronizationlab", name: "glafira-ai-hub") {
              pullRequests(first: 100, after: $endCursor, states: OPEN, orderBy: {field: CREATED_AT, direction: DESC}) {
                totalCount
                pageInfo { hasNextPage endCursor }
                nodes {
                  number title headRefName headRefOid baseRefOid isDraft url
                  statusCheckRollup { contexts(first: 100) { nodes {
                    __typename
                    ... on CheckRun { name status conclusion detailsUrl }
                    ... on StatusContext { context state targetUrl }
                  } } }
                }
              }
            }
          }'
          boundary_query='query {
            repository(owner: "micronizationlab", name: "glafira-ai-hub") {
              pullRequests(first: 1, states: OPEN, orderBy: {field: CREATED_AT, direction: DESC}) {
                totalCount
                nodes { number }
              }
            }
          }'
          tmp="$(mktemp -d "$RUNNER_TEMP/glafira-open-prs.XXXXXX")"
          trap 'rm -rf "$tmp"' EXIT

          for attempt in 1 2; do
            graphql_error="$tmp/graphql-error-$attempt.log"
            validation_error="$tmp/validation-error-$attempt.log"
            count_error="$tmp/count-error-$attempt.log"
            projection_error="$tmp/projection-error-$attempt.log"
            projection_file="$tmp/projection-$attempt.json"
            boundary_error="$tmp/boundary-error-$attempt.log"

            if pages="$("$gh_bin" api graphql --paginate -f query="$query" 2>"$graphql_error")"; then
              if jq -s -e '
                length > 0
                and all(.[]; (.data.repository.pullRequests.nodes | type) == "array"
                  and .data.repository.pullRequests.pageInfo != null
                  and (.data.repository.pullRequests.totalCount | type) == "number")
                and (.[-1].data.repository.pullRequests.pageInfo.hasNextPage == false)
              ' >/dev/null 2>"$validation_error" <<< "$pages"; then
                if jq -s -e '
                  . as $pages
                  | ($pages[0].data.repository.pullRequests.totalCount) as $total
                  | ([$pages[].data.repository.pullRequests.nodes[]] | length) as $node_count
                  | all($pages[]; .data.repository.pullRequests.totalCount == $total)
                  and ($node_count == $total)
                ' >/dev/null 2>"$count_error" <<< "$pages"; then
                  if jq -s '[
                    .[].data.repository.pullRequests.nodes[] |
                    {
                      number, title, headRefName, headRefOid, baseRefOid, isDraft, url,
                      statusCheckRollup: [
                        .statusCheckRollup.contexts.nodes[]? |
                        {
                          name: (.name // .context // "check"),
                          status: (.status // .state // "unknown"),
                          conclusion: (.conclusion // null),
                          detailsUrl: (.detailsUrl // .targetUrl // "")
                        }
                      ]
                    }
                  ]' <<< "$pages" > "$projection_file" 2>"$projection_error"; then
                    expected_total="$(jq -s -r '.[0].data.repository.pullRequests.totalCount' <<< "$pages")"
                    expected_boundary="$(jq -s -r '.[0].data.repository.pullRequests.nodes[0].number // empty' <<< "$pages")"
                    if boundary="$("$gh_bin" api graphql -f query="$boundary_query" 2>"$boundary_error")"; then
                      if jq -e --argjson total "$expected_total" --arg boundary "$expected_boundary" '
                        .data.repository.pullRequests.totalCount == $total
                        and ((.data.repository.pullRequests.nodes[0].number // "") | tostring) == $boundary
                      ' >/dev/null <<< "$boundary"; then
                        cat "$projection_file"
                        exit 0
                      fi
                      if [[ "$attempt" -eq 1 ]]; then continue; fi
                      printf 'UNKNOWN: Open-PR inventory boundary changed during both cursor scans; no complete stable snapshot is available.\n' >&2
                      exit 1
                    else
                      boundary_status=$?
                      boundary_detail="$(tail -n 3 "$boundary_error" 2>/dev/null | tr '\n' ' ' | sed -E 's/(gh[pousr]_[A-Za-z0-9_-]{20,}|github_pat_[A-Za-z0-9_-]{20,}|[Bb][Ee][Aa][Rr][Ee][Rr] [^ ]+)/[REDACTED]/g')"
                      printf 'UNKNOWN: GraphQL open-PR boundary verification failed (exit %s). %s\n' \
                        "$boundary_status" "${boundary_detail:-No boundary-query stderr was captured.}" >&2
                      exit 1
                    fi
                  else
                    projection_status=$?
                    projection_detail="$(tail -n 3 "$projection_error" 2>/dev/null | tr '\n' ' ' | sed -E 's/(gh[pousr]_[A-Za-z0-9_-]{20,}|github_pat_[A-Za-z0-9_-]{20,}|[Bb][Ee][Aa][Rr][Ee][Rr] [^ ]+)/[REDACTED]/g')"
                    printf 'UNKNOWN: GraphQL open-PR projection failed (jq exit %s). %s\n' \
                      "$projection_status" "${projection_detail:-No jq projection stderr was captured.}" >&2
                    exit 1
                  fi
                else
                  count_status=$?
                  if [[ "$count_status" -eq 1 && "$attempt" -eq 1 ]]; then continue; fi
                  count_detail="$(tail -n 3 "$count_error" 2>/dev/null | tr '\n' ' ' | sed -E 's/(gh[pousr]_[A-Za-z0-9_-]{20,}|github_pat_[A-Za-z0-9_-]{20,}|[Bb][Ee][Aa][Rr][Ee][Rr] [^ ]+)/[REDACTED]/g')"
                  printf 'UNKNOWN: Cursor-page totalCount did not reconcile across both scans (jq exit %s). %s\n' \
                    "$count_status" "${count_detail:-Inventory counts changed or did not match the returned nodes.}" >&2
                  exit 1
                fi
              else
                validation_status=$?
                validation_detail="$(tail -n 3 "$validation_error" 2>/dev/null | tr '\n' ' ' | sed -E 's/(gh[pousr]_[A-Za-z0-9_-]{20,}|github_pat_[A-Za-z0-9_-]{20,}|[Bb][Ee][Aa][Rr][Ee][Rr] [^ ]+)/[REDACTED]/g')"
                printf 'UNKNOWN: GraphQL open-PR response failed schema/completeness validation (jq exit %s). %s\n' \
                  "$validation_status" "${validation_detail:-No jq validation stderr was captured.}" >&2
                exit 1
              fi
            else
              graphql_status=$?
              graphql_detail="$(tail -n 3 "$graphql_error" 2>/dev/null | tr '\n' ' ' | sed -E 's/(gh[pousr]_[A-Za-z0-9_-]{20,}|github_pat_[A-Za-z0-9_-]{20,}|[Bb][Ee][Aa][Rr][Ee][Rr] [^ ]+)/[REDACTED]/g')"
              printf 'UNKNOWN: GraphQL cursor-based open-PR inventory unavailable (exit %s); REST offset fallback is disabled. %s\n' \
                "$graphql_status" "${graphql_detail:-No GraphQL stderr was captured.}" >&2
              exit 1
            fi
          done
          exit 1
          FETCH

          cat > "$RUNNER_TEMP/fetch-workflow-runs.sh" <<'RUNS'
          #!/usr/bin/env bash
          set -euo pipefail
          repo="$1"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          : > "$tmp"
          # Bound each reconciliation to the newest 1,000 Actions runs.
          for page in $(seq 1 10); do
            response="$(gh api "repos/$repo/actions/runs?per_page=100&page=$page&sort=created&direction=desc")"
            count="$(jq '.workflow_runs | length' <<< "$response")"
            jq -c '.workflow_runs[]? | {
              headSha: .head_sha,
              workflowName: .name,
              displayTitle: .display_title,
              status,
              conclusion,
              createdAt: .created_at,
              url: .html_url,
              pullRequests: [(.pull_requests // [])[]? | {number, base: {sha: (.base.sha // "")}}]
            }' <<< "$response" >> "$tmp"
            if [[ "$count" -lt 100 ]]; then break; fi
          done
          jq -s '.' "$tmp"
          RUNS
          cat > "$RUNNER_TEMP/compare-pr-inventory.sh" <<'COMPARE'
          #!/usr/bin/env bash
          set -euo pipefail
          previous_file="$1"
          latest_file="$2"
          [[ "$previous_file" != "-" && -f "$previous_file" && -r "$previous_file" ]] || { echo "ERROR: previous PR snapshot must be a readable regular file." >&2; exit 2; }
          [[ "$latest_file" != "-" && -f "$latest_file" && -r "$latest_file" ]] || { echo "ERROR: latest PR snapshot must be a readable regular file." >&2; exit 2; }
          # Keep inventories in files: a full JSON snapshot must never be passed in argv.
          set +e
          comparison_result="$(jq -r -s --slurpfile latest "$latest_file" '
            if length != 1 or (.[0] | type) != "array" or ($latest | length) != 1 or ($latest[0] | type) != "array" then
              error("each PR inventory must contain exactly one JSON array")
            else
              .[0] as $previous
              | $latest[0] as $current
              | if (
                  ([$previous[].number] | unique | length) != ($previous | length)
                  or ([$current[].number] | unique | length) != ($current | length)
                  or any($previous[]; (.number | type) != "number" or .number < 1 or .number != (.number | floor) or (.headRefOid | type) != "string" or .headRefOid == "" or (.baseRefOid | type) != "string" or .baseRefOid == "")
                  or any($current[]; (.number | type) != "number" or .number < 1 or .number != (.number | floor) or (.headRefOid | type) != "string" or .headRefOid == "" or (.baseRefOid | type) != "string" or .baseRefOid == "")
                ) then
                  error("PR inventory contains duplicate numbers or incomplete identity")
                else
                  ($current | reduce .[] as $pr ({}; .[($pr.number | tostring)] = $pr)) as $latest_by_number
                  | ($previous | length) == ($current | length)
                    and all($previous[]; . as $old |
                      ($latest_by_number[($old.number | tostring)] // null) as $new |
                      $new != null
                      and $new.headRefOid == $old.headRefOid
                      and $new.baseRefOid == $old.baseRefOid
                    )
                end
            end
          ' "$previous_file")"
          jq_status=$?
          set -e
          if [[ "$jq_status" -ne 0 ]]; then
            echo "ERROR: PR inventory comparison failed (jq exit $jq_status)." >&2
            exit 2
          fi
          case "$comparison_result" in
            true) exit 0 ;; # inventories match
            false) exit 1 ;; # valid inventory delta
            *) echo "ERROR: PR inventory comparison returned unexpected output." >&2; exit 2 ;;
          esac
          COMPARE
          cat > "$RUNNER_TEMP/reconcile-pr-inventory.sh" <<'RECONCILE'
          #!/usr/bin/env bash
          set -euo pipefail
          previous_file="$1"
          latest_file="$2"
          fetch_script="$3"
          comparator="$4"
          repo="$5"
          [[ -f "$comparator" && -r "$comparator" ]] && bash -n "$comparator" || { echo "UNKNOWN: comparator is missing, unreadable or invalid." >&2; exit 1; }
          : > "$latest_file" || { echo "UNKNOWN: cannot open second PR snapshot '$latest_file'." >&2; exit 1; }
          if ! bash "$fetch_script" "$repo" > "$latest_file"; then
            echo "UNKNOWN: second PR inventory fetch failed." >&2
            exit 1
          fi
          set +e
          bash "$comparator" "$previous_file" "$latest_file"
          comparison_status=$?
          set -e
          case "$comparison_status" in
            0) echo "UNCHANGED" ;;
            1) echo "CHANGED" ;;
            *) echo "UNKNOWN: PR inventory comparison failed (exit $comparison_status)." >&2; exit 1 ;;
          esac
          RECONCILE
          cat > "$RUNNER_TEMP/write-dispatcher-error-summary.sh" <<'ERROR_SUMMARY'
          #!/usr/bin/env bash
          set -euo pipefail
          summary="$1"
          message="$2"
          {
            echo "## ERROR: Dispatcher reconciliation incomplete"
            echo ""
            echo "$message"
            echo "Current identity is UNKNOWN; this run is not a successful reconciliation."
          } >> "$summary"
          exit 1
          ERROR_SUMMARY
          chmod +x "$RUNNER_TEMP/write-dispatcher-error-summary.sh"
          cat > "$RUNNER_TEMP/build-dispatcher-status-report.sh" <<'REPORT'
          #!/usr/bin/env bash
          set -euo pipefail
          summary="${GITHUB_STEP_SUMMARY:?}"
          repo="${GH_REPO:?}"
          report_tmp="$(mktemp -d "$RUNNER_TEMP/glafira-report.XXXXXX")"
          trap 'rm -rf "$report_tmp"' EXIT
          initial="$report_tmp/open-prs.initial.json"
          reconciled="$report_tmp/open-prs.latest.json"
          final="$report_tmp/open-prs.final.json"
          runs="$report_tmp/workflow-runs.json"
          fail() {
            bash "$RUNNER_TEMP/write-dispatcher-error-summary.sh" "$summary" "$1" || true
            exit 1
          }

          : > "$initial" || fail "Cannot open initial PR snapshot '$initial'."
          if ! bash "$RUNNER_TEMP/fetch-open-prs.sh" "$repo" > "$initial"; then
            fail "Initial GraphQL cursor-based open-PR inventory is unavailable; no status is reported as passing."
          fi
          if ! jq -e 'type == "array"' "$initial" >/dev/null; then
            fail "Initial open-PR snapshot is malformed or is not a JSON array."
          fi

          if ! reconciliation_result="$(bash "$RUNNER_TEMP/reconcile-pr-inventory.sh" "$initial" "$reconciled" "$RUNNER_TEMP/fetch-open-prs.sh" "$RUNNER_TEMP/compare-pr-inventory.sh" "$repo")"; then
            fail "Second PR inventory fetch or exact PR/head/base comparison failed."
          fi
          case "$reconciliation_result" in
            UNCHANGED) reconciliation_note="Initial and second PR inventories match." ;;
            CHANGED) reconciliation_note="PR inventory changed during initial reconciliation; using the second snapshot." ;;
            *) fail "Unexpected PR inventory reconciliation result '$reconciliation_result'." ;;
          esac

          latest_count="$(jq 'length' "$reconciled")"
          if [[ "$latest_count" -gt 0 ]]; then
            if ! bash "$RUNNER_TEMP/fetch-workflow-runs.sh" "$repo" > "$runs"; then
              fail "Actions run inventory fetch failed; no PR status is reported as passing."
            fi
          else
            printf '[]\n' > "$runs"
          fi

          # Refresh after Actions history retrieval. Render only against this final
          # identity snapshot so a changed head/base cannot inherit stale CI success.
          : > "$final" || fail "Cannot open final PR snapshot '$final'."
          if ! bash "$RUNNER_TEMP/fetch-open-prs.sh" "$repo" > "$final"; then
            fail "Final PR inventory refresh after Actions history retrieval failed."
          fi
          if ! jq -e 'type == "array"' "$final" >/dev/null; then
            fail "Final PR snapshot is malformed or is not a JSON array."
          fi
          set +e
          bash "$RUNNER_TEMP/compare-pr-inventory.sh" "$reconciled" "$final"
          final_comparison_status=$?
          set -e
          case "$final_comparison_status" in
            0) final_note="PR inventory remained stable during Actions history retrieval." ;;
            1) final_note="PR inventory changed during Actions history retrieval; rendering the final snapshot." ;;
            *) fail "Final PR inventory comparison failed (exit $final_comparison_status)." ;;
          esac

          final_count="$(jq 'length' "$final")"
          if [[ "$final_count" -gt 0 && "$latest_count" -eq 0 ]]; then
            if ! bash "$RUNNER_TEMP/fetch-workflow-runs.sh" "$repo" > "$runs"; then
              fail "Actions run inventory fetch failed after new PRs appeared; no status is reported as passing."
            fi
            : > "$final" || fail "Cannot reopen final PR snapshot '$final'."
            if ! bash "$RUNNER_TEMP/fetch-open-prs.sh" "$repo" > "$final"; then
              fail "Final PR inventory refresh after late Actions history retrieval failed."
            fi
            if ! jq -e 'type == "array"' "$final" >/dev/null; then
              fail "Final PR snapshot after late history retrieval is malformed."
            fi
          fi

          final_count="$(jq 'length' "$final")"
          if [[ "$final_count" -eq 0 ]]; then
            {
              echo "# GLAFIRA Project Dispatcher"
              echo ""
              echo "No open pull requests."
              echo ""
              echo "$reconciliation_note"
              echo "$final_note"
              echo "Policy: \`NO MATCHING RUN FOR EXACT PR/HEAD/BASE\` is UNKNOWN, not a pass. Fallback Actions history is bounded to the newest 1,000 runs."
            } >> "$summary"
            exit 0
          fi

          {
            echo "# GLAFIRA Project Dispatcher"
            echo ""
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "$reconciliation_note"
            echo "$final_note"
            echo ""
            echo "| PR | Branch | Head SHA | Latest matching CI | Draft |"
            echo "|---:|---|---|---|:---:|"
            bash "$RUNNER_TEMP/render-dispatcher-status.sh" "$final" "$runs"
            echo ""
            echo "Policy: GraphQL cursor pagination is authoritative; REST offset fallback is disabled. Fallback Actions runs require exact PR number, head SHA, and non-empty current base SHA. \`NO MATCHING RUN FOR EXACT PR/HEAD/BASE\` is UNKNOWN, not a pass; fallback history is bounded to the newest 1,000 runs. Skipped, cancelled, queued, partial or unknown states are not acceptance passes."
          } >> "$summary"
          REPORT
          chmod +x "$RUNNER_TEMP/build-dispatcher-status-report.sh"
          cat > "$RUNNER_TEMP/test-renderer.sh" <<'TEST'
          #!/usr/bin/env bash
          set -euo pipefail
          # An exported gh shell function would override PATH-based fake executables in child Bash processes.
          unset -f gh 2>/dev/null || true
          trap 'status=$?; failed_command="$(printf "%s" "$BASH_COMMAND" | sed -E "s/(gh[pousr]_[A-Za-z0-9_-]{10,}|github_pat_[A-Za-z0-9_-]{10,}|[Bb][Ee][Aa][Rr][Ee][Rr] [^ ]+)/[REDACTED]/g")"; printf "dispatcher renderer fixture failed (exit %s): %s\\n" "$status" "$failed_command" >&2' ERR
          renderer="$RUNNER_TEMP/render-dispatcher-status.sh"
          fetch_prs="$RUNNER_TEMP/fetch-open-prs.sh"
          fetch_runs="$RUNNER_TEMP/fetch-workflow-runs.sh"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/prs.json" <<'JSON'
          [
            {"number":553,"title":"current [link](https://evil.test) | title","headRefName":"docs/reconcile","headRefOid":"sha-current","baseRefOid":"base-current","isDraft":false,"url":"https://example.test/pr/553","statusCheckRollup":[]},
            {"number":554,"title":"stale only","headRefName":"feature/stale","headRefOid":"sha-new","baseRefOid":"base-new","isDraft":true,"url":"https://example.test/pr/554","statusCheckRollup":[]},
            {"number":555,"title":"rollup preferred","headRefName":"feature/rollup","headRefOid":"sha-rollup","baseRefOid":"base-rollup","isDraft":false,"url":"https://example.test/pr/555","statusCheckRollup":[{"name":"required","status":"COMPLETED","conclusion":"SUCCESS","detailsUrl":"https://example.test/check"}]},
            {"number":556,"title":"queued exact head","headRefName":"feature/queued","headRefOid":"sha-queued","baseRefOid":"base-queued","isDraft":false,"url":"https://example.test/pr/556","statusCheckRollup":[]},
            {"number":557,"title":"skipped exact head","headRefName":"feature/skipped","headRefOid":"sha-skipped","baseRefOid":"base-skipped","isDraft":false,"url":"https://example.test/pr/557","statusCheckRollup":[]},
            {"number":558,"title":"in progress exact head","headRefName":"feature/in-progress","headRefOid":"sha-progress","baseRefOid":"base-progress","isDraft":false,"url":"https://example.test/pr/558","statusCheckRollup":[]},
            {"number":559,"title":"cancelled exact head","headRefName":"feature/cancelled","headRefOid":"sha-cancelled","baseRefOid":"base-cancelled","isDraft":false,"url":"https://example.test/pr/559","statusCheckRollup":[]},
            {"number":560,"title":"failed exact head","headRefName":"feature/failed","headRefOid":"sha-failed","baseRefOid":"base-failed","isDraft":false,"url":"https://example.test/pr/560","statusCheckRollup":[]},
            {"number":562,"title":"metadata run must not hide validation","headRefName":"feature/metadata","headRefOid":"sha-meta","baseRefOid":"base-meta-562","isDraft":false,"url":"https://example.test/pr/562","statusCheckRollup":[]},
            {"number":563,"title":"same head different base","headRefName":"feature/other-base","headRefOid":"sha-meta","baseRefOid":"base-meta-563","isDraft":false,"url":"https://example.test/pr/563","statusCheckRollup":[]},
            {"number":564,"title":"same head and base different PR","headRefName":"feature/other-pr","headRefOid":"sha-meta","baseRefOid":"base-meta-562","isDraft":false,"url":"https://example.test/pr/564","statusCheckRollup":[]},
            {"number":565,"title":"metadata-looking commit title","headRefName":"feature/title","headRefOid":"sha-title","baseRefOid":"base-title","isDraft":false,"url":"https://example.test/pr/565","statusCheckRollup":[]},
            {"number":566,"title":"metadata rollup falls back","headRefName":"feature/metadata-rollup","headRefOid":"sha-meta-rollup","baseRefOid":"base-meta-rollup","isDraft":false,"url":"https://example.test/pr/566","statusCheckRollup":[{"name":"PR metadata edit — formatter not run","status":"COMPLETED","conclusion":"SKIPPED","detailsUrl":"https://example.test/metadata"}]}
          ]
          JSON
