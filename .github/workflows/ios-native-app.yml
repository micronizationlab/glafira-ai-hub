name: GLAFIRA iOS native app

on:
  pull_request:
    paths:
      - "ios/**"
      - "contracts/v1/**"
      - "release/**"
      - ".github/scripts/release_manifest.py"
      - ".github/workflows/ios-native-app.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "contracts/v1/**"
      - "release/**"
      - ".github/scripts/release_manifest.py"
      - ".github/workflows/ios-native-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glafira-ios-native-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-package-and-app:
    name: Swift package tests and iOS simulator app build
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Validate canonical release plan
        run: python3 .github/scripts/release_manifest.py validate-plan --plan release/release-plan.json --root .

      - name: Run BridgeKit unit tests
        working-directory: ios/GlafiraBridgeKit
        run: swift test

      - name: Build native GLAFIRA app for iOS Simulator
        run: |
          xcodebuild \
            -project ios/GLAFIRA.xcodeproj \
            -scheme GLAFIRA \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/GLAFIRA-iOS-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify simulator app bundle exists
        run: |
          test -d "$RUNNER_TEMP/GLAFIRA-iOS-DerivedData/Build/Products/Debug-iphonesimulator/GLAFIRA.app"
