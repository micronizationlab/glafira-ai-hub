name: GLAFIRA AI HUB Android and Desktop Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest validation run for a PR/branch; stale runs waste emulator capacity.
concurrency:
  group: glafira-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9 and cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest :desktop-bridge:test

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glafira-jvm-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            desktop-bridge/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 7

  instrumented-tests:
    name: Android Emulator Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9 and cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Core persistence and backup tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set +e
            mkdir -p app/build/outputs
            gradle connectedDebugAndroidTest
            test_status=$?
            adb logcat -d -v threadtime > app/build/outputs/androidTest-logcat.txt 2>&1 || true
            exit "$test_status"

      - name: Upload emulator test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glafira-emulator-test-diagnostics
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-logcat.txt
          if-no-files-found: warn
          retention-days: 7

  debug-apk:
    name: Build installable debug APK
    needs: [unit-tests, instrumented-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9 and cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: glafira-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

# This is an unsigned debug/test APK for owner-controlled device acceptance only.
# It is not a production release and does not enable LIVE autonomous execution.
