name: GLAFIRA AI HUB Android Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9 and cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest

      - name: Run Android security instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          script: gradle connectedDebugAndroidTest

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: glafira-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check for owner release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.GLAFIRA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GLAFIRA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GLAFIRA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GLAFIRA_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/glafira-release.jks"
            chmod 600 "$RUNNER_TEMP/glafira-release.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Owner signing key is not configured; only a debug APK will be produced. This build cannot be updated in place."
          fi

      - name: Build stable-signed owner-test APK
        if: steps.signing.outputs.available == 'true'
        env:
          GLAFIRA_KEYSTORE_PATH: ${{ runner.temp }}/glafira-release.jks
          GLAFIRA_KEYSTORE_PASSWORD: ${{ secrets.GLAFIRA_KEYSTORE_PASSWORD }}
          GLAFIRA_KEY_ALIAS: ${{ secrets.GLAFIRA_KEY_ALIAS }}
          GLAFIRA_KEY_PASSWORD: ${{ secrets.GLAFIRA_KEY_PASSWORD }}
        run: |
          VERSION_CODE="$(git rev-list --count HEAD)"
          gradle assembleRelease -PglafiraVersionCode="$VERSION_CODE" -PglafiraVersionName="test-$GITHUB_SHA"
          mkdir -p app/build/outputs/apk/owner-test
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/owner-test/glafira-$VERSION_CODE.apk"

      - name: Upload stable-signed owner-test APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: glafira-owner-test-signed-apk
          path: app/build/outputs/apk/owner-test/glafira-*.apk
          if-no-files-found: error
          retention-days: 14
