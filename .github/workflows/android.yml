name: GLAFIRA AI HUB Android and Desktop Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Intentionally no concurrency group: GitHub retains only one pending run
# per group and replaces an older pending run when a newer run arrives.
# These validation runs must all execute; allow GitHub's normal runner queue
# to queue each run without cancelling or superseding earlier checks.

jobs:
  unit-tests:
    name: Android Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9 and cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check CI failure and cleanup regressions
        run: python3 -m unittest discover -s .github/scripts/tests -v

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest :desktop-bridge:test --stacktrace

      - name: Verify both JVM test suites executed
        run: >-
          python3 .github/scripts/verify-junit.py
          app/build/test-results/testDebugUnitTest
          desktop-bridge/build/test-results/test

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glafira-jvm-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            desktop-bridge/build/reports/tests/test/
            desktop-bridge/build/test-results/test/
          if-no-files-found: warn
          retention-days: 7

  instrumented-tests:
    name: Android Emulator Integration Tests
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9 and cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable Android KVM acceleration
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo "This runner has no /dev/kvm; hardware-accelerated Android tests cannot run" >&2
            exit 1
          fi
          # This permission change is confined to the disposable hosted runner.
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Run Core persistence and backup tests
        shell: bash
        run: bash .github/scripts/run-android-instrumentation.sh

      - name: Upload emulator test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glafira-emulator-test-diagnostics
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/outputs/androidTest-*.txt
          if-no-files-found: warn
          retention-days: 7

  debug-apk:
    name: Build installable debug APK
    needs: [unit-tests, instrumented-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9 and cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: glafira-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

# This is a debug-key-signed test APK for owner-controlled device acceptance only.
# It is not a production release and does not enable LIVE autonomous execution.
