name: GLAFIRA Contract Conformance

on:
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-conformance:
    name: Contract schema and signing fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install JSON Schema validator
        run: npm install --no-save --no-package-lock ajv@8 ajv-formats@3
      - name: Validate message fixtures and Bridge HMAC golden vector
        run: node contracts/v1/verify-fixtures.mjs

  generate-cross-platform-models:
    name: Generate Kotlin, Swift and C# contract DTOs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned quicktype generator
        run: npm install --no-save --no-package-lock quicktype@26.0.0
      - name: Generate platform DTOs from the canonical schema
        run: node contracts/v1/generate-models.mjs
      - name: Publish generated DTO bundle
        uses: actions/upload-artifact@v4
        with:
          name: glafira-contract-dtos-${{ github.sha }}
          path: contracts/v1/generated/
          if-no-files-found: error
          retention-days: 14

  compile-kotlin-dtos:
    name: Compile generated Kotlin DTOs
    needs: generate-cross-platform-models
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download generated DTOs
        uses: actions/download-artifact@v4
        with:
          name: glafira-contract-dtos-${{ github.sha }}
          path: contracts/v1/generated
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile generated Kotlin models
        run: gradle -p contracts/v1/verification/kotlin test --no-daemon --stacktrace

  compile-swift-dtos:
    name: Compile generated Swift DTOs
    needs: generate-cross-platform-models
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download generated DTOs
        uses: actions/download-artifact@v4
        with:
          name: glafira-contract-dtos-${{ github.sha }}
          path: contracts/v1/generated
      - name: Show Apple toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Compile generated Swift models
        run: swiftc -module-name GLAFIRAContracts contracts/v1/generated/swift/*.swift contracts/v1/verification/swift/main.swift -o "$RUNNER_TEMP/glafira-contract-swift-fixtures"
          "$RUNNER_TEMP/glafira-contract-swift-fixtures"

  compile-csharp-dtos:
    name: Compile generated C# DTOs
    needs: generate-cross-platform-models
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download generated DTOs
        uses: actions/download-artifact@v4
        with:
          name: glafira-contract-dtos-${{ github.sha }}
          path: contracts/v1/generated
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Compile generated C# models
        run: dotnet run --project contracts/v1/verification/csharp/Glafira.GeneratedContracts.csproj --configuration Release
