name: GLAFIRA Contract Conformance

on:
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-conformance:
    name: Contract schema and signing fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify schema JSON and Bridge HMAC golden vector
        run: node contracts/v1/verify-fixtures.mjs
