              : > "$file_name"
            done
            collect_java_sources . "$RUNNER_TEMP/smoke-large.nul" "$RUNNER_TEMP/smoke-large-links.nul"
            validate_and_batch "$RUNNER_TEMP/smoke-large.nul" "$RUNNER_TEMP/smoke-large-output"
            grep -q '^count=1804$' "$RUNNER_TEMP/smoke-large-output"
            grep -q '"index":1' "$RUNNER_TEMP/smoke-large-output"
            python3 -c 'import json,pathlib,sys; d=dict(x.split("=",1) for x in pathlib.Path(sys.argv[2]).read_text().splitlines()); a=[p for b in json.loads(d["batches"])["include"] for p in b["files"].split(" ")]; e=[p.decode("utf-8") for p in sorted(pathlib.Path(sys.argv[1]+".raw").read_bytes().split(b"\0")[:-1])]; assert a == e' "$RUNNER_TEMP/smoke-large.nul" "$RUNNER_TEMP/smoke-large-output"
          )
          fi
          source_list="$RUNNER_TEMP/java-sources.nul"
          symlink_list="$RUNNER_TEMP/java-symlinks.nul"
          if ! collect_java_sources . "$source_list" "$symlink_list"; then
            echo "::error::Java source discovery failed or found unsupported Java symlinks; refusing to skip formatting."
            exit 1
          fi
          validate_and_batch "$source_list" "$GITHUB_OUTPUT"
          count="$(awk -F= '$1=="count" { print $2; exit }' "$GITHUB_OUTPUT")"
          [[ "$count" != "0" ]] || echo "No Java sources exist in this checkout; Google Java Format is not applicable."
