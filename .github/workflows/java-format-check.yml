
name: GLAFIRA Java Format Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: glafira-java-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java-format:
    name: Google Java Style Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Detect Java source files
        id: java-sources
        shell: bash
        run: |
          set -euo pipefail
          source_list="$RUNNER_TEMP/java-sources.nul"
          symlink_list="$RUNNER_TEMP/java-symlinks.nul"
          if ! find . -type l -name '*.java' -not -path './.git/*' -print0 > "$symlink_list"; then
            echo "::error::Unable to enumerate Java source symlinks; refusing to skip formatting."
            exit 1
          fi
          if [[ -s "$symlink_list" ]]; then
            echo "::error::Java source symlinks are not supported; replace them with regular source files."
            exit 1
          fi
          if ! find . -type f -name '*.java' -not -path './.git/*' -print0 > "$source_list"; then
            echo "::error::Unable to enumerate Java source files; refusing to skip formatting."
            exit 1
          fi

          mapfile -d '' -t discovered_files < "$source_list"
          # Keep find's ./ prefix: it prevents option-like and @argfile-like names
          # from being interpreted as formatter arguments. Reject whitespace because
          # this action tokenizes the files input on spaces.
          java_files=()
          for source in "${discovered_files[@]}"; do
            if [[ "$source" != ./* || "$source" =~ [[:space:]] ]]; then
              echo "::error::Java source path is unsafe for this formatter action: $source"
              exit 1
            fi
            java_files+=("$source")
          done

          count="${#java_files[@]}"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if (( count > 0 )); then
            printf -v files_output '%s ' "${java_files[@]}"
            echo "files=${files_output% }" >> "$GITHUB_OUTPUT"
          fi
          echo "Discovered $count Java source file(s)."
          if (( count == 0 )); then
            echo "No Java sources exist in this checkout; Google Java Format is not applicable."
          fi

      - name: Check Google Java Style
        if: steps.java-sources.outputs.count != '0'
        uses: ryanbascom/googlejavaformat@9abd254d9183b41942abf6dff7d717ed133f21c # v5
        with:
          args: "--set-exit-if-changed"
          files: "${{ steps.java-sources.outputs.files }}"
          skip-commit: true
