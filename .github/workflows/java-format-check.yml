
name: GLAFIRA Java Format Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: glafira-java-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java-format:
    name: Google Java Style Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect Java source files
        id: java-sources
        shell: bash
        run: |
          set -euo pipefail
          source_list="$RUNNER_TEMP/java-sources.nul"
          if ! find . -type f -name '*.java' -not -path './.git/*' -print0 > "$source_list"; then
            echo "::error::Unable to enumerate Java source files; refusing to skip formatting."
            exit 1
          fi

          mapfile -d '' -t discovered_files < "$source_list"
          validate_java_path() {
            local source_path="$1"
            [[ "$source_path" == ./* && ! "$source_path" =~ [[:space:]] ]]
          }

          # Exercise option-like, argfile-like and whitespace paths before trusting the
          # detector. Prefixes keep --version=.java and @A.java as file paths, while
          # whitespace is rejected because the formatter action tokenizes on spaces.
          probe_dir="$(mktemp -d)"
          trap 'rm -rf "$probe_dir"' EXIT
          touch "$probe_dir/--version=.java" "$probe_dir/@A.java" "$probe_dir/with space.java"
          (
            cd "$probe_dir"
            find . -type f -name '*.java' -print0 > "$probe_dir/probe.nul"
            mapfile -d '' -t probe_files < "$probe_dir/probe.nul"
            printf '%s\\n' "${probe_files[@]}" | grep -Fx -- './--version=.java' >/dev/null
            printf '%s\\n' "${probe_files[@]}" | grep -Fx -- './@A.java' >/dev/null
            validate_java_path './--version=.java'
            validate_java_path './@A.java'
            if validate_java_path './with space.java'; then
              echo "::error::Whitespace path validation unexpectedly succeeded."
              exit 1
            fi
          )

          java_files=()
          for source in "${discovered_files[@]}"; do
            if ! validate_java_path "$source"; then
              echo "::error::Java source path is unsafe for this formatter action: $source"
              exit 1
            fi
            java_files+=("$source")
          done

          count="${#java_files[@]}"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if (( count > 0 )); then
            printf -v files_output '%s ' "${java_files[@]}"
            echo "files=${files_output% }" >> "$GITHUB_OUTPUT"
          fi
          echo "Discovered $count Java source file(s)."
          if (( count == 0 )); then
            echo "No Java sources exist in this checkout; Google Java Format is not applicable."
          fi

      - name: Check Google Java Style
        if: steps.java-sources.outputs.count != '0'
        uses: ryanbascom/googlejavaformat@v5
        with:
          args: "--set-exit-if-changed"
          files: "${{ steps.java-sources.outputs.files }}"
          skip-commit: true
