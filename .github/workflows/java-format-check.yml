name: GLAFIRA Java Format Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

concurrency:
  group: glafira-java-format-${{ github.event_name }}-${{ github.event.action == 'edited' && github.event.changes.base != null && 'base-edit' || github.event.action == 'edited' && 'metadata-edit' || 'standard' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java-format-gate:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    name: Google Java Style Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout merge result or pushed commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Discover Java sources deterministically
        id: sources
        shell: bash
        run: |
          set -euo pipefail
          source_list="$RUNNER_TEMP/glafira-java-sources.nul"
          java_symlink="$(find . -type l -name '*.java' -not -path './.git/*' -print -quit)"
          if [[ -n "$java_symlink" ]]; then
            echo "::error::Java source symlinks are unsupported and must be handled explicitly."
            exit 1
          fi
          find . -type f -name '*.java' -not -path './.git/*' -print0 | sort -z > "$source_list"
          mapfile -d '' -t sources < "$source_list"
          for source in "${sources[@]}"; do
            if [[ "$source" =~ [[:space:]] ]]; then
              echo "::error::Java source paths containing whitespace are unsupported."
              exit 1
            fi
            if ! printf '%s' "$source" | iconv -f UTF-8 -t UTF-8 >/dev/null 2>&1; then
              echo "::error::Java source paths must round-trip through UTF-8 before invoking the formatter."
              exit 1
            fi
          done
          echo "count=${#sources[@]}" >> "$GITHUB_OUTPUT"
          echo "source_list=$source_list" >> "$GITHUB_OUTPUT"
          echo "Discovered ${#sources[@]} Java source file(s) in deterministic order."

      - name: Download and verify pinned Google Java Format
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/google-java-format-2.0.0-all-deps.jar"
          curl --fail --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-delay 2 \
            "https://github.com/google/google-java-format/releases/download/v2.0.0/google-java-format-2.0.0-all-deps.jar" \
            --output "$jar"
          echo "c78feb48c549fa7114b7ea11db3b456808f7b371ffe84e6643a44dd2f9588639  $jar" | sha256sum --check
          version="$(java \
            --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
            --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
            --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
            --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
            --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
            -jar "$jar" --version 2>&1)"
          grep -Fq "Version 2.0.0" <<< "$version"
          echo "Verified $version"

      - name: Check Google Java Style or report not applicable
        shell: bash
        env:
          SOURCE_COUNT: ${{ steps.sources.outputs.count }}
          SOURCE_LIST: ${{ steps.sources.outputs.source_list }}
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/google-java-format-2.0.0-all-deps.jar"
          java_args=(
            --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED
            --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED
            --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED
            --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED
            --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
          )
          if [[ "$SOURCE_COUNT" == "0" ]]; then
            echo "::notice::Google Java Format: NOT_APPLICABLE (no Java source files discovered)."
          else
            xargs -0 -r java "${java_args[@]}" -jar "$jar" --set-exit-if-changed < "$SOURCE_LIST"
          fi

      - name: Verify formatter accepts and rejects production manifests
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/google-java-format-2.0.0-all-deps.jar"
          java_args=(
            --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED
            --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED
            --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED
            --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED
            --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
          )
          fixture_dir="$(mktemp -d "$GITHUB_WORKSPACE/.gjf-smoke.XXXXXX")"
          trap 'rm -rf "$fixture_dir"' EXIT
          formatted="$fixture_dir/Formatted.java"
          formatted_second="$fixture_dir/FormattedSecond.java"
          unformatted="$fixture_dir/Unformatted.java"
          cat > "$formatted" <<'EOF'
          final class Formatted {
            void run() {
              System.out.println("formatted");
            }
          }
          EOF
          cat > "$formatted_second" <<'EOF'
          final class FormattedSecond {
            void run() {
              System.out.println("second formatted file");
            }
          }
          EOF
          printf '%s\n' 'final class Unformatted{void run(){System.out.println("unformatted");}}' > "$unformatted"

          # The formatted-only manifest must pass and process every entry.
          formatted_sources="$RUNNER_TEMP/glafira-formatter-formatted.nul"
          printf '%s\0' "$formatted" "$formatted_second" | sort -z > "$formatted_sources"
          mapfile -d '' -t formatted_files < "$formatted_sources"
          [[ "${#formatted_files[@]}" -eq 2 ]]
          formatted_expected="$fixture_dir/formatted.expected"
          formatted_output="$fixture_dir/formatted.stdout"
          : > "$formatted_expected"
          for source in "${formatted_files[@]}"; do
            java "${java_args[@]}" -jar "$jar" "$source" >> "$formatted_expected"
          done
          xargs -0 -r java "${java_args[@]}" -jar "$jar" --set-exit-if-changed < "$formatted_sources" > "$formatted_output"
          if ! cmp -s "$formatted_expected" "$formatted_output"; then
            echo "::error::Formatted production manifest was not fully accepted or one of its sources was skipped."
            diff -u "$formatted_expected" "$formatted_output" || true
            exit 1
          fi

          # The mixed manifest follows the exact sorted NUL-discovery + xargs production handoff.
          smoke_sources="$RUNNER_TEMP/glafira-formatter-smoke.nul"
          find "$fixture_dir" -type f -name '*.java' -print0 | sort -z > "$smoke_sources"
          mapfile -d '' -t smoke_files < "$smoke_sources"
          [[ "${#smoke_files[@]}" -eq 3 ]]
          [[ "${smoke_files[0]}" == "$formatted" ]]
          [[ "${smoke_files[1]}" == "$formatted_second" ]]
          [[ "${smoke_files[2]}" == "$unformatted" ]]
          mixed_expected="$fixture_dir/mixed.expected"
          mixed_output="$fixture_dir/mixed.stdout"
          mixed_error="$fixture_dir/mixed.stderr"
          : > "$mixed_expected"
          for source in "${smoke_files[@]}"; do
            java "${java_args[@]}" -jar "$jar" "$source" >> "$mixed_expected"
          done
          set +e
          xargs -0 -r java "${java_args[@]}" -jar "$jar" --set-exit-if-changed < "$smoke_sources" > "$mixed_output" 2> "$mixed_error"
          mixed_status=$?
          set -e
          if [[ "$mixed_status" -ne 123 ]] || ! cmp -s "$mixed_expected" "$mixed_output"; then
            echo "::error::Production formatter handoff did not process the complete mixed manifest and reject its unformatted third entry (xargs exit=$mixed_status)."
            cat "$mixed_error"
            diff -u "$mixed_expected" "$mixed_output" || true
            exit 1
          fi

          # Keep a single-file oracle for the expected formatter rejection behavior.
          expected="$fixture_dir/single.expected"
          actual="$fixture_dir/single.actual"
          formatter_error="$fixture_dir/formatter.stderr"
          java "${java_args[@]}" -jar "$jar" "$unformatted" > "$expected"
          if java "${java_args[@]}" -jar "$jar" --set-exit-if-changed "$unformatted" > "$actual" 2> "$formatter_error"; then
            echo "::error::Google Java Format unexpectedly accepted the unformatted fixture."
            exit 1
          else
            status=$?
          fi
          if [[ "$status" -ne 1 ]] || [[ -s "$formatter_error" ]] || ! cmp -s "$expected" "$actual"; then
            echo "::error::Formatter did not produce the expected formatted output and exit code (exit=$status)."
            cat "$formatter_error"
            diff -u "$expected" "$actual" || true
            exit 1
          fi
          echo "Formatter regression smoke passed: formatted-only manifest accepted, every mixed-manifest source processed, and the unformatted third entry rejected."
