name: GLAFIRA Java Format Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

concurrency:
  group: glafira-java-format-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && github.event.changes.base == null && 'metadata' || 'validation' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java-format-gate:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    name: ${{ github.event.action == 'edited' && github.event.changes.base == null && 'PR metadata edit — formatter not run' || 'Google Java Style Validation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout merge result or pushed commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download and verify pinned Google Java Format
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/google-java-format-2.0.0-all-deps.jar"
          curl --fail --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-delay 2 \
            "https://github.com/google/google-java-format/releases/download/v2.0.0/google-java-format-2.0.0-all-deps.jar" \
            --output "$jar"
          echo "c78feb48c549fa7114b7ea11db3b456808f7b371ffe84e6643a44dd2f9588639  $jar" | sha256sum --check
          version="$(java \
            --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
            --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
            --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
            --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
            --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
            -jar "$jar" --version 2>&1)"
          grep -Fq "Version 2.0.0" <<< "$version"
          echo "Verified $version"

      - name: Discover and validate Java sources with shared production gate
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/google-java-format-2.0.0-all-deps.jar"
          java_args=(
            --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED
            --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED
            --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED
            --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED
            --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
          )

          discover_java_sources() {
            local root="$1" output="$2"
            local symlink='' status=0 err="$RUNNER_TEMP/glafira-java-discovery.stderr"
            : > "$err"
            set +e
            symlink="$(find "$root" -type l -name '*.java' -not -path '*/.git/*' -print -quit 2>"$err")"
            status=$?
            set -e
            if [[ "$status" -ne 0 ]]; then
              printf 'Java symlink discovery failed; diagnostic_base64=' >&2
              base64 -w0 "$err" >&2
              printf '\n' >&2
              return "$status"
            fi
            if [[ -n "$symlink" ]]; then
              printf 'Java source symlink detected; source path redacted.\n' >&2
              return 21
            fi
            : > "$err"
            set +e
            find "$root" -type f -name '*.java' -not -path '*/.git/*' -print0 2>"$err" | sort -z > "$output"
            status=$?
            set -e
            if [[ "$status" -ne 0 ]]; then
              printf 'Java source discovery/sort failed; diagnostic_base64=' >&2
              base64 -w0 "$err" >&2
              printf '\n' >&2
              return "$status"
            fi
            local -a discovered=()
            if ! mapfile -d '' -t discovered < "$output"; then
              printf 'Java source manifest could not be read.\n' >&2
              return 22
            fi
            local source
            for source in "${discovered[@]}"; do
              if [[ "$source" =~ [[:space:]] ]]; then
                printf 'Java source path contains unsupported whitespace; source path redacted.\n' >&2
                return 23
              fi
            done
            : > "$err"
            if ! iconv -f UTF-8 -t UTF-8 < "$output" > /dev/null 2>"$err"; then
              printf 'Java source manifest is not valid UTF-8; diagnostic_base64=' >&2
              base64 -w0 "$err" >&2
              printf '\n' >&2
              return 24
            fi
            printf '%s\n' "${#discovered[@]}"
          }

          format_check_manifest() {
            local manifest="$1" stdout_file="$2" stderr_file="$3" status=0
            xargs -0 -r java "${java_args[@]}" -jar "$jar" --dry-run --set-exit-if-changed < "$manifest" > "$stdout_file" 2> "$stderr_file" || status=$?
            return "$status"
          }

          emit_bounded_diagnostic() {
            local label="$1" file="$2" bytes
            bytes="$(wc -c < "$file")"
            printf '%s_bytes=%s\n' "$label" "$bytes"
            printf '%s_base64=' "$label"
            head -c 4096 "$file" | base64 -w0
            printf '\n'
          }
          run_format_gate() {
            local root="$1" manifest="$2" stdout_file="$3" stderr_file="$4" result_file="$5"
            local count status=0
            : > "$stderr_file"
            if count="$(discover_java_sources "$root" "$manifest" 2>"$stderr_file")"; then
              :
            else
              status=$?
              printf 'DISCOVERY_ERROR\n' > "$result_file"
              return "$status"
            fi
            if [[ "$count" == "0" ]]; then
              printf 'NOT_APPLICABLE\n' > "$result_file"
              return 0
            fi
            if format_check_manifest "$manifest" "$stdout_file" "$stderr_file"; then
              printf '0\n' > "$result_file"
              return 0
            else
              status=$?
              printf '%s\n' "$status" > "$result_file"
              return "$status"
            fi
          }

          # Actual repository gate uses the same discovery, empty-tree decision and manifest formatter as every fixture.
          production_manifest="$RUNNER_TEMP/glafira-java-sources.nul"
          production_stdout="$RUNNER_TEMP/glafira-java-format.stdout"
          production_stderr="$RUNNER_TEMP/glafira-java-format.stderr"
          production_result="$RUNNER_TEMP/glafira-java-format.result"
          if run_format_gate . "$production_manifest" "$production_stdout" "$production_stderr" "$production_result"; then
            if [[ "$(cat "$production_result")" == "NOT_APPLICABLE" ]]; then
              echo "::notice::Google Java Format: NOT_APPLICABLE (no Java source files discovered); the validation job itself completed."
            fi
          else
            production_status=$?
            if [[ "$(cat "$production_result")" == "DISCOVERY_ERROR" ]]; then
              echo "::error::Java source discovery failed; inspect the base64 diagnostic below."; printf "discovery_stderr_base64="; base64 -w0 "$production_stderr"; printf "\n"
            else
              echo "::error::Google Java Format rejected one or more Java sources (exit=$production_status). Diagnostics are base64-encoded to keep PR source text inert."
              emit_bounded_diagnostic stdout "$production_stdout"
              emit_bounded_diagnostic stderr "$production_stderr"
            fi
            exit "$production_status"
          fi

          # Fixtures live only in a unique runner-temp directory; never remove a checkout-owned path.
          fixture_root="$(mktemp -d "$RUNNER_TEMP/glafira-gjf-smoke.XXXXXX")"
          trap 'rm -rf "$fixture_root"' EXIT
          mkdir -p "$fixture_root/formatted" "$fixture_root/mixed" "$fixture_root/single" "$fixture_root/empty" "$fixture_root/symlink"
          cat > "$fixture_root/formatted/Formatted.java" <<'EOF'
          final class Formatted {
            void run() {
              System.out.println("formatted");
            }
          }
          EOF
          cat > "$fixture_root/formatted/FormattedSecond.java" <<'EOF'
          final class FormattedSecond {
            void run() {
              System.out.println("second formatted file");
            }
          }
          EOF
          cp "$fixture_root/formatted/Formatted.java" "$fixture_root/mixed/Formatted.java"
          cp "$fixture_root/formatted/FormattedSecond.java" "$fixture_root/mixed/FormattedSecond.java"
          printf '%s\n' 'final class Unformatted{void run(){System.out.println("unformatted");}}' > "$fixture_root/mixed/Unformatted.java"
          cp "$fixture_root/mixed/Unformatted.java" "$fixture_root/single/Unformatted.java"

          # Expected manifests are independently constructed from the exact fixture paths.
          formatted_expected_manifest="$RUNNER_TEMP/glafira-formatted.expected.nul"
          printf '%s\0' "$fixture_root/formatted/Formatted.java" "$fixture_root/formatted/FormattedSecond.java" | sort -z > "$formatted_expected_manifest"
          formatted_manifest="$RUNNER_TEMP/glafira-formatted.actual.nul"
          formatted_stdout="$RUNNER_TEMP/glafira-formatted.stdout"
          formatted_stderr="$RUNNER_TEMP/glafira-formatted.stderr"
          formatted_result="$RUNNER_TEMP/glafira-formatted.result"
          if run_format_gate "$fixture_root/formatted" "$formatted_manifest" "$formatted_stdout" "$formatted_stderr" "$formatted_result"; then formatted_status=0; else formatted_status=$?; fi
          if [[ "$formatted_status" -ne 0 ]] || [[ "$(cat "$formatted_result")" != "0" ]] || [[ -s "$formatted_stderr" ]] || ! cmp -s "$formatted_expected_manifest" "$formatted_manifest"; then
            echo "::error::Formatted-only manifest was not accepted with the exact two expected sources."
            emit_bounded_diagnostic expected_manifest "$formatted_expected_manifest"
            emit_bounded_diagnostic actual_manifest "$formatted_manifest"
            emit_bounded_diagnostic stdout "$formatted_stdout"
            emit_bounded_diagnostic stderr "$formatted_stderr"
            exit 1
          fi
          formatted_expected="$RUNNER_TEMP/glafira-formatted.expected"
          : > "$formatted_expected"
          if ! cmp -s "$formatted_expected" "$formatted_stdout"; then
            echo "::error::Formatted-only dry-run should report no changed paths."
            emit_bounded_diagnostic expected "$formatted_expected"
            emit_bounded_diagnostic actual "$formatted_stdout"
            exit 1
          fi

          mixed_expected_manifest="$RUNNER_TEMP/glafira-mixed.expected.nul"
          printf '%s\0' "$fixture_root/mixed/Formatted.java" "$fixture_root/mixed/FormattedSecond.java" "$fixture_root/mixed/Unformatted.java" | sort -z > "$mixed_expected_manifest"
          mixed_manifest="$RUNNER_TEMP/glafira-mixed.actual.nul"
          mixed_stdout="$RUNNER_TEMP/glafira-mixed.stdout"
          mixed_stderr="$RUNNER_TEMP/glafira-mixed.stderr"
          mixed_result="$RUNNER_TEMP/glafira-mixed.result"
          if run_format_gate "$fixture_root/mixed" "$mixed_manifest" "$mixed_stdout" "$mixed_stderr" "$mixed_result"; then mixed_status=0; else mixed_status=$?; fi
          if [[ "$mixed_status" -ne 123 ]] || [[ "$(cat "$mixed_result")" != "123" ]] || [[ -s "$mixed_stderr" ]] || ! cmp -s "$mixed_expected_manifest" "$mixed_manifest"; then
            echo "::error::Mixed manifest did not process the exact three sources and reject the unformatted third file (exit=$mixed_status)."
            printf 'expected_manifest_base64='; base64 -w0 "$mixed_expected_manifest"; printf '\n'
            printf 'actual_manifest_base64='; base64 -w0 "$mixed_manifest"; printf '\n'
            printf 'stdout_base64='; base64 -w0 "$mixed_stdout"; printf '\n'
            printf 'stderr_base64='; base64 -w0 "$mixed_stderr"; printf '\n'
            exit 1
          fi
          mixed_expected="$RUNNER_TEMP/glafira-mixed.expected"
          printf '%s\n' "$fixture_root/mixed/Unformatted.java" > "$mixed_expected"
          if ! cmp -s "$mixed_expected" "$mixed_stdout"; then
            echo "::error::Mixed dry-run must report exactly the unformatted third source; this also detects skipped or duplicated manifest entries."
            emit_bounded_diagnostic expected "$mixed_expected"
            emit_bounded_diagnostic actual "$mixed_stdout"
            exit 1
          fi

          single_expected_manifest="$RUNNER_TEMP/glafira-single.expected.nul"
          printf '%s\0' "$fixture_root/single/Unformatted.java" > "$single_expected_manifest"
          single_manifest="$RUNNER_TEMP/glafira-single.actual.nul"
          single_stdout="$RUNNER_TEMP/glafira-single.stdout"
          single_stderr="$RUNNER_TEMP/glafira-single.stderr"
          single_result="$RUNNER_TEMP/glafira-single.result"
          if run_format_gate "$fixture_root/single" "$single_manifest" "$single_stdout" "$single_stderr" "$single_result"; then single_status=0; else single_status=$?; fi
          if [[ "$single_status" -ne 123 ]] || [[ "$(cat "$single_result")" != "123" ]] || [[ -s "$single_stderr" ]] || ! cmp -s "$single_expected_manifest" "$single_manifest"; then
            echo "::error::Single-file manifest did not produce the expected style rejection (exit=$single_status)."
            printf 'expected_manifest_base64='; base64 -w0 "$single_expected_manifest"; printf '\n'
            printf 'actual_manifest_base64='; base64 -w0 "$single_manifest"; printf '\n'
            printf 'stdout_base64='; base64 -w0 "$single_stdout"; printf '\n'
            printf 'stderr_base64='; base64 -w0 "$single_stderr"; printf '\n'
            exit 1
          fi
          single_expected="$RUNNER_TEMP/glafira-single.expected"
          printf '%s\n' "$fixture_root/single/Unformatted.java" > "$single_expected"
          if ! cmp -s "$single_expected" "$single_stdout"; then
            echo "::error::Single-file dry-run must report exactly the unformatted source path."
            emit_bounded_diagnostic expected "$single_expected"
            emit_bounded_diagnostic actual "$single_stdout"
            exit 1
          fi
          direct_stdout="$RUNNER_TEMP/glafira-single.direct.stdout"
          direct_stderr="$RUNNER_TEMP/glafira-single.direct.stderr"
          set +e
          java "${java_args[@]}" -jar "$jar" --dry-run --set-exit-if-changed "$fixture_root/single/Unformatted.java" > "$direct_stdout" 2> "$direct_stderr"
          direct_status=$?
          set -e
          if [[ "$direct_status" -ne 1 ]] || [[ -s "$direct_stderr" ]] || ! cmp -s "$single_expected" "$direct_stdout"; then
            echo "::error::Direct single-file oracle must return Java exit 1 for a style violation, not a parse/runtime error."
            emit_bounded_diagnostic expected "$single_expected"
            emit_bounded_diagnostic actual "$direct_stdout"
            emit_bounded_diagnostic stderr "$direct_stderr"
            exit 1
          fi

          # The production caller must distinguish an empty tree from discovery failure.
          empty_manifest="$RUNNER_TEMP/glafira-empty.nul"
          empty_stdout="$RUNNER_TEMP/glafira-empty.stdout"
          empty_stderr="$RUNNER_TEMP/glafira-empty.stderr"
          empty_result="$RUNNER_TEMP/glafira-empty.result"
          if run_format_gate "$fixture_root/empty" "$empty_manifest" "$empty_stdout" "$empty_stderr" "$empty_result"; then empty_status=0; else empty_status=$?; fi
          [[ "$empty_status" -eq 0 && "$(cat "$empty_result")" == "NOT_APPLICABLE" && ! -s "$empty_manifest" && ! -s "$empty_stdout" ]]

          missing_manifest="$RUNNER_TEMP/glafira-missing.nul"
          missing_stdout="$RUNNER_TEMP/glafira-missing.stdout"
          missing_stderr="$RUNNER_TEMP/glafira-missing.stderr"
          missing_result="$RUNNER_TEMP/glafira-missing.result"
          if run_format_gate "$fixture_root/missing" "$missing_manifest" "$missing_stdout" "$missing_stderr" "$missing_result"; then missing_status=0; else missing_status=$?; fi
          if [[ "$missing_status" -eq 0 ]] || [[ "$(cat "$missing_result")" != "DISCOVERY_ERROR" ]] || [[ ! -s "$missing_stderr" ]]; then
            echo "::error::Missing-root discovery failure was incorrectly treated as an empty source tree."
            exit 1
          fi

          ln -s "$fixture_root/formatted/Formatted.java" "$fixture_root/symlink/Linked.java"
          symlink_manifest="$RUNNER_TEMP/glafira-symlink.nul"
          symlink_stdout="$RUNNER_TEMP/glafira-symlink.stdout"
          symlink_stderr="$RUNNER_TEMP/glafira-symlink.stderr"
          symlink_result="$RUNNER_TEMP/glafira-symlink.result"
          if run_format_gate "$fixture_root/symlink" "$symlink_manifest" "$symlink_stdout" "$symlink_stderr" "$symlink_result"; then symlink_status=0; else symlink_status=$?; fi
          if [[ "$symlink_status" -eq 0 ]] || [[ "$(cat "$symlink_result")" != "DISCOVERY_ERROR" ]] || ! grep -Fq "Java source symlink detected" "$symlink_stderr"; then
            echo "::error::Symlink-only discovery was incorrectly treated as an empty source tree."
            exit 1
          fi

          echo "Formatter regression smoke passed: dry-run positive, mixed, singleton, empty-tree, missing-root and symlink fixtures used the same production discovery and manifest formatter functions; the direct singleton oracle confirmed Java exit 1."