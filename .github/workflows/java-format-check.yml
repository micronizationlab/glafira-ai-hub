name: GLAFIRA Java Format Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: glafira-java-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    name: Discover Java sources
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.sources.outputs.count }}
      batches: ${{ steps.sources.outputs.batches }}

    steps:
      - name: Checkout submitted source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate discovery and build deterministic batches
        id: sources
        shell: bash
        run: |
          set -euo pipefail

          collect_java_sources() {
            local root="$1" output="$2" symlinks="$3" raw="${2}.raw"
            if ! find "$root" -type l -name '*.java' -not -path "$root/.git/*" -print0 > "$symlinks"; then
              return 1
            fi
            [[ ! -s "$symlinks" ]] || return 1
            if ! find "$root" -type f -name '*.java' -not -path "$root/.git/*" -print0 > "$raw"; then
              return 1
            fi
            LC_ALL=C sort -z "$raw" -o "$output"
          }

          build_batches() {
            local list="$1" records="$2" count_file="$3"
            python3 - "$list" "$records" "$count_file" <<'PY'
          import json
          import pathlib
          import sys

          list_path, records_path, count_path = map(pathlib.Path, sys.argv[1:])
          raw = list_path.read_bytes()
          if raw and not raw.endswith(b"\\0"):
              print("Java source list is not NUL-terminated.", file=sys.stderr)
              raise SystemExit(1)

          paths = raw[:-1].split(b"\\0") if raw else []
          batches = []
          current = []
          current_bytes = 0
          limit = 48 * 1024

          for encoded_path in paths:
              try:
                  path = encoded_path.decode("utf-8", errors="strict")
              except UnicodeDecodeError:
                  print("A Java source path is not valid UTF-8.", file=sys.stderr)
                  raise SystemExit(1)
              if not path.startswith("./") or any(char.isspace() for char in path):
                  print("A Java source path cannot be passed safely to the formatter.", file=sys.stderr)
                  raise SystemExit(1)
              path_bytes = len(encoded_path)
              if path_bytes > limit:
                  print("A Java source path exceeds the formatter batch limit.", file=sys.stderr)
                  raise SystemExit(1)

              extra = path_bytes + (1 if current else 0)
              if current and current_bytes + extra > limit:
                  batches.append(" ".join(current))
                  current = []
                  current_bytes = 0
              if current:
                  current_bytes += 1
              current.append(path)
              current_bytes += path_bytes

          if current:
              batches.append(" ".join(current))

          with records_path.open("w", encoding="utf-8", newline="\\n") as records:
              for index, files in enumerate(batches):
                  records.write(json.dumps(
                      {"files": files, "index": index},
                      ensure_ascii=False,
                      separators=(",", ":"),
                  ) + "\\n")
          count_path.write_text(str(len(paths)), encoding="ascii")
          PY
          }
          # Exercise the same production functions against hostile and large fixtures.
          smoke_root="$RUNNER_TEMP/java-discovery-smoke"
          mkdir -p "$smoke_root"
          (
            cd "$smoke_root"
            touch -- './Good.java' './--version=.java' './@A.java' './Unicode-λ.java'
            collect_java_sources . "$RUNNER_TEMP/smoke-valid.nul" "$RUNNER_TEMP/smoke-valid-links.nul"
            build_batches "$RUNNER_TEMP/smoke-valid.nul" "$RUNNER_TEMP/smoke-valid.jsonl" "$RUNNER_TEMP/smoke-valid-count"
            [[ "$(cat "$RUNNER_TEMP/smoke-valid-count")" == "4" ]]

            touch -- './with space.java'
            collect_java_sources . "$RUNNER_TEMP/smoke-whitespace.nul" "$RUNNER_TEMP/smoke-whitespace-links.nul"
            if build_batches "$RUNNER_TEMP/smoke-whitespace.nul" "$RUNNER_TEMP/smoke-invalid.jsonl" "$RUNNER_TEMP/smoke-invalid-count"; then
              echo "Whitespace-path regression was not rejected." >&2
              exit 1
            fi
            rm -- './with space.java'

            bad_path=
            touch -- "$bad_path"
            collect_java_sources . "$RUNNER_TEMP/smoke-invalid-utf8.nul" "$RUNNER_TEMP/smoke-invalid-utf8-links.nul"
            if build_batches "$RUNNER_TEMP/smoke-invalid-utf8.nul" "$RUNNER_TEMP/smoke-invalid-utf8.jsonl" "$RUNNER_TEMP/smoke-invalid-utf8-count"; then
              echo "Non-UTF-8 path regression was not rejected." >&2
              exit 1
            fi
            rm -- "$bad_path"

            ln -s './Good.java' './Linked.java'
            if collect_java_sources . "$RUNNER_TEMP/smoke-symlink.nul" "$RUNNER_TEMP/smoke-symlink-links.nul"; then
              echo "Java symlink regression was not rejected." >&2
              exit 1
            fi
            rm -- './Linked.java'

            mkdir -p empty
            collect_java_sources ./empty "$RUNNER_TEMP/smoke-empty.nul" "$RUNNER_TEMP/smoke-empty-links.nul"
            build_batches "$RUNNER_TEMP/smoke-empty.nul" "$RUNNER_TEMP/smoke-empty.jsonl" "$RUNNER_TEMP/smoke-empty-count"
            [[ "$(cat "$RUNNER_TEMP/smoke-empty-count")" == "0" ]]
            [[ "$(jq -s 'length' "$RUNNER_TEMP/smoke-empty.jsonl")" == "0" ]]

            mkdir -p many
            for number in $(seq 1 1800); do
              printf -v file_name 'many/JavaSource-%04d-abcdefghijklmnop.java' "$number"
              : > "$file_name"
            done
            collect_java_sources . "$RUNNER_TEMP/smoke-large.nul" "$RUNNER_TEMP/smoke-large-links.nul"
            build_batches "$RUNNER_TEMP/smoke-large.nul" "$RUNNER_TEMP/smoke-large.jsonl" "$RUNNER_TEMP/smoke-large-count"
            [[ "$(cat "$RUNNER_TEMP/smoke-large-count")" -ge 1804 ]]
            [[ "$(jq -s 'length' "$RUNNER_TEMP/smoke-large.jsonl")" -ge 2 ]]
          )
          echo "Discovery regression checks passed (empty behavior is covered by the real repository scan when count=0)."

          source_list="$RUNNER_TEMP/java-sources.nul"
          symlink_list="$RUNNER_TEMP/java-symlinks.nul"
          records="$RUNNER_TEMP/java-source-batches.jsonl"
          count_file="$RUNNER_TEMP/java-source-count"

          if ! collect_java_sources . "$source_list" "$symlink_list"; then
            echo "::error::Java source discovery failed or found unsupported Java symlinks; refusing to skip formatting."
            exit 1
          fi
          if ! build_batches "$source_list" "$records" "$count_file"; then
            echo "::error::A Java source path is unsupported or cannot be passed safely to the formatter."
            exit 1
          fi

          count="$(cat "$count_file")"
          batches="$(jq -cs '{include: .}' "$records")"
          batch_payload_bytes=$(LC_ALL=C printf '%s' "$batches" | wc -c)
          batch_payload_bytes="${batch_payload_bytes//[[:space:]]/}"
          if (( batch_payload_bytes > 700000 )); then
            echo "::error::The Java formatter batch manifest exceeds the GitHub Actions output safety limit."
            exit 1
          fi

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "batches=$batches" >> "$GITHUB_OUTPUT"
          echo "Discovered $count Java source file(s) in $(jq -s 'length' "$records") deterministic batches."
          if (( count == 0 )); then
            echo "No Java sources exist in this checkout; Google Java Format is not applicable."
          fi

  java-format:
    name: Google Java Style Validation batch ${{ matrix.index }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover.outputs.batches) }}

    steps:
      - name: Checkout submitted source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check Google Java Style
        uses: ryanbascom/googlejavaformat@9abd254d9183b41942abf6dff7d717ed133f21c2 # v5
        with:
          args: "--set-exit-if-changed"
          files: "${{ matrix.files }}"
          skip-commit: true
./invalid-\xff.java'
            touch -- "$bad_path"
            collect_java_sources . "$RUNNER_TEMP/smoke-invalid-utf8.nul" "$RUNNER_TEMP/smoke-invalid-utf8-links.nul"
            if build_batches "$RUNNER_TEMP/smoke-invalid-utf8.nul" "$RUNNER_TEMP/smoke-invalid-utf8.jsonl" "$RUNNER_TEMP/smoke-invalid-utf8-count"; then
              echo "Non-UTF-8 path regression was not rejected." >&2
              exit 1
            fi
            rm -- "$bad_path"

            ln -s './Good.java' './Linked.java'
            if collect_java_sources . "$RUNNER_TEMP/smoke-symlink.nul" "$RUNNER_TEMP/smoke-symlink-links.nul"; then
              echo "Java symlink regression was not rejected." >&2
              exit 1
            fi
            rm -- './Linked.java'

            mkdir -p empty
            collect_java_sources ./empty "$RUNNER_TEMP/smoke-empty.nul" "$RUNNER_TEMP/smoke-empty-links.nul"
            build_batches "$RUNNER_TEMP/smoke-empty.nul" "$RUNNER_TEMP/smoke-empty.jsonl" "$RUNNER_TEMP/smoke-empty-count"
            [[ "$(cat "$RUNNER_TEMP/smoke-empty-count")" == "0" ]]
            [[ "$(jq -s 'length' "$RUNNER_TEMP/smoke-empty.jsonl")" == "0" ]]

            mkdir -p many
            for number in $(seq 1 1800); do
              printf -v file_name 'many/JavaSource-%04d-abcdefghijklmnop.java' "$number"
              : > "$file_name"
            done
            collect_java_sources . "$RUNNER_TEMP/smoke-large.nul" "$RUNNER_TEMP/smoke-large-links.nul"
            build_batches "$RUNNER_TEMP/smoke-large.nul" "$RUNNER_TEMP/smoke-large.jsonl" "$RUNNER_TEMP/smoke-large-count"
            [[ "$(cat "$RUNNER_TEMP/smoke-large-count")" -ge 1804 ]]
            [[ "$(jq -s 'length' "$RUNNER_TEMP/smoke-large.jsonl")" -ge 2 ]]
          )
          echo "Discovery regression checks passed (empty behavior is covered by the real repository scan when count=0)."

          source_list="$RUNNER_TEMP/java-sources.nul"
          symlink_list="$RUNNER_TEMP/java-symlinks.nul"
          records="$RUNNER_TEMP/java-source-batches.jsonl"
          count_file="$RUNNER_TEMP/java-source-count"

          if ! collect_java_sources . "$source_list" "$symlink_list"; then
            echo "::error::Java source discovery failed or found unsupported Java symlinks; refusing to skip formatting."
            exit 1
          fi
          if ! build_batches "$source_list" "$records" "$count_file"; then
            echo "::error::A Java source path is unsupported or cannot be passed safely to the formatter."
            exit 1
          fi

          count="$(cat "$count_file")"
          batches="$(jq -cs '{include: .}' "$records")"
          batch_payload_bytes=$(LC_ALL=C printf '%s' "$batches" | wc -c)
          batch_payload_bytes="${batch_payload_bytes//[[:space:]]/}"
          if (( batch_payload_bytes > 700000 )); then
            echo "::error::The Java formatter batch manifest exceeds the GitHub Actions output safety limit."
            exit 1
          fi

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "batches=$batches" >> "$GITHUB_OUTPUT"
          echo "Discovered $count Java source file(s) in $(jq -s 'length' "$records") deterministic batches."
          if (( count == 0 )); then
            echo "No Java sources exist in this checkout; Google Java Format is not applicable."
          fi

  java-format:
    name: Google Java Style Validation batch ${{ matrix.index }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover.outputs.batches) }}

    steps:
      - name: Checkout submitted source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check Google Java Style
        uses: ryanbascom/googlejavaformat@9abd254d9183b41942abf6dff7d717ed133f21c2 # v5
        with:
          args: "--set-exit-if-changed"
          files: "${{ matrix.files }}"
          skip-commit: true
