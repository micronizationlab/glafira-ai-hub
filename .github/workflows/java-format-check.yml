name: GLAFIRA Java Format Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

concurrency:
  group: glafira-java-format-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && github.event.changes.base == null && 'metadata' || 'validation' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java-format-gate:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    name: ${{ github.event.action == 'edited' && github.event.changes.base == null && 'PR metadata edit — formatter not run' || 'Google Java Style Validation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout merge result or pushed commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download and verify pinned Google Java Format
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/google-java-format-2.0.0-all-deps.jar"
          curl --fail --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-delay 2 \
            "https://github.com/google/google-java-format/releases/download/v2.0.0/google-java-format-2.0.0-all-deps.jar" \
            --output "$jar"
          echo "c78feb48c549fa7114b7ea11db3b456808f7b371ffe84e6643a44dd2f9588639  $jar" | sha256sum --check
          version="$(java \
            --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
            --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
            --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
            --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
            --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
            -jar "$jar" --version 2>&1)"
          grep -Fq "Version 2.0.0" <<< "$version"
          echo "Verified $version"

      - name: Discover, validate and format-check Java sources
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/google-java-format-2.0.0-all-deps.jar"
          java_args=(
            --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED
            --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED
            --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED
            --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED
            --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
          )

          discover_java_sources() {
            local root="$1"
            local output="$2"
            local symlink
            symlink="$(find "$root" -type l -name '*.java' -not -path '*/.git/*' -print -quit)" || return $?
            if [[ -n "$symlink" ]]; then
              echo "::error::Java source symlinks are unsupported and must be handled explicitly."
              return 1
            fi
            find "$root" -type f -name '*.java' -not -path '*/.git/*' -print0 | sort -z > "$output" || return $?
            mapfile -d '' -t discovered < "$output" || return $?
            for source in "${discovered[@]}"; do
              if [[ "$source" =~ [[:space:]] ]]; then
                echo "::error::Java source paths containing whitespace are unsupported."
                return 1
              fi
              if ! printf '%s' "$source" | iconv -f UTF-8 -t UTF-8 >/dev/null 2>&1; then
                echo "::error::Java source paths must round-trip through UTF-8 before invoking the formatter."
                return 1
              fi
            done
            printf '%s\n' "${#discovered[@]}"
          }

          # Production discovery and handoff.
          source_list="$RUNNER_TEMP/glafira-java-sources.nul"
          source_count="$(discover_java_sources . "$source_list")"
          if [[ "$source_count" == "0" ]]; then
            echo "::notice::Google Java Format: NOT_APPLICABLE (no Java source files discovered)."
          else
            production_stdout="$RUNNER_TEMP/glafira-java-format.stdout"
            production_stderr="$RUNNER_TEMP/glafira-java-format.stderr"
            set +e
            xargs -0 -r java "${java_args[@]}" -jar "$jar" --set-exit-if-changed < "$source_list" > "$production_stdout" 2> "$production_stderr"
            production_status=$?
            set -e
            if [[ "$production_status" -ne 0 ]]; then
              echo "::error::Google Java Format rejected one or more Java sources (exit=$production_status). Diagnostics are base64-encoded to keep PR source text inert."
              printf 'stdout_base64='; base64 -w0 "$production_stdout"; printf '\n'
              printf 'stderr_base64='; base64 -w0 "$production_stderr"; printf '\n'
              exit "$production_status"
            fi
          fi

          # Fixtures use the same discovery function and xargs production handoff.
          fixture_root="$GITHUB_WORKSPACE/.gjf-smoke"
          rm -rf "$fixture_root"
          mkdir -p "$fixture_root/formatted" "$fixture_root/mixed"
          trap 'rm -rf "$fixture_root"' EXIT
          cat > "$fixture_root/formatted/Formatted.java" <<'EOF'
          final class Formatted {
            void run() {
              System.out.println("formatted");
            }
          }
          EOF
          cat > "$fixture_root/formatted/FormattedSecond.java" <<'EOF'
          final class FormattedSecond {
            void run() {
              System.out.println("second formatted file");
            }
          }
          EOF
          cp "$fixture_root/formatted/Formatted.java" "$fixture_root/mixed/Formatted.java"
          cp "$fixture_root/formatted/FormattedSecond.java" "$fixture_root/mixed/FormattedSecond.java"
          printf '%s\n' 'final class Unformatted{void run(){System.out.println("unformatted");}}' > "$fixture_root/mixed/Unformatted.java"

          # Discovery failures must propagate through command substitution; a missing root is not an empty source tree.
          missing_status=0
          discover_java_sources "$fixture_root/missing" "$RUNNER_TEMP/glafira-formatter-missing.nul" 2> "$RUNNER_TEMP/glafira-formatter-missing.stderr" || missing_status=$?
          if [[ "$missing_status" -eq 0 ]]; then
            echo "::error::Discovery unexpectedly accepted a missing source root."
            exit 1
          fi
          # A Java symlink is rejected rather than silently counted as zero sources.
          mkdir -p "$fixture_root/symlink"
          ln -s "$fixture_root/formatted/Formatted.java" "$fixture_root/symlink/Linked.java"
          symlink_status=0
          discover_java_sources "$fixture_root/symlink" "$RUNNER_TEMP/glafira-formatter-symlink.nul" 2> "$RUNNER_TEMP/glafira-formatter-symlink.stderr" || symlink_status=$?
          if [[ "$symlink_status" -eq 0 ]]; then
            echo "::error::Discovery unexpectedly accepted a Java symlink."
            exit 1
          fi

                    formatted_manifest="$RUNNER_TEMP/glafira-formatter-formatted.nul"
          formatted_count="$(discover_java_sources "$fixture_root/formatted" "$formatted_manifest")"
          [[ "$formatted_count" == "2" ]]
          formatted_expected="$RUNNER_TEMP/glafira-formatter-formatted.expected"
          formatted_actual="$RUNNER_TEMP/glafira-formatter-formatted.actual"
          : > "$formatted_expected"
          while IFS= read -r -d '' source; do
            java "${java_args[@]}" -jar "$jar" "$source" >> "$formatted_expected"
          done < "$formatted_manifest"
          xargs -0 -r java "${java_args[@]}" -jar "$jar" --set-exit-if-changed < "$formatted_manifest" > "$formatted_actual"
          if ! cmp -s "$formatted_expected" "$formatted_actual"; then
            echo "::error::Formatted-only production manifest was rejected or a source was skipped. Expected/actual output is base64-encoded."
            printf 'expected_base64='; base64 -w0 "$formatted_expected"; printf '\n'
            printf 'actual_base64='; base64 -w0 "$formatted_actual"; printf '\n'
            exit 1
          fi

          mixed_manifest="$RUNNER_TEMP/glafira-formatter-mixed.nul"
          mixed_count="$(discover_java_sources "$fixture_root/mixed" "$mixed_manifest")"
          [[ "$mixed_count" == "3" ]]
          mixed_expected="$RUNNER_TEMP/glafira-formatter-mixed.expected"
          mixed_actual="$RUNNER_TEMP/glafira-formatter-mixed.actual"
          mixed_stderr="$RUNNER_TEMP/glafira-formatter-mixed.stderr"
          : > "$mixed_expected"
          while IFS= read -r -d '' source; do
            java "${java_args[@]}" -jar "$jar" "$source" >> "$mixed_expected"
          done < "$mixed_manifest"
          set +e
          xargs -0 -r java "${java_args[@]}" -jar "$jar" --set-exit-if-changed < "$mixed_manifest" > "$mixed_actual" 2> "$mixed_stderr"
          mixed_status=$?
          set -e
          if [[ "$mixed_status" -ne 123 ]] || [[ -s "$mixed_stderr" ]] || ! cmp -s "$mixed_expected" "$mixed_actual"; then
            echo "::error::Mixed production manifest did not process all sources and reject its unformatted third entry (xargs exit=$mixed_status). Diagnostics are base64-encoded."
            printf 'expected_base64='; base64 -w0 "$mixed_expected"; printf '\n'
            printf 'actual_base64='; base64 -w0 "$mixed_actual"; printf '\n'
            printf 'stderr_base64='; base64 -w0 "$mixed_stderr"; printf '\n'
            exit 1
          fi

          # Independent single-file oracle: expected style rejection must be exit 1, not an unrelated error.
          single_expected="$RUNNER_TEMP/glafira-formatter-single.expected"
          single_actual="$RUNNER_TEMP/glafira-formatter-single.actual"
          single_stderr="$RUNNER_TEMP/glafira-formatter-single.stderr"
          java "${java_args[@]}" -jar "$jar" "$fixture_root/mixed/Unformatted.java" > "$single_expected"
          set +e
          java "${java_args[@]}" -jar "$jar" --set-exit-if-changed "$fixture_root/mixed/Unformatted.java" > "$single_actual" 2> "$single_stderr"
          single_status=$?
          set -e
          if [[ "$single_status" -ne 1 ]] || [[ -s "$single_stderr" ]] || ! cmp -s "$single_expected" "$single_actual"; then
            echo "::error::Single-file formatter oracle did not produce the expected style rejection (exit=$single_status). Diagnostics are base64-encoded."
            printf 'expected_base64='; base64 -w0 "$single_expected"; printf '\n'
            printf 'actual_base64='; base64 -w0 "$single_actual"; printf '\n'
            printf 'stderr_base64='; base64 -w0 "$single_stderr"; printf '\n'
            exit 1
          fi
          echo "Formatter regression smoke passed: positive manifest accepted; mixed production manifest processed every file and rejected the unformatted source; singleton oracle confirmed the expected style exit."