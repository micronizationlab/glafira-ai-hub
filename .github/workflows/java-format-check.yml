name: GLAFIRA Java Format Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: glafira-java-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    name: Discover Java sources
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.sources.outputs.count }}
      batches: ${{ steps.sources.outputs.batches }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Discover, validate and batch Java paths
        id: sources
        shell: bash
        run: |
          set -euo pipefail
          collect_java_sources() {
            local root="$1" output="$2" symlinks="$3" raw="${2}.raw"
            if ! find "$root" -type l -name '*.java' -not -path "$root/.git/*" -print0 > "$symlinks"; then
              return 1
            fi
            if [[ -s "$symlinks" ]]; then
              return 1
            fi
            if ! find "$root" -type f -name '*.java' -not -path "$root/.git/*" -print0 > "$raw"; then
              return 1
            fi
            LC_ALL=C sort -z "$raw" -o "$output"
          }
          validate_and_batch() {
            python3 - "$1" "$2" "${3:-}" <<'PY'
          import json
          import pathlib
          import sys
          raw = pathlib.Path(sys.argv[1]).read_bytes()
          if raw and not raw.endswith(b"\0"):
              raise SystemExit("Java source list is not NUL-terminated.")
          encoded_paths = raw[:-1].split(b"\0") if raw else []
          paths = []
          for encoded in encoded_paths:
              try:
                  path = encoded.decode("utf-8", errors="strict")
              except UnicodeDecodeError:
                  raise SystemExit("A Java source path is not valid UTF-8.")
              if not path.startswith("./") or any(char.isspace() for char in path):
                  raise SystemExit("A Java source path cannot be passed safely to the formatter.")
              paths.append((path, len(encoded)))
          batches = []
          current = []
          current_bytes = 0
          limit = 48 * 1024
          for path, path_bytes in paths:
              if path_bytes > limit:
                  raise SystemExit("A Java source path exceeds the formatter batch limit.")
              extra = path_bytes + (1 if current else 0)
              if current and current_bytes + extra > limit:
                  batches.append(" ".join(current))
                  current = []
                  current_bytes = 0
              if current:
                  current_bytes += 1
              current.append(path)
              current_bytes += path_bytes
          if current:
              batches.append(" ".join(current))
          payload = {"include": [
              {"files": files, "index": index}
              for index, files in enumerate(batches)
          ]}
          def encode_payload(value):
              encoded = json.dumps(value, ensure_ascii=False, separators=(",", ":"))
              if len(encoded.encode("utf-16-le")) > 700_000:
                  raise SystemExit("The formatter batch manifest exceeds the GitHub Actions output safety limit.")
              return encoded
          if sys.argv[3] == "smoke":
              try:
                  encode_payload({"include": [{"files": "x" * 600_000, "index": 0}]})
              except SystemExit:
                  pass
              else:
                  raise SystemExit("UTF-16 output budget regression was not rejected.")
          encoded_payload = encode_payload(payload)
          output = pathlib.Path(sys.argv[2])
          with output.open("a", encoding="utf-8", newline="\n") as stream:
              stream.write(f"count={len(paths)}\n")
              stream.write(f"batches={encoded_payload}\n")
          PY
          }
          # Regression tests exercise the same path validator used for production.
          smoke_root="$RUNNER_TEMP/java-discovery-smoke"
          mkdir -p "$smoke_root"
          (
            cd "$smoke_root"
            touch -- './Good.java' './--version=.java' './@A.java' './Unicode-λ.java'
            collect_java_sources . "$RUNNER_TEMP/smoke-valid.nul" "$RUNNER_TEMP/smoke-valid-links.nul"
            validate_and_batch "$RUNNER_TEMP/smoke-valid.nul" "$RUNNER_TEMP/smoke-valid-output" smoke
            grep -q '^count=4
            touch -- './with space.java'
            collect_java_sources . "$RUNNER_TEMP/smoke-space.nul" "$RUNNER_TEMP/smoke-space-links.nul"
            if validate_and_batch "$RUNNER_TEMP/smoke-space.nul" "$RUNNER_TEMP/smoke-space-output"; then
              echo "Whitespace-path regression was not rejected." >&2
              exit 1
            fi
            rm -- './with space.java'
            bad_path=$'./invalid-\xff.java'
            touch -- "$bad_path"
            collect_java_sources . "$RUNNER_TEMP/smoke-invalid-utf8.nul" "$RUNNER_TEMP/smoke-invalid-utf8-links.nul"
            if validate_and_batch "$RUNNER_TEMP/smoke-invalid-utf8.nul" "$RUNNER_TEMP/smoke-invalid-utf8-output"; then
              echo "Non-UTF-8 path regression was not rejected." >&2
              exit 1
            fi
            rm -- "$bad_path"
            ln -s './Good.java' './Linked.java'
            if collect_java_sources . "$RUNNER_TEMP/smoke-symlink.nul" "$RUNNER_TEMP/smoke-symlink-links.nul"; then
              echo "Java symlink regression was not rejected." >&2
              exit 1
            fi
            rm -- './Linked.java'
            mkdir -p empty
            collect_java_sources ./empty "$RUNNER_TEMP/smoke-empty.nul" "$RUNNER_TEMP/smoke-empty-links.nul"
            validate_and_batch "$RUNNER_TEMP/smoke-empty.nul" "$RUNNER_TEMP/smoke-empty-output"
            grep -q '^count=0$' "$RUNNER_TEMP/smoke-empty-output"
            mkdir -p many
            for number in $(seq 1 1800); do
              printf -v file_name 'many/JavaSource-%04d-abcdefghijklmnop.java' "$number"
              : > "$file_name"
            done
            collect_java_sources . "$RUNNER_TEMP/smoke-large.nul" "$RUNNER_TEMP/smoke-large-links.nul"
            validate_and_batch "$RUNNER_TEMP/smoke-large.nul" "$RUNNER_TEMP/smoke-large-output"
            grep -q '^count=1804$' "$RUNNER_TEMP/smoke-large-output"
            grep -q '"index":1' "$RUNNER_TEMP/smoke-large-output"
            python3 -c 'import json,pathlib,sys; d=dict(x.split("=",1) for x in pathlib.Path(sys.argv[2]).read_text().splitlines()); a=[p for b in json.loads(d["batches"])["include"] for p in b["files"].split(" ")]; e=[p.decode("utf-8") for p in pathlib.Path(sys.argv[1]).read_bytes().split(b"\\0")[:-1]]; assert a == e' "$RUNNER_TEMP/smoke-large.nul" "$RUNNER_TEMP/smoke-large-output"
          )
          echo "Java source discovery regression checks passed."

          source_list="$RUNNER_TEMP/java-sources.nul"
          symlink_list="$RUNNER_TEMP/java-symlinks.nul"
          if ! collect_java_sources . "$source_list" "$symlink_list"; then
            echo "::error::Java source discovery failed or found unsupported Java symlinks; refusing to skip formatting."
            exit 1
          fi
          validate_and_batch "$source_list" "$GITHUB_OUTPUT"
          count="$(awk -F= '$1=="count" { print $2; exit }' "$GITHUB_OUTPUT")"
          echo "Production checkout contains $count Java source file(s)."
          [[ "$count" != "0" ]] || echo "No Java sources exist in this checkout; Google Java Format is not applicable."

  java-format:
    name: Google Java Style Validation batch ${{ matrix.index }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover.outputs.batches) }}
    steps:
      - name: Checkout submitted source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check Google Java Style
        uses: ryanbascom/googlejavaformat@9abd254d9183b41942abf6dff7d717ed133f21c2 # v5
        with:
          args: "--set-exit-if-changed"
          files: "${{ matrix.files }}"
          skip-commit: true

  formatter-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout submitted source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Create formatted and unformatted fixtures
        shell: bash
        run: |
          mkdir -p .ci-java-format-smoke
          printf '%s\n' 'final class Smoke {' '  void run() {' '    System.out.println("formatted");' '  }' '}' > .ci-java-format-smoke/Smoke.java
          cp .ci-java-format-smoke/Smoke.java .ci-java-format-smoke/@A.java
          cp .ci-java-format-smoke/Smoke.java .ci-java-format-smoke/--version=.java
          printf '%s\n' 'final class NeedsFormat{void run(){System.out.println("needs formatting");}}' > .ci-java-format-smoke/NeedsFormat.java

      - name: Accept option-like, @ and Unicode paths
        uses: ryanbascom/googlejavaformat@9abd254d9183b41942abf6dff7d717ed133f21c2 # v5
        with:
          args: "--set-exit-if-changed"
          files: "./.ci-java-format-smoke/Smoke.java ./.ci-java-format-smoke/@A.java ./.ci-java-format-smoke/--version=.java"
          skip-commit: true

      - name: Require formatter to reject unformatted source
        id: reject-unformatted
        continue-on-error: true
        uses: ryanbascom/googlejavaformat@9abd254d9183b41942abf6dff7d717ed133f21c2 # v5
        with:
          args: "--set-exit-if-changed"
          files: "./.ci-java-format-smoke/NeedsFormat.java"
          skip-commit: true

      - name: Assert formatting enforcement remains active
        if: steps.reject-unformatted.outcome != 'failure'
        run: |
          echo "::error::Google Java Format did not reject intentionally unformatted source."
          exit 1
 "$RUNNER_TEMP/smoke-valid-output"
            python3 -c 'import json,pathlib,sys; d=dict(x.split("=",1) for x in pathlib.Path(sys.argv[2]).read_text().splitlines()); a=[p for b in json.loads(d["batches"])["include"] for p in b["files"].split(" ")]; e=[p.decode("utf-8") for p in pathlib.Path(sys.argv[1]).read_bytes().split(b"\\0")[:-1]]; assert a == e' "$RUNNER_TEMP/smoke-valid.nul" "$RUNNER_TEMP/smoke-valid-output"

            touch -- './with space.java'
            collect_java_sources . "$RUNNER_TEMP/smoke-space.nul" "$RUNNER_TEMP/smoke-space-links.nul"
            if validate_and_batch "$RUNNER_TEMP/smoke-space.nul" "$RUNNER_TEMP/smoke-space-output"; then
              echo "Whitespace-path regression was not rejected." >&2
              exit 1
            fi
            rm -- './with space.java'

            bad_path=$'./invalid-\xff.java'
            touch -- "$bad_path"
            collect_java_sources . "$RUNNER_TEMP/smoke-invalid-utf8.nul" "$RUNNER_TEMP/smoke-invalid-utf8-links.nul"
            if validate_and_batch "$RUNNER_TEMP/smoke-invalid-utf8.nul" "$RUNNER_TEMP/smoke-invalid-utf8-output"; then
              echo "Non-UTF-8 path regression was not rejected." >&2
              exit 1
            fi
            rm -- "$bad_path"

            ln -s './Good.java' './Linked.java'
            if collect_java_sources . "$RUNNER_TEMP/smoke-symlink.nul" "$RUNNER_TEMP/smoke-symlink-links.nul"; then
              echo "Java symlink regression was not rejected." >&2
              exit 1
            fi
            rm -- './Linked.java'

            mkdir -p empty
            collect_java_sources ./empty "$RUNNER_TEMP/smoke-empty.nul" "$RUNNER_TEMP/smoke-empty-links.nul"
            validate_and_batch "$RUNNER_TEMP/smoke-empty.nul" "$RUNNER_TEMP/smoke-empty-output"
            grep -q '^count=0$' "$RUNNER_TEMP/smoke-empty-output"

            mkdir -p many
            for number in $(seq 1 1800); do
              printf -v file_name 'many/JavaSource-%04d-abcdefghijklmnop.java' "$number"
              : > "$file_name"
            done
            collect_java_sources . "$RUNNER_TEMP/smoke-large.nul" "$RUNNER_TEMP/smoke-large-links.nul"
            validate_and_batch "$RUNNER_TEMP/smoke-large.nul" "$RUNNER_TEMP/smoke-large-output"
            grep -q '^count=1804$' "$RUNNER_TEMP/smoke-large-output"
            grep -q '"index":1' "$RUNNER_TEMP/smoke-large-output"
          )
          echo "Java source discovery regression checks passed."

          source_list="$RUNNER_TEMP/java-sources.nul"
          symlink_list="$RUNNER_TEMP/java-symlinks.nul"
          if ! collect_java_sources . "$source_list" "$symlink_list"; then
            echo "::error::Java source discovery failed or found unsupported Java symlinks; refusing to skip formatting."
            exit 1
          fi
          validate_and_batch "$source_list" "$GITHUB_OUTPUT"

  java-format:
    name: Google Java Style Validation batch ${{ matrix.index }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover.outputs.batches) }}
    steps:
      - name: Checkout submitted source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check Google Java Style
        uses: ryanbascom/googlejavaformat@9abd254d9183b41942abf6dff7d717ed133f21c2 # v5
        with:
          args: "--set-exit-if-changed"
          files: "${{ matrix.files }}"
          skip-commit: true

  formatter-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout submitted source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Create formatted and unformatted fixtures
        shell: bash
        run: |
          mkdir -p .ci-java-format-smoke
          printf '%s\n' 'final class Smoke {' '  void run() {' '    System.out.println("formatted");' '  }' '}' > .ci-java-format-smoke/Smoke.java
          cp .ci-java-format-smoke/Smoke.java .ci-java-format-smoke/@A.java
          cp .ci-java-format-smoke/Smoke.java .ci-java-format-smoke/--version=.java
          printf '%s\n' 'final class NeedsFormat{void run(){System.out.println("needs formatting");}}' > .ci-java-format-smoke/NeedsFormat.java

      - name: Accept option-like, @ and Unicode paths
        uses: ryanbascom/googlejavaformat@9abd254d9183b41942abf6dff7d717ed133f21c2 # v5
        with:
          args: "--set-exit-if-changed"
          files: "./.ci-java-format-smoke/Smoke.java ./.ci-java-format-smoke/@A.java ./.ci-java-format-smoke/--version=.java"
          skip-commit: true

      - name: Require formatter to reject unformatted source
        id: reject-unformatted
        continue-on-error: true
        uses: ryanbascom/googlejavaformat@9abd254d9183b41942abf6dff7d717ed133f21c2 # v5
        with:
          args: "--set-exit-if-changed"
          files: "./.ci-java-format-smoke/NeedsFormat.java"
          skip-commit: true

      - name: Assert formatting enforcement remains active
        if: steps.reject-unformatted.outcome != 'failure'
        run: |
          echo "::error::Google Java Format did not reject intentionally unformatted source."
          exit 1
