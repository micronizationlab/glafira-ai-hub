
name: JulesOps

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, closed]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write

jobs:
  dispatch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency: julesops-dispatch
    steps:
      - uses: actions/checkout@v5
      - name: JulesOps — task dispatcher
        uses: mkshp-dev/julesops@v0.6.0
        with:
          jules-api-key: ${{ secrets.JULES_API_KEY }}

  sync:
    if: github.event_name == 'pull_request' || github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: JulesOps — status synchronization
        uses: mkshp-dev/julesops@v0.6.0
