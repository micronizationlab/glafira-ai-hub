name: GLAFIRA Windows deployment packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "windows-agent/**"
      - "windows-desktop/**"
      - "release/**"
      - ".github/scripts/release_manifest.py"
      - ".github/workflows/windows-deployment-package.yml"
  push:
    branches: [main]
    paths:
      - "windows-agent/**"
      - "windows-desktop/**"
      - "release/**"
      - ".github/scripts/release_manifest.py"
      - ".github/workflows/windows-deployment-package.yml"

permissions:
  contents: read

jobs:
  publish-agent:
    name: Publish Windows Agent x64 package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate canonical release plan
        shell: pwsh
        run: python .github/scripts/release_manifest.py validate-plan --plan release/release-plan.json --root .

      - name: Validate Agent PowerShell scripts
        shell: pwsh
        run: |
          $paths = @(
            "windows-agent/scripts/publish-agent.ps1",
            "windows-agent/scripts/install-agent.ps1",
            "windows-agent/scripts/update-agent.ps1",
            "windows-agent/scripts/AgentUpdateTransaction.psm1",
            "windows-agent/scripts/tests/test-update-agent.ps1",
            "windows-agent/scripts/uninstall-agent.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error }
          }

      - name: Test Agent staged update and rollback transaction
        shell: pwsh
        run: pwsh -NoProfile -File windows-agent/scripts/tests/test-update-agent.ps1

      - name: Publish self-contained Agent
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "glafira-agent-package"
          $publish = Join-Path $output "publish\win-x64"
          New-Item -ItemType Directory -Path $publish -Force | Out-Null
          dotnet publish windows-agent/GLAFIRA.Agent.Worker/GLAFIRA.Agent.Worker.csproj -c Release -r win-x64 --self-contained true -o $publish
          if ($LASTEXITCODE -ne 0) { throw "Agent publish failed." }
          New-Item -ItemType Directory -Path (Join-Path $output "scripts") -Force | Out-Null
          Copy-Item windows-agent/scripts/install-agent.ps1 (Join-Path $output "scripts")
          Copy-Item windows-agent/scripts/update-agent.ps1 (Join-Path $output "scripts")
          Copy-Item windows-agent/scripts/AgentUpdateTransaction.psm1 (Join-Path $output "scripts")
          Copy-Item windows-agent/scripts/uninstall-agent.ps1 (Join-Path $output "scripts")
          Copy-Item windows-agent/README.md (Join-Path $output "README.md")
          $package = Join-Path $env:RUNNER_TEMP "GLAFIRA-Agent-win-x64.zip"
          $manifest = Join-Path $env:RUNNER_TEMP "GLAFIRA-Agent-win-x64.manifest.json"
          Compress-Archive -Path (Join-Path $output "*") -DestinationPath $package -Force
          python .github/scripts/release_manifest.py build-manifest --plan release/release-plan.json --output $manifest --source-revision $env:GITHUB_SHA --artifact "windows-agent=$package"
          if ($LASTEXITCODE -ne 0) { throw "Agent release manifest generation failed." }
          python .github/scripts/release_manifest.py verify-manifest --plan release/release-plan.json --manifest $manifest --artifact "windows-agent=$package"
          if ($LASTEXITCODE -ne 0) { throw "Agent release manifest verification failed." }

      - name: Upload Agent package
        uses: actions/upload-artifact@v4
        with:
          name: GLAFIRA-Agent-win-x64
          path: |
            ${{ runner.temp }}/GLAFIRA-Agent-win-x64.zip
            ${{ runner.temp }}/GLAFIRA-Agent-win-x64.manifest.json
          if-no-files-found: error
          retention-days: 14

  publish-desktop:
    name: Publish Windows Desktop x64 package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate canonical release plan
        shell: pwsh
        run: python .github/scripts/release_manifest.py validate-plan --plan release/release-plan.json --root .

      - name: Validate Desktop PowerShell scripts
        shell: pwsh
        run: |
          $paths = @(
            "windows-desktop/scripts/publish-desktop.ps1",
            "windows-desktop/scripts/install-desktop.ps1",
            "windows-desktop/scripts/uninstall-desktop.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error }
          }

      - name: Publish self-contained Desktop
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "glafira-desktop-package"
          $publish = Join-Path $output "publish\win-x64"
          New-Item -ItemType Directory -Path $publish -Force | Out-Null
          dotnet publish windows-desktop/GLAFIRA.Desktop.App/GLAFIRA.Desktop.App.csproj -c Release -r win-x64 --self-contained true -o $publish
          if ($LASTEXITCODE -ne 0) { throw "Desktop publish failed." }
          New-Item -ItemType Directory -Path (Join-Path $output "scripts") -Force | Out-Null
          Copy-Item windows-desktop/scripts/install-desktop.ps1 (Join-Path $output "scripts")
          Copy-Item windows-desktop/scripts/uninstall-desktop.ps1 (Join-Path $output "scripts")
          Copy-Item windows-desktop/INSTALL.md (Join-Path $output "INSTALL.md")
          $package = Join-Path $env:RUNNER_TEMP "GLAFIRA-Desktop-win-x64.zip"
          $manifest = Join-Path $env:RUNNER_TEMP "GLAFIRA-Desktop-win-x64.manifest.json"
          Compress-Archive -Path (Join-Path $output "*") -DestinationPath $package -Force
          python .github/scripts/release_manifest.py build-manifest --plan release/release-plan.json --output $manifest --source-revision $env:GITHUB_SHA --artifact "windows-desktop=$package"
          if ($LASTEXITCODE -ne 0) { throw "Desktop release manifest generation failed." }
          python .github/scripts/release_manifest.py verify-manifest --plan release/release-plan.json --manifest $manifest --artifact "windows-desktop=$package"
          if ($LASTEXITCODE -ne 0) { throw "Desktop release manifest verification failed." }

      - name: Upload Desktop package
        uses: actions/upload-artifact@v4
        with:
          name: GLAFIRA-Desktop-win-x64
          path: |
            ${{ runner.temp }}/GLAFIRA-Desktop-win-x64.zip
            ${{ runner.temp }}/GLAFIRA-Desktop-win-x64.manifest.json
          if-no-files-found: error
          retention-days: 14
