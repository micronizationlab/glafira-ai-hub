# CodeRabbit configuration for GLAFIRA AI HUB
language: ru-RU

reviews:
  profile: assertive
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/*.lock"
  path_instructions:
    - path: "**/*.kt"
      instructions: >
        Проверяй Kotlin-код на корректность null-safety, structured concurrency,
        отмену корутин, утечки Context/Activity, безопасность потоков, обработку
        ошибок и совместимость с установленными версиями Android/Compose.
        Не предлагай необоснованные зависимости или переписывание архитектуры.
    - path: "**/*"
      instructions: >
        Проект GLAFIRA AI HUB развивается по модульной архитектуре. Проверяй
        обратную совместимость, границы модулей, миграции и целостность данных,
        безопасность персональных данных, корректность восстановления после
        сбоев, тестируемость и соответствие документированной архитектуре.
        Для SQLite, очередей, ACK, recovery и backup особенно тщательно проверяй
        транзакционность, идемпотентность, гонки, потерю/дублирование задач и
        сценарии частичного отказа. Не считай отсутствие теста доказательством
        бага: указывай конкретный риск и воспроизводимый сценарий.
        Не предлагай удалять существующую функциональность без доказанной причины.
        Все замечания формулируй на русском языке с уровнем критичности,
        объяснением последствий и конкретным способом проверки/исправления.

chat:
  auto_reply: true
